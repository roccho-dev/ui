<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Semantic Map</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../styles/styles.css">
<link rel="stylesheet" href="../styles/handoff.css">
<link rel="stylesheet" href="../styles/review.css">
<link rel="stylesheet" href="../styles/source.css">
</head>
<body>
<main class="app-shell" id="app-shell">
<header class="topbar">
<div class="brand"><p class="eyebrow">Semantic Map</p><h1 id="map-title">Loading</h1></div>
<div class="topbar-actions">
<div class="pattern-switcher" aria-label="Scene Pattern">
<label><span>Pattern</span><select data-state-control disabled id="pattern-select">
<option value="map/1">Map</option><option value="graph/1">Graph</option><option value="seq/1">Seq</option><option value="chart/1">Chart</option>
</select></label>
<label hidden id="seq-preset-wrap"><span>Seq</span><select data-state-control disabled id="seq-preset">
<option value="actor:ordinal">Sequence / Swimlane</option><option value="task:calendar">Gantt</option><option value="actor:calendar">Actor timeline</option><option value="task:ordinal">Task order</option>
</select></label>
</div>
<button aria-controls="source-layer" aria-haspopup="dialog" class="source-open" data-state-control disabled id="source-open" type="button">SRC</button>
<a class="help-link" href="/help" aria-label="Help">?</a>
</div>
</header>
<section aria-label="Semantic map editor" class="workspace">
<div aria-label="Zoomable editable semantic map" data-tool="select" id="graph-container" role="application"></div>
<aside aria-label="Resource composition target" class="resource-element-host" data-resource-target="element:resource-panel" hidden id="resource-panel"></aside>
<aside aria-label="Sandboxed document target" class="resource-document-host" data-resource-target="element:document-panel" hidden id="resource-document-panel"></aside>
<section class="route-state" id="route-state" aria-live="polite"><h2 id="route-state-title">Loading</h2><p id="route-state-message"></p><a href="/help">Help</a></section>
<aside aria-live="polite" class="status"><output id="zoom-label">—</output><span id="resolution-label">not loaded</span><span id="scene-label"></span><span id="draft-label">draft 0</span></aside>
<div aria-live="polite" class="toast" hidden id="toast" role="status"></div>
<button class="semantic-id-chip" hidden id="semantic-id-chip" title="Copy stable element ID" type="button"><span class="id-kind" id="semantic-id-kind">ID</span><code id="semantic-id-value"></code><span aria-hidden="true" class="id-copy">⧉</span></button>
<nav class="editor-dock" aria-label="Editor actions">
<button data-state-control disabled id="add-node" title="Add node" type="button"><span aria-hidden="true">＋</span><span>追加</span></button>
<button data-state-control disabled id="undo" title="Undo" type="button"><span aria-hidden="true">↶</span><span>戻す</span></button>
<button data-state-control disabled id="redo" title="Redo" type="button"><span aria-hidden="true">↷</span><span>進む</span></button>
<button data-state-control disabled id="delete" title="Delete selection" type="button"><span aria-hidden="true">⌫</span><span>削除</span></button>
<button data-state-control disabled id="open-link" title="Open selected region link" type="button"><span aria-hidden="true">↗</span><span>開く</span></button>
<button aria-controls="handoff-layer" aria-haspopup="dialog" class="handoff-fab" data-state-control disabled id="handoff-fab" type="button"><span aria-hidden="true">AI</span><span>渡す</span><b class="handoff-count" id="handoff-draft-count">0</b></button>
</nav>
</section>
</main>
<div class="handoff-layer" hidden id="handoff-layer"><section class="handoff-sheet"><button id="handoff-close" type="button">×</button><span id="handoff-selected-id"></span><textarea id="handoff-request"></textarea><output id="handoff-text-size"></output><output id="handoff-image-size"></output><button id="handoff-copy-text" type="button"></button><button id="handoff-copy-image" type="button"></button><output id="handoff-copy-status"></output><button id="handoff-copy-state" type="button"></button><button id="handoff-copy-log" type="button"></button><button id="handoff-copy-envelope" type="button"></button><output id="handoff-source-status"></output></section></div>
<div class="source-layer" hidden id="source-layer"><section class="source-sheet"><button id="source-close" type="button">×</button><select id="source-format"><option value="state">State JSONL</option><option value="log">DecisionLog JSONL</option><option value="envelope">Envelope JSON</option></select><textarea id="source-output" readonly></textarea><output id="source-status"></output><button id="source-copy" type="button"></button></section></div>
<div class="review-layer" hidden id="review-layer"><section class="review-sheet"><button id="review-close" type="button">×</button><output id="review-source"></output><output id="review-delivery">Decision only</output><output id="review-status"></output><div hidden id="review-preview-panel"><output id="review-base-label"></output><output id="review-delta-summary"></output><code id="review-base-head"></code><code id="review-proposal-parent"></code><code id="review-proposal-id"></code><code id="review-proposal-digest"></code><code id="review-before-hash"></code><code id="review-after-hash"></code><p id="review-reason"></p><div hidden id="review-assessment-wrap"><p id="review-assessment"></p></div><ul hidden id="review-source-refs"></ul><ol id="review-diff"></ol><code id="review-before-url"></code><code id="review-after-url"></code><button id="review-accept" type="button"></button><button id="review-reject" type="button"></button><button id="review-copy-before" type="button"></button><button id="review-copy-after" type="button"></button></div></section></div>
<script id="semantic-page-config" type="application/json">{"route":"app","mode":"embedded","title":"Semantic Map","mapId":"","view":{"pattern":"map/1"},"artifactStore":null}</script>
<script id="semantic-initial-state" type="application/x-ndjson"></script>
<script type="module" src="../index.js"></script>
</body>
</html>
