name: Chart data URL codec proof

on:
  push:
    branches:
      - proof/chart-data-url-codec-260915

permissions:
  contents: read

env:
  SOURCE_SHA: b682eef6cbe7f5a0ff2a76618a515d3e73216c91
  DEPLOY_ROOT: https://b42d7007.stg-artifact-runtime.pages.dev

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate pie and heatmap canonical #data URLs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chart-data-url-proof"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createUrlModuleUrl, readUrlModule } from './packages/url-module/src/codec.mjs';
          const targets = Object.freeze({ pie: 'share-0', heatmap: 'tokyo-am' });
          const specs = [];
          for (const [variant, targetId] of Object.entries(targets)) {
            const records = fs.readFileSync(`examples/chart/${variant}.jsonl`, 'utf8')
              .split(/\r?\n/u).filter(Boolean).map(line => JSON.parse(line));
            const target = records.find(record => record.type === 'region' && record.id === targetId);
            if (!target) throw new Error(`${variant}: target missing`);
            const sentinel = `__url_data_${variant}__`;
            target.label = sentinel;
            const value = records.map(record => JSON.stringify(record)).join('\n') + '\n';
            const url = await createUrlModuleUrl({
              base: `${process.env.DEPLOY_ROOT}/adapters/chart/${variant}/`, fragment: 'data', value,
            });
            if (await readUrlModule({ fragment: 'data', input: url }) !== value) throw new Error(`${variant}: round trip mismatch`);
            specs.push({ variant, targetId, sentinel, chars: url.length, url });
          }
          fs.writeFileSync(process.env.RUNNER_TEMP + '/chart-data-url-proof/specs.json', JSON.stringify(specs, null, 2));
          NODE
      - name: Install pinned Chromium proof tooling
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.57.0"
          python3 -m playwright install --with-deps chromium
      - name: Prove pie and heatmap #data with Playwright
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out = Path(os.environ['RUNNER_TEMP']) / 'chart-data-url-proof'
          specs = json.loads((out / 'specs.json').read_text(encoding='utf-8'))
          results = []
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for spec in specs:
                  page_errors = []
                  failed = []
                  requests = []
                  page = browser.new_page(viewport={'width': 1440, 'height': 1000})
                  page.on('pageerror', lambda exc, page_errors=page_errors: page_errors.append(str(exc)))
                  page.on('request', lambda req, requests=requests: requests.append(req.url))
                  page.on('requestfailed', lambda req, failed=failed: failed.append({'url': req.url, 'failure': req.failure}))
                  response = page.goto(spec['url'], wait_until='domcontentloaded', timeout=30_000)
                  assert response is not None and response.ok, f"{spec['variant']}: HTTP failed"
                  page.wait_for_selector('html[data-status="pass"]', timeout=60_000)
                  label = page.evaluate(
                      """regionId => window.semanticMapSite?.editor?.snapshot().domain.regions.find(item => item.id === regionId)?.label ?? null""",
                      spec['targetId'],
                  )
                  assert label == spec['sentinel'], f"{spec['variant']}: domain label {label!r}"
                  assert spec['sentinel'] in page.locator('body').inner_text(), f"{spec['variant']}: sentinel absent from DOM"
                  fallback = [url for url in requests if url.split('?', 1)[0].endswith('/input.json')]
                  assert not fallback, f"{spec['variant']}: fallback fetched {fallback}"
                  assert not page_errors, f"{spec['variant']}: page errors {page_errors}"
                  assert not failed, f"{spec['variant']}: request failures {failed}"
                  result = {
                      **spec,
                      'status': 'PASS',
                      'domainFromHash': True,
                      'domFromHash': True,
                      'inputJsonFallbackRequests': fallback,
                      'pageErrors': page_errors,
                      'requestFailed': failed,
                  }
                  results.append(result)
                  print(json.dumps(result, ensure_ascii=False))
                  page.close()
              browser.close()
          (out / 'receipt.json').write_text(json.dumps({
              'schema': 'ui.chart-data-url-playwright-diagnostic/2',
              'status': 'PASS',
              'sourceSha': os.environ['SOURCE_SHA'],
              'immutableDeployment': os.environ['DEPLOY_ROOT'],
              'variants': results,
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-data-url-playwright-diagnostic
          path: ${{ runner.temp }}/chart-data-url-proof
          if-no-files-found: error
