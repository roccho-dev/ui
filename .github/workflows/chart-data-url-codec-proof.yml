name: Chart data URL codec proof

on:
  push:
    branches:
      - proof/chart-data-url-codec-260915

permissions:
  contents: read

env:
  SOURCE_SHA: b682eef6cbe7f5a0ff2a76618a515d3e73216c91
  DEPLOY_ROOT: https://b42d7007.stg-artifact-runtime.pages.dev

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate eight canonical #data URLs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chart-data-url-proof"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createUrlModuleUrl, readUrlModule } from './packages/url-module/src/codec.mjs';
          const targets = Object.freeze({
            'bar-horizontal': 'product',
            'bar-vertical': 'sales-0',
            line: 'active-0',
            pie: 'share-0',
            donut: 'share-0',
            scatter: 'growth-a',
            heatmap: 'tokyo-am',
            sunburst: 'product',
          });
          const specs = [];
          for (const [variant, targetId] of Object.entries(targets)) {
            const records = fs.readFileSync(`examples/chart/${variant}.jsonl`, 'utf8')
              .split(/\r?\n/u).filter(Boolean).map(line => JSON.parse(line));
            const target = records.find(record => record.type === 'region' && record.id === targetId);
            if (!target) throw new Error(`${variant}: target missing`);
            const sentinel = `__url_data_${variant.replaceAll('-', '_')}__`;
            target.label = sentinel;
            const value = records.map(record => JSON.stringify(record)).join('\n') + '\n';
            const url = await createUrlModuleUrl({
              base: `${process.env.DEPLOY_ROOT}/adapters/chart/${variant}/`,
              fragment: 'data',
              value,
            });
            if (!url.includes('#data=')) throw new Error(`${variant}: #data missing`);
            if (url.length > 8192) throw new Error(`${variant}: URL too long: ${url.length}`);
            if (await readUrlModule({ fragment: 'data', input: url }) !== value) throw new Error(`${variant}: round trip mismatch`);
            specs.push({ variant, targetId, sentinel, chars: url.length, url });
            console.log(JSON.stringify(specs.at(-1)));
          }
          fs.writeFileSync(process.env.RUNNER_TEMP + '/chart-data-url-proof/specs.json', JSON.stringify(specs, null, 2));
          NODE
      - name: Prove all eight deployed #data URLs
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const out = process.env.RUNNER_TEMP + '/chart-data-url-proof';
          const specs = JSON.parse(fs.readFileSync(out + '/specs.json', 'utf8'));
          const chrome = ['google-chrome','google-chrome-stable','chromium']
            .map(name => spawnSync('bash', ['-lc', `command -v ${name} || true`], {encoding:'utf8'}).stdout.trim())
            .find(Boolean);
          if (!chrome) throw new Error('Chrome is required');
          const results = [];
          for (const spec of specs) {
            const run = spawnSync(chrome, [
              '--headless=new','--no-sandbox','--disable-gpu','--virtual-time-budget=30000','--dump-dom',spec.url,
            ], {encoding:'utf8', maxBuffer:8*1024*1024});
            const html = run.stdout;
            const pass = /data-status="pass"/u.test(html);
            const sentinelRendered = html.includes(spec.sentinel);
            const fatal = (html.match(/<output[^>]*id="fatal"[^>]*>([\s\S]*?)<\/output>/u)?.[1] ?? '')
              .replace(/<[^>]+>/gu, '').trim();
            const result = { ...spec, pass, sentinelRendered, fatal };
            results.push(result);
            fs.writeFileSync(`${out}/${spec.variant}.html`, html);
            console.log(JSON.stringify(result));
            if (!pass || !sentinelRendered) process.exitCode = 1;
          }
          const receipt = {
            schema: 'ui.chart-data-url-codec-proof/2',
            status: process.exitCode ? 'FAIL' : 'PASS',
            sourceSha: process.env.SOURCE_SHA,
            immutableDeployment: process.env.DEPLOY_ROOT,
            stableAlias: 'https://ui-deploy-pr-224.stg-artifact-runtime.pages.dev',
            variants: results,
          };
          fs.writeFileSync(out + '/receipt.json', JSON.stringify(receipt, null, 2));
          console.log(JSON.stringify(receipt));
          if (process.exitCode) process.exit(1);
          NODE
      - name: Trace publication browser proof
        if: always()
        run: |
          set +e
          bash -x apps/artifact-shell/tests/prove-publication-browser.sh "$DEPLOY_ROOT" > "$RUNNER_TEMP/chart-data-url-proof/browser-proof.log" 2>&1
          code=$?
          echo "browser-proof-exit=$code"
          tail -n 80 "$RUNNER_TEMP/chart-data-url-proof/browser-proof.log"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-data-url-codec-proof
          path: ${{ runner.temp }}/chart-data-url-proof
          if-no-files-found: error
