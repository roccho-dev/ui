name: Chart data URL codec proof

on:
  push:
    branches:
      - proof/chart-data-url-codec-260915

permissions:
  contents: read

env:
  SOURCE_SHA: b682eef6cbe7f5a0ff2a76618a515d3e73216c91
  DEPLOY_ROOT: https://b42d7007.stg-artifact-runtime.pages.dev

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate one nested canonical #data URL
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chart-data-url-proof"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createUrlModuleUrl, readUrlModule } from './packages/url-module/src/codec.mjs';
          const records = fs.readFileSync('examples/chart/bar-horizontal.jsonl', 'utf8')
            .split(/\r?\n/u).filter(Boolean).map(line => JSON.parse(line));
          const target = records.find(record => record.type === 'region' && record.id === 'product');
          target.label = '__nested_data_diag__';
          const value = records.map(record => JSON.stringify(record)).join('\n') + '\n';
          const url = await createUrlModuleUrl({
            base: `${process.env.DEPLOY_ROOT}/adapters/chart/bar-horizontal/`,
            fragment: 'data',
            value,
          });
          if (await readUrlModule({ fragment: 'data', input: url }) !== value) throw new Error('round trip failed');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/chart-data-url-proof/url.txt', url);
          console.log(url);
          NODE
      - name: Diagnose nested #data route
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/chart-data-url-proof"
          url="$(cat "$out/url.txt")"
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          "$chrome" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=30000 --dump-dom "$url" > "$out/page.html"
          grep -E 'BLOCKED|data-status=|id="fatal"|__nested_data_diag__' "$out/page.html" || true
          if grep -q 'data-status="pass"' "$out/page.html" && grep -q '__nested_data_diag__' "$out/page.html"; then
            echo PASS
          else
            echo FAIL
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-data-url-codec-diagnostic
          path: ${{ runner.temp }}/chart-data-url-proof
          if-no-files-found: error
