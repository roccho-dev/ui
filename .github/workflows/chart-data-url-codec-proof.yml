name: Chart data URL codec proof

on:
  push:
    branches:
      - proof/chart-data-url-codec-260915

permissions:
  contents: read

env:
  SOURCE_SHA: 9ad5180eac4da3439e38f112e36a1bbb355d7096
  DEPLOY_ROOT: https://0ad7316d.stg-artifact-runtime.pages.dev

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate canonical #data URLs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chart-data-url-proof"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createUrlModuleUrl, readUrlModule } from './packages/url-module/src/codec.mjs';

          const root = process.env.DEPLOY_ROOT;
          const targets = Object.freeze({
            'bar-horizontal': 'product',
            'bar-vertical': 'sales-0',
            line: 'active-0', pie: 'share-0', donut: 'share-0',
            scatter: 'growth-a', heatmap: 'tokyo-am', sunburst: 'product',
          });
          const specs = [];
          for (const [variant, targetId] of Object.entries(targets)) {
            const records = fs.readFileSync(`examples/chart/${variant}.jsonl`, 'utf8')
              .split(/\r?\n/u).filter(Boolean).map(line => JSON.parse(line));
            const target = records.find(record => record.type === 'region' && record.id === targetId);
            if (!target) throw new Error(`${variant}: target missing`);
            const sentinel = `__url_data_${variant.replaceAll('-', '_')}__`;
            target.label = sentinel;
            const value = records.map(record => JSON.stringify(record)).join('\n') + '\n';
            const url = await createUrlModuleUrl({
              base: `${root}/adapters/chart/${variant}/`, fragment: 'data', value,
            });
            if (await readUrlModule({ fragment: 'data', input: url }) !== value) throw new Error(`${variant}: round trip`);
            if (url.length > 8192) throw new Error(`${variant}: URL too long`);
            specs.push({ variant, targetId, sentinel, chars: url.length, url });
          }
          const rootRecords = fs.readFileSync('examples/chart/bar-horizontal.jsonl', 'utf8')
            .split(/\r?\n/u).filter(Boolean).map(line => JSON.parse(line));
          rootRecords.find(record => record.type === 'region' && record.id === 'product').label = '__url_data_root_control__';
          const rootValue = rootRecords.map(record => JSON.stringify(record)).join('\n') + '\n';
          const rootUrl = await createUrlModuleUrl({ base: `${root}/adapters/chart/`, fragment: 'data', value: rootValue });
          fs.writeFileSync(process.env.RUNNER_TEMP + '/chart-data-url-proof/specs.json', JSON.stringify({ rootUrl, specs }, null, 2));
          for (const spec of specs) console.log(JSON.stringify(spec));
          console.log(JSON.stringify({ control: 'chart-root', url: rootUrl, chars: rootUrl.length }));
          NODE
      - name: Prove root control and diagnose eight nested routes
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          out="$RUNNER_TEMP/chart-data-url-proof"
          root_url="$(node -e 'console.log(require(process.argv[1]).rootUrl)' "$out/specs.json")"
          "$chrome" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom "$root_url" > "$out/root.html"
          grep -q 'data-status="pass"' "$out/root.html"
          grep -q '__url_data_root_control__' "$out/root.html"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const out = process.env.RUNNER_TEMP + '/chart-data-url-proof';
          const { specs } = JSON.parse(fs.readFileSync(out + '/specs.json', 'utf8'));
          const chrome = process.env.CHROME_BIN || ['google-chrome','google-chrome-stable','chromium']
            .map(name => spawnSync('bash', ['-lc', `command -v ${name} || true`], {encoding:'utf8'}).stdout.trim())
            .find(Boolean);
          const results = [];
          for (const spec of specs) {
            const run = spawnSync(chrome, ['--headless=new','--no-sandbox','--disable-gpu','--virtual-time-budget=15000','--dump-dom',spec.url], {encoding:'utf8', maxBuffer: 8*1024*1024});
            const html = run.stdout;
            const status = /data-status="pass"/u.test(html) ? 'PASS' : /data-status="fail"/u.test(html) ? 'FAIL' : 'UNKNOWN';
            const fatal = (html.match(/<output[^>]*id="fatal"[^>]*>([\s\S]*?)<\/output>/u)?.[1] ?? '').replace(/<[^>]+>/gu, '').trim();
            const sentinel = html.includes(spec.sentinel);
            const result = { ...spec, status, sentinelRendered: sentinel, fatal };
            results.push(result);
            console.log(JSON.stringify(result));
            fs.writeFileSync(`${out}/${spec.variant}.html`, html);
          }
          const receipt = {
            schema: 'ui.chart-data-url-codec-diagnostic/1',
            sourceSha: process.env.SOURCE_SHA,
            deployRoot: process.env.DEPLOY_ROOT,
            rootControl: 'PASS',
            variants: results,
          };
          fs.writeFileSync(out + '/receipt.json', JSON.stringify(receipt, null, 2));
          if (results.some(result => result.status !== 'PASS' || !result.sentinelRendered)) process.exit(1);
          NODE
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-data-url-codec-proof
          path: ${{ runner.temp }}/chart-data-url-proof
          if-no-files-found: error
