name: Chart data URL codec proof

on:
  push:
    branches:
      - proof/chart-data-url-codec-260915

permissions:
  contents: read

env:
  SOURCE_SHA: 9ad5180eac4da3439e38f112e36a1bbb355d7096
  DEPLOY_ROOT: https://0ad7316d.stg-artifact-runtime.pages.dev

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate eight canonical #data URLs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chart-data-url-proof"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createUrlModuleUrl, readUrlModule } from './packages/url-module/src/codec.mjs';

          const root = process.env.DEPLOY_ROOT;
          const out = process.env.RUNNER_TEMP + '/chart-data-url-proof/urls.json';
          const targets = Object.freeze({
            'bar-horizontal': 'product',
            'bar-vertical': 'sales-0',
            line: 'active-0',
            pie: 'share-0',
            donut: 'share-0',
            scatter: 'growth-a',
            heatmap: 'tokyo-am',
            sunburst: 'product',
          });
          const receipts = [];
          for (const [variant, targetId] of Object.entries(targets)) {
            const source = fs.readFileSync(`examples/chart/${variant}.jsonl`, 'utf8');
            const records = source.split(/\r?\n/u).filter(Boolean).map(line => JSON.parse(line));
            const target = records.find(record => record.type === 'region' && record.id === targetId);
            if (!target) throw new Error(`${variant}: target ${targetId} missing`);
            const sentinel = `__url_data_${variant.replaceAll('-', '_')}__`;
            target.label = sentinel;
            const value = records.map(record => JSON.stringify(record)).join('\n') + '\n';
            const base = `${root}/adapters/chart/${variant}/`;
            const url = await createUrlModuleUrl({ base, fragment: 'data', value });
            if (!url.includes('#data=')) throw new Error(`${variant}: #data missing`);
            if (url.length > 8192) throw new Error(`${variant}: URL too long: ${url.length}`);
            const decoded = await readUrlModule({ fragment: 'data', input: url });
            if (decoded !== value) throw new Error(`${variant}: codec round trip mismatch`);
            const receipt = { variant, targetId, sentinel, chars: url.length, url };
            receipts.push(receipt);
            console.log(JSON.stringify(receipt));
          }
          fs.writeFileSync(out, JSON.stringify(receipts, null, 2));
          NODE
      - name: Install pinned Chromium proof tooling
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.57.0"
          python3 -m playwright install --with-deps chromium
      - name: Prove deployed #data override in Chromium
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out = Path(os.environ['RUNNER_TEMP']) / 'chart-data-url-proof'
          urls = json.loads((out / 'urls.json').read_text(encoding='utf-8'))
          receipts = []
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for spec in urls:
                  page_errors = []
                  failed = []
                  requests = []
                  page = browser.new_page(viewport={'width': 1440, 'height': 1000})
                  page.on('pageerror', lambda exc, page_errors=page_errors: page_errors.append(str(exc)))
                  page.on('request', lambda req, requests=requests: requests.append(req.url))
                  page.on('requestfailed', lambda req, failed=failed: failed.append({'url': req.url, 'failure': req.failure}))
                  response = page.goto(spec['url'], wait_until='networkidle', timeout=60_000)
                  assert response is not None and response.ok, (spec['variant'], response.status if response else None)
                  page.wait_for_selector('html[data-status="pass"]', timeout=60_000)
                  label = page.evaluate(
                      """regionId => window.semanticMapSite?.editor?.snapshot().domain.regions.find(item => item.id === regionId)?.label ?? null""",
                      spec['targetId'],
                  )
                  assert label == spec['sentinel'], f"{spec['variant']}: domain did not come from #data: {label!r}"
                  active = page.locator(f'button[data-active-key="region:{spec["targetId"]}"]')
                  active.wait_for(state='visible', timeout=10_000)
                  assert spec['sentinel'] in (active.text_content() or ''), f"{spec['variant']}: sentinel missing from DOM"
                  fallback_requests = [url for url in requests if url.split('?', 1)[0].endswith('/input.json')]
                  assert not fallback_requests, f"{spec['variant']}: input.json fallback was fetched: {fallback_requests}"
                  assert not page_errors, f"{spec['variant']}: page errors: {page_errors}"
                  assert not failed, f"{spec['variant']}: failed requests: {failed}"
                  receipt = {
                      'variant': spec['variant'],
                      'status': 'PASS',
                      'url': spec['url'],
                      'chars': spec['chars'],
                      'targetId': spec['targetId'],
                      'sentinel': spec['sentinel'],
                      'domainFromHash': True,
                      'domFromHash': True,
                      'inputJsonFallbackRequests': fallback_requests,
                      'pageErrors': page_errors,
                      'requestFailed': failed,
                  }
                  receipts.append(receipt)
                  print(json.dumps(receipt, ensure_ascii=False))
                  page.close()
              browser.close()
          final = {
              'schema': 'ui.chart-data-url-codec-proof/1',
              'status': 'PASS',
              'sourceSha': os.environ['SOURCE_SHA'],
              'deployRoot': os.environ['DEPLOY_ROOT'],
              'variants': receipts,
          }
          (out / 'receipt.json').write_text(json.dumps(final, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(final, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-data-url-codec-proof
          path: ${{ runner.temp }}/chart-data-url-proof
          if-no-files-found: error
