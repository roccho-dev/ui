name: Temporary shortcut Pages proof

on:
  push:
    branches:
      - chore/maxgraph-authoring-consolidation-260914

permissions:
  contents: read

jobs:
  pages-proof:
    runs-on: ubuntu-latest
    environment: ui-deploy
    env:
      PROJECT_NAME: ui-maxgraph-authoring-217
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build standalone publication
        run: node apps/artifact-shell/scripts/build-publication.mjs --out=generated/ui-maxgraph-authoring-217
      - name: Deploy publication
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy generated/ui-maxgraph-authoring-217 \
            --project-name="${PROJECT_NAME}" \
            --branch="${GITHUB_REF_NAME}"
      - name: Resolve deployed URL
        run: |
          set -euo pipefail
          base="https://${PROJECT_NAME}.pages.dev"
          for attempt in $(seq 1 30); do
            if curl -fsS "$base/index.html" >/dev/null; then
              echo "ARTIFACT_SHELL_BASE_URL=$base" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Install pinned browser proof tooling
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.57.0"
          python3 -m playwright install --with-deps chromium
      - name: Resolve pinned Chromium
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(f"CHROMIUM_EXECUTABLE={playwright.chromium.executable_path}")
          PY
      - name: Prove keyboard shortcuts on deployed Pages
        run: python3 apps/artifact-shell/tests/maxgraph-keyboard-shortcuts-browser-proof.py
      - name: Reprove visible edge handle on deployed Pages
        run: python3 apps/artifact-shell/tests/maxgraph-edge-hit-target-browser-proof.py
