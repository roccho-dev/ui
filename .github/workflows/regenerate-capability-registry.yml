name: Regenerate capability registry

on:
  push:
    branches:
      - feat/t271-data-pin

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/t271-data-pin
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate canonical registry
        run: node apps/artifact-shell/scripts/build-registry.mjs
      - name: Commit generated projection
        shell: bash
        run: |
          if git diff --quiet -- apps/artifact-shell/generated/capability-registry.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/artifact-shell/generated/capability-registry.mjs
          git commit -m "chore: regenerate capability registry"
          git push origin HEAD:feat/t271-data-pin
