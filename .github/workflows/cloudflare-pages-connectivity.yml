name: Artifact Shell Pages proof

on:
  pull_request:
    paths:
      - .github/workflows/cloudflare-pages-connectivity.yml
      - apps/artifact-shell/**
      - examples/**
      - packages/comptime/**
      - packages/control/**
      - packages/graph-editor/**
      - packages/presentation/**
      - packages/a2ui-browser/**
      - packages/semantic-map/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ui-deploy
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: stg-artifact-runtime
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require deploy configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test "$CLOUDFLARE_PAGES_PROJECT" = "stg-artifact-runtime"

      - name: Check architecture
        shell: bash
        run: |
          set -euo pipefail
          test ! -e apps/artifact-shell/adapters/shell.mjs
          test ! -e apps/artifact-shell/adapters/control-reference.mjs
          test ! -e apps/artifact-shell/adapters/graph-reference.mjs
          test ! -e apps/artifact-shell/publication/build-feature-page.mjs
          test ! -e packages/control/ui
          test ! -e packages/graph-editor/ui
          test ! -e packages/presentation/ui
          ! grep -R -nE 'files:[[:space:]]*Object\.freeze' packages/control/feature.mjs packages/graph-editor/feature.mjs packages/presentation/feature.mjs
          ! grep -R -nE '(^|[^[:alnum:]_])class[[:space:]]+[[:alnum:]_$]+' apps/artifact-shell/adapters apps/artifact-shell/publication apps/artifact-shell/src/adapter.mjs apps/artifact-shell/mode.mjs packages/comptime packages/control packages/graph-editor packages/presentation
          ! grep -R -nE 'export[[:space:]]+default' apps/artifact-shell/adapters apps/artifact-shell/publication apps/artifact-shell/src/adapter.mjs apps/artifact-shell/mode.mjs packages/comptime packages/control packages/graph-editor packages/presentation
          for file in apps/artifact-shell/adapters/*.mjs apps/artifact-shell/publication/*.mjs apps/artifact-shell/src/adapter.mjs apps/artifact-shell/mode.mjs packages/comptime/*.mjs packages/control/*.mjs packages/control/src/*.mjs packages/graph-editor/*.mjs packages/graph-editor/src/*.mjs packages/presentation/*.mjs packages/presentation/compiler/*.mjs packages/presentation/render/*.mjs; do node --check "$file"; done

      - name: Build publication once
        shell: bash
        run: |
          set -euo pipefail
          node apps/artifact-shell/scripts/build-publication.mjs --out=dist
          test -s dist/index.html
          test -s dist/catalog.json
          test -s dist/artifact-manifest.json
          test ! -e dist/features
          for adapter in graph map seq presentation control graph-editor; do test -s "dist/adapters/$adapter/index.html"; done
          for adapter in graph map seq; do test -s "dist/adapters/$adapter/adapter.json"; done
          for feature in presentation control graph-editor; do
            test -s "dist/adapters/$feature/feature.json"
            test -s "dist/adapters/$feature/input.json"
            test ! -e "dist/adapters/$feature/adapter.json"
          done
          test -s dist/modules/packages/presentation/render.mjs
          test -s dist/modules/packages/presentation/render/catalog.mjs
          test -s dist/modules/packages/control/render.mjs
          test -s dist/modules/packages/graph-editor/render.mjs
          test -s dist/modules/packages/semantic-map/vendor/maxgraph/view/BaseGraph.js
          ! grep -R -nE 'stg-mobile-agent|raw\.githubusercontent\.com' dist/adapters/presentation dist/adapters/control dist/adapters/graph-editor dist/modules/packages/presentation dist/modules/packages/control dist/modules/packages/graph-editor

      - name: Deploy preview and exact-byte readback
        id: deploy
        shell: bash
        env:
          PREVIEW_BRANCH: ui-deploy-pr-${{ github.event.pull_request.number || github.run_id }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          set +e
          output="$(npx --yes wrangler@4.112.0 pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$head_sha" \
            --commit-message 'Artifact Shell direct generic feature proof' 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 0
          deployment="$(printf '%s\n' "$output" | grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' | head -n1)"
          test -n "$deployment"
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
          for path in index.html catalog.json artifact-manifest.json; do
            curl --fail --silent --show-error --location "$deployment/$path" --output "$RUNNER_TEMP/remote-$path"
            cmp "dist/$path" "$RUNNER_TEMP/remote-$path"
          done

      - name: Prove direct features and invocation adapters in Chrome
        shell: bash
        env:
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment }}
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          root="$RUNNER_TEMP/root.html"
          "$chrome" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "$DEPLOYMENT/" > "$root"
          for adapter in graph map seq presentation control graph-editor; do grep -q "href=\"adapters/$adapter/\"" "$root"; done
          ! grep -q 'adapters/shell/' "$root"

          check_feature() {
            name="$1"; budget="$2"; shift 2
            output="$RUNNER_TEMP/feature-$name.html"
            "$chrome" --headless=new --no-sandbox --disable-gpu --virtual-time-budget="$budget" --dump-dom "$DEPLOYMENT/adapters/$name/" > "$output"
            if ! grep -q 'data-status="pass"' "$output"; then
              echo "feature=$name failed"
              grep -E 'BLOCKED|fatal|data-status=' "$output" || true
              exit 1
            fi
            for pattern in "$@"; do grep -q "$pattern" "$output"; done
          }
          check_feature presentation 30000 'class="profiled-app"' 'class="seq-svg"'
          check_feature control 15000 'id="tree"' 'class="node"'
          check_feature graph-editor 30000 'class="roccho-graph-editor"' 'roccho-graph-editor__canvas' '<svg' 'roccho-graph-editor__projection'

          for adapter in graph map seq; do
            output="$RUNNER_TEMP/adapter-$adapter.html"
            "$chrome" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=30000 --dump-dom "$DEPLOYMENT/adapters/$adapter/" > "$output"
            grep -q 'data-adapter-status="pass"' "$output"
            grep -q '>PASS</output>' "$output"
          done
          printf '%s\n' '{"schema":"ui.adapter-browser-proof/6","status":"PASS","directFeatures":["presentation","control","graph-editor"],"invocationAdapters":["graph","map","seq"],"host":"generic"}'

      - name: Emit proof receipt
        shell: bash
        env:
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment }}
        run: |
          set -euo pipefail
          python3 - "$DEPLOYMENT" dist/catalog.json dist/artifact-manifest.json <<'PY'
          import hashlib, json, pathlib, sys
          deployment = sys.argv[1]
          catalog = json.loads(pathlib.Path(sys.argv[2]).read_text())
          manifest = pathlib.Path(sys.argv[3]).read_bytes()
          print(json.dumps({
              "schema": "ui.artifact-shell-pages-proof/6",
              "status": "PASS",
              "deployment": deployment,
              "project": "stg-artifact-runtime",
              "mode": "preview-examples-only",
              "host": "generic",
              "directFeatures": ["presentation", "control", "graph-editor"],
              "invocationAdapters": ["graph", "map", "seq"],
              "capabilities": [f"{x['capability']['id']}@{x['capability']['version']}" for x in catalog["capabilities"]],
              "artifact_manifest_sha256": hashlib.sha256(manifest).hexdigest(),
          }, separators=(",", ":")))
          PY
