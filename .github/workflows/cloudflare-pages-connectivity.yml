name: Artifact Shell Pages proof

on:
  pull_request:
    paths:
      - .github/workflows/cloudflare-pages-connectivity.yml
      - apps/artifact-shell/**
      - examples/**
      - packages/comptime/**
      - packages/control/**
      - packages/graph-editor/**
      - packages/presentation/**
      - packages/a2ui-browser/**
      - packages/semantic-map/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ui-deploy
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: stg-artifact-runtime
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true

      - name: Apply one-shot maxGraph factory migration
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/refactor-maxgraph-adapter-factory.mjs
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add packages/semantic-map/renderer-maxgraph/adapter.js packages/semantic-map/renderer-maxgraph/index.js packages/semantic-map/authoring/main.js
            git commit -m 'refactor: replace maxGraph adapter classes with factory'
            test -n "$HEAD_REF"
            git push origin "HEAD:$HEAD_REF"
          fi

      - name: Require deploy configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test "$CLOUDFLARE_PAGES_PROJECT" = "stg-artifact-runtime"

      - name: Check architecture
        shell: bash
        run: |
          set -euo pipefail
          test ! -e apps/artifact-shell/adapters/shell.mjs
          test ! -e apps/artifact-shell/adapters/control-reference.mjs
          test ! -e apps/artifact-shell/adapters/graph-reference.mjs
          test ! -e apps/artifact-shell/publication/build-feature-page.mjs
          test ! -e packages/control/ui
          test ! -e packages/graph-editor/ui
          test ! -e packages/presentation/ui
          ! grep -R -nE 'files:[[:space:]]*Object\.freeze' packages/control/feature.mjs packages/graph-editor/feature.mjs packages/presentation/feature.mjs
          ! grep -R -nE '(^|[^[:alnum:]_])class[[:space:]]+[[:alnum:]_$]+' apps/artifact-shell/adapters apps/artifact-shell/publication apps/artifact-shell/src/adapter.mjs apps/artifact-shell/mode.mjs packages/comptime packages/control packages/graph-editor packages/presentation packages/semantic-map/renderer-maxgraph
          ! grep -R -nE 'export[[:space:]]+default' apps/artifact-shell/adapters apps/artifact-shell/publication apps/artifact-shell/src/adapter.mjs apps/artifact-shell/mode.mjs packages/comptime packages/control packages/graph-editor packages/presentation packages/semantic-map/renderer-maxgraph
          for file in apps/artifact-shell/adapters/*.mjs apps/artifact-shell/publication/*.mjs apps/artifact-shell/src/adapter.mjs apps/artifact-shell/mode.mjs packages/comptime/*.mjs packages/control/*.mjs packages/control/src/*.mjs packages/graph-editor/*.mjs packages/graph-editor/src/*.mjs packages/presentation/*.mjs packages/presentation/compiler/*.mjs packages/presentation/render/*.mjs packages/semantic-map/renderer-maxgraph/*.js; do node --check "$file"; done

      - name: Build publication once
        shell: bash
        run: |
          set -euo pipefail
          node apps/artifact-shell/scripts/build-publication.mjs --out=dist
          test -s dist/index.html
          test -s dist/catalog.json
          test -s dist/artifact-manifest.json
          test ! -e dist/features
          for adapter in graph map seq presentation control graph-editor; do test -s "dist/adapters/$adapter/index.html"; done
          for adapter in graph map seq; do test -s "dist/adapters/$adapter/adapter.json"; done
          for feature in presentation control graph-editor; do
            test -s "dist/adapters/$feature/feature.json"
            test -s "dist/adapters/$feature/input.json"
            test ! -e "dist/adapters/$feature/adapter.json"
          done
          test -s dist/modules/packages/presentation/render.mjs
          test -s dist/modules/packages/presentation/render/catalog.mjs
          test -s dist/modules/packages/control/render.mjs
          test -s dist/modules/packages/graph-editor/render.mjs
          test -s dist/modules/packages/semantic-map/vendor/maxgraph/view/BaseGraph.js
          ! grep -R -nE 'stg-mobile-agent|raw\.githubusercontent\.com' dist/adapters/presentation dist/adapters/control dist/adapters/graph-editor dist/modules/packages/presentation dist/modules/packages/control dist/modules/packages/graph-editor

      - name: Prove publication locally in Chrome
        shell: bash
        run: |
          set -euo pipefail
          node scripts/serve-static.mjs > "$RUNNER_TEMP/artifact-shell-static.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:18083/dist/index.html >/dev/null; then break; fi
            sleep .1
          done
          curl --fail --silent http://127.0.0.1:18083/dist/index.html >/dev/null
          bash apps/artifact-shell/tests/prove-publication-browser.sh http://127.0.0.1:18083/dist

      - name: Deploy preview and exact-byte readback
        id: deploy
        shell: bash
        env:
          PREVIEW_BRANCH: ui-deploy-pr-${{ github.event.pull_request.number || github.run_id }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          set +e
          output="$(npx --yes wrangler@4.112.0 pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$head_sha" \
            --commit-message 'Artifact Shell direct generic feature proof' 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 0
          deployment="$(printf '%s\n' "$output" | grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' | head -n1)"
          test -n "$deployment"
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
          for path in index.html catalog.json artifact-manifest.json; do
            curl --fail --silent --show-error --location "$deployment/$path" --output "$RUNNER_TEMP/remote-$path"
            cmp "dist/$path" "$RUNNER_TEMP/remote-$path"
          done

      - name: Prove deployed publication in Chrome
        shell: bash
        env:
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment }}
        run: |
          set -euo pipefail
          bash apps/artifact-shell/tests/prove-publication-browser.sh "$DEPLOYMENT"

      - name: Emit proof receipt
        shell: bash
        env:
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment }}
        run: |
          set -euo pipefail
          python3 - "$DEPLOYMENT" dist/catalog.json dist/artifact-manifest.json <<'PY'
          import hashlib, json, pathlib, sys
          deployment = sys.argv[1]
          catalog = json.loads(pathlib.Path(sys.argv[2]).read_text())
          manifest = pathlib.Path(sys.argv[3]).read_bytes()
          print(json.dumps({
              "schema": "ui.artifact-shell-pages-proof/6",
              "status": "PASS",
              "deployment": deployment,
              "project": "stg-artifact-runtime",
              "mode": "preview-examples-only",
              "host": "generic",
              "directFeatures": ["presentation", "control", "graph-editor"],
              "invocationAdapters": ["graph", "map", "seq"],
              "capabilities": [f"{x['capability']['id']}@{x['capability']['version']}" for x in catalog["capabilities"]],
              "artifact_manifest_sha256": hashlib.sha256(manifest).hexdigest(),
          }, separators=(",", ":")))
          PY
