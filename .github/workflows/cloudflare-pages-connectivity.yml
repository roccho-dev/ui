name: Artifact Shell Pages proof

on:
  pull_request:
    paths:
      - .github/workflows/cloudflare-pages-connectivity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ui-deploy
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: stg-artifact-runtime
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require deploy configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test "$CLOUDFLARE_PAGES_PROJECT" = "stg-artifact-runtime"

      - name: Build Artifact Shell publication
        shell: bash
        run: |
          set -euo pipefail
          node apps/artifact-shell/scripts/build-publication.mjs --out=dist
          test -s dist/index.html
          test -s dist/catalog.json
          test -s dist/artifact-manifest.json

      - name: Deploy preview and exact-byte readback
        id: deploy
        shell: bash
        env:
          PREVIEW_BRANCH: ui-deploy-pr-${{ github.event.pull_request.number || github.run_id }}
        run: |
          set -euo pipefail
          output="$(npx --yes wrangler@4.112.0 pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message 'Artifact Shell preview proof' 2>&1)"
          printf '%s\n' "$output"
          deployment="$(printf '%s\n' "$output" | grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' | head -n1)"
          test -n "$deployment"

          for path in index.html catalog.json artifact-manifest.json; do
            curl --fail --silent --show-error --location \
              "$deployment/$path" \
              --output "$RUNNER_TEMP/remote-$path"
            cmp "dist/$path" "$RUNNER_TEMP/remote-$path"
          done

          python3 - "$deployment" dist/catalog.json dist/artifact-manifest.json <<'PY'
          import hashlib, json, pathlib, sys
          deployment = sys.argv[1]
          catalog = json.loads(pathlib.Path(sys.argv[2]).read_text())
          manifest = pathlib.Path(sys.argv[3]).read_bytes()
          print(json.dumps({
              "schema": "ui.artifact-shell-pages-proof/1",
              "status": "PASS",
              "deployment": deployment,
              "project": "stg-artifact-runtime",
              "mode": "preview",
              "capabilities": [f"{x['capability']['id']}@{x['capability']['version']}" for x in catalog["capabilities"]],
              "artifact_manifest_sha256": hashlib.sha256(manifest).hexdigest(),
          }, separators=(",", ":")))
          PY
