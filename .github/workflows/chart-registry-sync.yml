name: chart registry sync

on:
  push:
    branches:
      - feat/chart-first-class-260915

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chart-first-class-260915
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate canonical registry
        run: node apps/artifact-shell/scripts/build-registry.mjs
      - name: Commit generated projection
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/artifact-shell/generated/capability-registry.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh artifact shell registry"
          git push origin HEAD:feat/chart-first-class-260915
