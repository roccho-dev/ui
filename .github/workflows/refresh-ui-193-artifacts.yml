name: Refresh ui-193 adapter artifacts

on:
  push:
    branches:
      - codex/ui-193-legacy-invocation-import

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2
      - name: Regenerate existing adapter artifact registry once
        run: |
          node packages/a2ui-adapter-artifacts/scripts/build.mjs --output-dir packages/a2ui-adapter-artifacts/generated
          git rm --ignore-unmatch .github/workflows/refresh-ui-193-artifacts.yml .ui-193-refresh-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/a2ui-adapter-artifacts/generated
          git diff --cached --quiet && exit 0
          git commit -m "build: refresh adapter artifacts for ui-193"
          git push origin HEAD:${GITHUB_REF_NAME}
