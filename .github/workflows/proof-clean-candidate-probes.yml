name: Remove accidental candidate probes

on:
  push:
    branches:
      - proof/build-artifact-action-url-260821

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Clean probe files when candidate exists
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: proposal/artifact-action-url-260821
        shell: bash
        run: |
          set -euo pipefail
          url="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          if ! git ls-remote --exit-code "$url" "refs/heads/$TARGET" >/dev/null 2>&1; then
            echo "candidate not present"
            exit 0
          fi
          git clone --depth=1 --branch "$TARGET" "$url" candidate
          git -C candidate config user.name github-actions[bot]
          git -C candidate config user.email 41898282+github-actions[bot]@users.noreply.github.com
          removed=0
          for path in .github/.artifact-action-url-candidate-marker .github/.candidate-ready-check; do
            if [ -e "candidate/$path" ]; then
              git -C candidate rm "$path"
              removed=1
            fi
          done
          if [ "$removed" -eq 0 ]; then
            echo "no probes present"
            exit 0
          fi
          git -C candidate commit -m "chore: remove accidental candidate probes"
          git -C candidate push origin "$TARGET"
