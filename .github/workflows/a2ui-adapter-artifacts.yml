name: A2UI adapter artifacts

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  adapter-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Japanese screenshot fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Install pinned browser proof tooling
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.57.0"
          python3 -m playwright install --with-deps chromium
      - name: Expose pinned Chromium to all UI proofs
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              executable = playwright.chromium.executable_path
              print(f"CHROME_BIN={executable}")
              print(f"CHROMIUM_EXECUTABLE={executable}")
          PY
      - name: Run complete UI checks
        run: |
          set -o pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/ui-npm-check.log"
      - name: Upload temporary UI check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-npm-check-diagnostics
          path: ${{ runner.temp }}/ui-npm-check.log
          if-no-files-found: error
      - name: Prove SSG hot refresh viewport and YAGNI boundary
        run: |
          node tests/check-ssg-hot-refresh-yagni.mjs
          python3 tests/check-ssg-hot-refresh-viewport.py
        env:
          SSG_HOT_REFRESH_ARTIFACT_OUT: ${{ runner.temp }}/ssg-hot-refresh-viewport-artifact
      - run: node packages/a2ui-adapter-artifacts/scripts/build.mjs
        env:
          ADAPTER_ARTIFACT_OUT: adapter-result
      - run: node scripts/build-contract-model-atlas-artifact.mjs --out adapter-result/contract-model-atlas-artifact
      - run: node packages/a2ui-adapter-artifacts/scripts/build-repo-map-svgpanzoom.mjs
        env:
          REPO_MAP_SVGPANZOOM_ARTIFACT_OUT: adapter-result/repo-map-svgpanzoom-artifact
      - run: node packages/a2ui-adapter-artifacts/scripts/patch-repo-map-svgpanzoom-preview.mjs adapter-result/repo-map-svgpanzoom-artifact
      - run: node packages/a2ui-adapter-artifacts/scripts/smoke-repo-map-svgpanzoom.mjs adapter-result/repo-map-svgpanzoom-artifact
      - run: node packages/a2ui-adapter-artifacts/scripts/build-geomap-proof.mjs
        env:
          GEOMAP_ARTIFACT_OUT: adapter-result/property-map-geo-artifact
      - run: node packages/a2ui-adapter-artifacts/scripts/build-geomap-zip-parity.mjs
        env:
          GEOMAP_ZIP_PARITY_ARTIFACT_OUT: adapter-result/property-map-zip-parity-artifact
          GEOMAP_ZIP_PARITY_RENDER: "1"
          GEOMAP_ZIP_PARITY_INTERACTION: "1"
      - run: node packages/a2ui-adapter-artifacts/scripts/build-geomap-runtime-hardening.mjs
        env:
          GEOMAP_ARTIFACT_OUT: adapter-result/property-map-geo-runtime-hardening-artifact
      - run: node packages/a2ui-adapter-artifacts/scripts/check-geomap-final-gate.mjs
        env:
          GEOMAP_ZIP_PARITY_ARTIFACT_OUT: adapter-result/property-map-zip-parity-artifact
          GEOMAP_RUNTIME_ARTIFACT_OUT: adapter-result/property-map-geo-runtime-hardening-artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssg-hot-refresh-viewport-artifact
          path: ${{ runner.temp }}/ssg-hot-refresh-viewport-artifact
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-adapter-artifact
          path: adapter-result/live-adapter-artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purpose-adapter-artifact
          path: adapter-result/purpose-adapter-artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-model-atlas-artifact
          path: adapter-result/contract-model-atlas-artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repo-map-svgpanzoom-artifact
          path: adapter-result/repo-map-svgpanzoom-artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: property-map-geo-artifact
          path: adapter-result/property-map-geo-artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: property-map-zip-parity-artifact
          path: adapter-result/property-map-zip-parity-artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: property-map-geo-runtime-hardening-artifact
          path: adapter-result/property-map-geo-runtime-hardening-artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adapter-artifact-index
          path: adapter-result/adapter-artifact-index.json
