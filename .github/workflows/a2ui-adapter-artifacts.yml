name: A2UI adapter artifacts

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-maxgraph-factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply one-shot factory migration
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/refactor-maxgraph-adapter-factory.mjs
          if git diff --quiet; then
            echo 'no migration output'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/semantic-map/renderer-maxgraph/adapter.js packages/semantic-map/renderer-maxgraph/index.js packages/semantic-map/authoring/main.js
          git commit -m 'refactor: replace maxGraph adapter classes with factory'
          git push origin "HEAD:$BRANCH"
