name: Materialize Decision Packet semantic-map proof

on:
  push:
    branches:
      - transport/ui175-decision-packet-semantic-map-260829

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ui175-decision-packet-semantic-map-260829
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BASE_SHA: 2e6442263f118a4b3ed405530ce24ba6eb054681
      SEMANTIC_CARRIER_BRANCH: transport/semantic-map-mobile-agent-260829
      SEMANTIC_PAYLOAD_SHA256: 93a366f4ba6b12c6e435b700b973c3438abbd85ca94b5fb5b124a1f56a3aa394
      DECISION_BLOB: 60190e485d5a04521871034a9d24b927d785e905
      DECISION_PAYLOAD_SHA256: a1a63bf4a8b4ceccf12246aab9b4424d552b355727b403b7ffe5026879b2acae
      PR_BRANCH: proposal/ui175-decision-packet-semantic-map-260829
      TRANSPORT_BRANCH: transport/ui175-decision-packet-semantic-map-260829
      SEMANTIC_ISSUE: "173"
      DECISION_ISSUE: "175"

    steps:
      - name: Checkout one-shot transport trigger
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve and verify both source carriers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SEMANTIC_CARRIER_BRANCH"
          : > "$RUNNER_TEMP/semantic.b64"
          for part in 000 001 002 003 004; do
            git show "origin/$SEMANTIC_CARRIER_BRANCH:transport/semantic-map/part.$part" \
              | tr -d '\r\n' >> "$RUNNER_TEMP/semantic.b64"
          done
          base64 --decode "$RUNNER_TEMP/semantic.b64" > "$RUNNER_TEMP/semantic.tar.xz"
          xz -t "$RUNNER_TEMP/semantic.tar.xz"
          test "$(sha256sum "$RUNNER_TEMP/semantic.tar.xz" | cut -d' ' -f1)" = "$SEMANTIC_PAYLOAD_SHA256"

          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$DECISION_BLOB" --jq .content \
            | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/decision.tar.xz"
          xz -t "$RUNNER_TEMP/decision.tar.xz"
          test "$(sha256sum "$RUNNER_TEMP/decision.tar.xz" | cut -d' ' -f1)" = "$DECISION_PAYLOAD_SHA256"

          mkdir -p "$RUNNER_TEMP/semantic" "$RUNNER_TEMP/decision"
          tar -xJf "$RUNNER_TEMP/semantic.tar.xz" -C "$RUNNER_TEMP/semantic"
          tar -xJf "$RUNNER_TEMP/decision.tar.xz" -C "$RUNNER_TEMP/decision"
          test -f "$RUNNER_TEMP/semantic/apply.py"
          test -f "$RUNNER_TEMP/decision/apply.py"

      - name: Fail closed on current UI authority movement
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin proposals
          test "$(git rev-parse origin/proposals)" = "$BASE_SHA"
          git checkout -B "$PR_BRANCH" origin/proposals

      - name: Materialize semantic-map capability on current UI
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/semantic/apply.py" "$PWD" "$RUNNER_TEMP/semantic"
          printf '%s\n' 'packages/semantic-map/vendor/maxgraph/** whitespace=-trailing-space' > .gitattributes
          test -f packages/semantic-map/runtime.js
          test -f apps/artifact-shell/capabilities/render-semantic-map/manifest.json
          test ! -e packages/app
          test ! -e vendor/maxgraph
          node packages/semantic-map/tests/run.mjs
          if test -f tests/check-semantic-map-capability.mjs; then node tests/check-semantic-map-capability.mjs; fi
          if test -f apps/artifact-shell/tests/semantic-map-capability.mjs; then node apps/artifact-shell/tests/semantic-map-capability.mjs; fi
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(ui): integrate semantic-map capability'

      - name: Materialize public Decision Packet projection
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/decision/apply.py" "$PWD" "$RUNNER_TEMP/decision"
          node apps/artifact-shell/scripts/build-registry.mjs
          node packages/decision-packet/scripts/build-example.mjs
          node packages/decision-packet/tests/run.mjs
          node packages/decision-packet/tests/example-reproducibility.mjs
          node apps/artifact-shell/tests/decision-packet-capability.mjs
          node tests/check-decision-packet-publication.mjs
          git diff --check
          git add -A
          git commit -m 'feat(ui): render public Decision Packets through semantic-map'

      - name: Run complete exact-candidate verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          npm run check:artifact-runtime 2>&1 | tee "$RUNNER_TEMP/proof/artifact-runtime.log"
          node tests/run-all.mjs 2>&1 | tee "$RUNNER_TEMP/proof/ui-suite.log"
          git diff --check
          git fsck --strict
          test -z "$(git status --porcelain)"

      - name: Run semantic-map and Decision Packet browser proofs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          chromium="$(python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )"
          test -x "$chromium"
          export CHROMIUM_EXECUTABLE="$chromium"
          export CHROME_BIN="$chromium"
          if test -f apps/artifact-shell/tests/browser-proof.py; then
            python3 apps/artifact-shell/tests/browser-proof.py | tee "$RUNNER_TEMP/proof/semantic-map-browser.json"
          elif test -f tests/check-semantic-map-browser.py; then
            python3 tests/check-semantic-map-browser.py | tee "$RUNNER_TEMP/proof/semantic-map-browser.json"
          else
            echo 'semantic-map browser proof missing' >&2
            exit 1
          fi
          python3 packages/decision-packet/tests/browser-example.py | tee "$RUNNER_TEMP/proof/decision-example-browser.json"
          python3 apps/artifact-shell/tests/decision-packet-browser-proof.py | tee "$RUNNER_TEMP/proof/decision-capability-browser.json"

      - name: Record exact candidate receipt
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          semantic="$(git rev-parse HEAD~1)"
          root_digest="$(sha256sum examples/render.decision-packet/dist/MANIFEST.sha256 | cut -d' ' -f1)"
          cat > "$RUNNER_TEMP/proof/candidate.json" <<EOF
          {
            "schema": "ui175-exact-candidate-receipt/1",
            "status": "PASS",
            "base": "$BASE_SHA",
            "semanticCommit": "$semantic",
            "head": "$head",
            "tree": "$tree",
            "semanticCarrier": "sha256:$SEMANTIC_PAYLOAD_SHA256",
            "decisionCarrier": "sha256:$DECISION_PAYLOAD_SHA256",
            "decisionExampleManifestSha256": "sha256:$root_digest",
            "generatedArtifactsAreAuthority": false
          }
          EOF
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "semantic=$semantic" >> "$GITHUB_OUTPUT"

      - name: Push exact candidate and open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin "HEAD:refs/heads/$PR_BRANCH"
          cat > "$RUNNER_TEMP/pr.md" <<EOF
          Refs #173
          Closes #175

          ## Scope

          - place reusable semantic-map meaning under \`packages/semantic-map/**\`;
          - expose \`render.semantic-map@1\` and \`render.decision-packet@1\` as additive capabilities with thin engines and positive/destructive fixtures;
          - project one public-safe Decision Packet into the approved semantic-map Graph UI;
          - keep the Artifact Shell generic and keep accepted decisions outside \`ui\`;
          - retain reviewable, reproducible examples under \`examples/<capability-id>/{input,dist}/**\`.

          ## Non-scope

          - no ADRS authority copy, production route, Cloudflare deploy, request-time database, CMS, transaction authority, search/LLM outcome, or automatic merge;
          - no unapproved redesign of the semantic-map UI.

          ## Exact identity

          - base: \`$BASE_SHA\`
          - semantic carrier: \`sha256:$SEMANTIC_PAYLOAD_SHA256\`
          - Decision carrier: \`sha256:$DECISION_PAYLOAD_SHA256\`
          - candidate: \`${{ steps.candidate.outputs.head }}\`
          - tree: \`${{ steps.candidate.outputs.tree }}\`

          ## Merge condition

          Keep this PR draft until every exact-head workflow is Green, browser artifacts are independently read back, and all review threads are closed. Explicit human approval is required; do not merge automatically.
          EOF
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base proposals --head "$PR_BRANCH" --json number --jq '.[0].number // empty')"
          if test -z "$existing"; then
            gh pr create --repo "$GITHUB_REPOSITORY" --draft --base proposals --head "$PR_BRANCH" \
              --title 'feat: render public Decision Packets through semantic-map' \
              --body-file "$RUNNER_TEMP/pr.md"
          else
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pr.md"
          fi

      - name: Publish proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui175-decision-packet-semantic-map-proof
          path: |
            ${{ runner.temp }}/proof
            examples/render.decision-packet/dist
          if-no-files-found: error
          retention-days: 30

      - name: Append exact receipts to Issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base proposals --head "$PR_BRANCH" --json number --jq '.[0].number')"
          body="$(cat <<EOF
          ## Exact provider materialization PASS

          \`$BASE_SHA\` was used as the exact current \`ui/proposals\` base. The semantic-map and Decision Packet carriers were digest-verified, materialized, tested, browser-executed, and pushed as draft PR #$pr.

          \`semantic commit\`: \`${{ steps.candidate.outputs.semantic }}\`  
          \`candidate head\`: \`${{ steps.candidate.outputs.head }}\`  
          \`candidate tree\`: \`${{ steps.candidate.outputs.tree }}\`

          PASS: semantic-map package tests; Decision Packet positive/destructive tests; Artifact Runtime; complete registered UI suite; deterministic examples; semantic-map browser proof; Decision example browser proof; Decision capability browser proof; \`git diff --check\`; \`git fsck --strict\`; clean worktree.

          Generated examples and receipts remain non-authority. No merge, deploy, external publication, customer action, payment, revenue, or corporate-sale outcome is claimed.
          EOF
          )"
          gh issue comment "$SEMANTIC_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue comment "$DECISION_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Remove one-shot transport branch
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete "$TRANSPORT_BRANCH"
