name: T283 pattern replay fix

on:
  push:
    branches:
      - fix/retire-smap-t283

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/retire-smap-t283
          token: ${{ github.token }}
      - name: Select canonical semantic case from accepted view
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/semantic-map/tests/set_topology_gesture_review_join_browser_e2e.py')
          s = p.read_text()
          old = '''                envelope = page.evaluate("async () => await semanticMapRuntime.envelope()")\n                fragment = data_fragment(envelope)\n                replay = context.new_page()'''
          new = '''                envelope = page.evaluate("async () => await semanticMapRuntime.envelope()")\n                fragment = data_fragment(envelope)\n                case_id = {"graph/1": "semantic/graph", "map/1": "map"}.get(envelope["view"]["pattern"])\n                assert case_id, envelope["view"]\n                replay = context.new_page()'''
          if s.count(old) != 1:
              raise SystemExit('accepted envelope replay anchor missing')
          s = s.replace(old, new, 1)
          old_url = 'f"{preview_base}/?case=semantic/graph{fragment}"'
          new_url = 'f"{preview_base}/?case={case_id}{fragment}"'
          if s.count(old_url) != 1:
              raise SystemExit('fixed semantic graph replay URL missing')
          p.write_text(s.replace(old_url, new_url, 1))
          PY
          rm .github/workflows/t283-pattern-replay-fix.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: replay accepted state through matching semantic case'
          git push origin HEAD:fix/retire-smap-t283
