name: Materialize UI175 semantic-map and Decision Packet candidate

on:
  push:
    branches:
      - transport/ui175-decision-packet-semantic-map-260829
    paths:
      - .transport/ui175/READY

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ui175-decision-packet-semantic-map-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: 2e6442263f118a4b3ed405530ce24ba6eb054681
      BASE_TREE: ea364db2c3d9d74be286f10538f963250e23b55a
      ARCHIVE_BYTES: "419324"
      ARCHIVE_SHA256: d260e0bf624e28f86fafe9749230f59b8ce1453e6e35125bfb91fe28ce212472
      BASE64_SHA256: 2cb773829f93ce5e38040291b9d5d16660b00ba9d36c8efb3e0cf56ec20b9a77
      EXPECTED_CHUNKS: "32"
      EXPECTED_TREE_A: 7ebfe154de47000f12cea6242f1d164ae5fbebe5
      EXPECTED_TREE_B: ed46836fdbb43a47ad0dd5cb714b852b3b8f9c57
      EXPECTED_TREE_C: de78e1cd1321a86de8a01939ba147f36e4809875
      PR_BRANCH: proposal/ui175-decision-packet-semantic-map-260829
      TRANSPORT_BRANCH: transport/ui175-decision-packet-semantic-map-260829
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Reconstruct bounded source carrier
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ui175"
          mkdir -p "$root/carrier" "$root/source"
          gh api "repos/$GITHUB_REPOSITORY/issues/175/comments?per_page=100" > "$root/carrier/comments.json"
          python3 - "$root/carrier/comments.json" "$root/carrier/source.b64" "$root/carrier/comment-ids" "$EXPECTED_CHUNKS" "$ARCHIVE_SHA256" "$BASE64_SHA256" <<'PY'
          import hashlib, json, pathlib, re, sys

          rows = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = int(sys.argv[4])
          archive_sha = sys.argv[5]
          base64_sha = sys.argv[6]
          marker = "<!-- ui175-three-commit-source-carrier/3 -->"
          chunks = {}
          comment_ids = []

          for row in rows:
              body = row.get("body") or ""
              if marker not in body:
                  continue
              match = re.search(r"^chunk:\s*(\d+)/(\d+)\s*$", body, re.M)
              archive = re.search(r"^archive-sha256:\s*([0-9a-f]{64})\s*$", body, re.M)
              encoded = re.search(r"^base64-sha256:\s*([0-9a-f]{64})\s*$", body, re.M)
              assert match and archive and encoded and "\ndata:\n" in body
              start, total = map(int, match.groups())
              assert total == expected
              assert archive.group(1) == archive_sha
              assert encoded.group(1) == base64_sha
              data = body.split("\ndata:\n", 1)[1].strip()
              assert re.fullmatch(r"[A-Za-z0-9+/=]+", data)
              parts = [data[offset:offset + 18000] for offset in range(0, len(data), 18000)]
              assert parts and start + len(parts) <= expected
              for offset, part in enumerate(parts):
                  index = start + offset
                  if index in chunks:
                      assert chunks[index] == part, f"conflicting duplicate chunk {index}"
                  else:
                      chunks[index] = part
              comment_ids.append(str(row["id"]))

          assert sorted(chunks) == list(range(expected)), sorted(chunks)
          payload = "".join(chunks[index] for index in range(expected))
          assert hashlib.sha256(payload.encode("ascii")).hexdigest() == base64_sha
          pathlib.Path(sys.argv[2]).write_text(payload, encoding="ascii")
          pathlib.Path(sys.argv[3]).write_text("\n".join(comment_ids) + "\n", encoding="ascii")
          PY
          base64 --decode "$root/carrier/source.b64" > "$root/carrier/source.tar.xz"
          test "$(wc -c < "$root/carrier/source.tar.xz")" -eq "$ARCHIVE_BYTES"
          test "$(sha256sum "$root/carrier/source.tar.xz" | cut -d' ' -f1)" = "$ARCHIVE_SHA256"
          tar -xJf "$root/carrier/source.tar.xz" -C "$root/source"
          python3 "$root/source/verify.py" "$root/source"

      - name: Materialize, test and open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash "$RUNNER_TEMP/ui175/source/materialize.sh"

      - name: Upload exact proof receipts
        uses: actions/upload-artifact@v4
        with:
          name: ui175-materialization-and-browser-proof
          path: |
            ${{ runner.temp }}/ui175/materialization-receipt.json
            ${{ runner.temp }}/ui175/pr-url.txt
            ${{ runner.temp }}/ui175/proof/**
            examples/render.semantic-map/dist/**
            examples/render.decision-packet/dist/**
          if-no-files-found: error
          retention-days: 30

      - name: Remove superseded public carriers and transport branches
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while read -r id; do
            test -n "$id" && gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id"
          done < "$RUNNER_TEMP/ui175/carrier/comment-ids"
          gh api "repos/$GITHUB_REPOSITORY/issues/173/comments?per_page=100" --jq '.[] | select(.body | contains("<!-- semantic-map-source-carrier/1 -->")) | .id' | while read -r id; do
            test -n "$id" && gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id"
          done
          for branch in "$TRANSPORT_BRANCH" transport/semantic-map-source-integration-260829 transport/semantic-map-ui-260829 transport/ui175-decision-packet-260829; do
            git push origin --delete "$branch" || true
          done
