name: tmp-publication-visual-proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  visual-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build publication
        run: node apps/artifact-shell/scripts/build-publication.mjs --out=dist

      - name: Start local static server
        run: |
          python3 -m http.server 18083 --bind 127.0.0.1 -d dist > "$RUNNER_TEMP/ui-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ui-http.pid"
          for _ in $(seq 1 50); do
            curl --fail --silent http://127.0.0.1:18083/ >/dev/null && exit 0
            sleep .1
          done
          cat "$RUNNER_TEMP/ui-http.log"
          exit 1

      - name: Start temporary public tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o "$RUNNER_TEMP/cloudflared"
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:18083 > "$RUNNER_TEMP/cloudflared.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cloudflared.pid"
          url=""
          for _ in $(seq 1 60); do
            url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" | head -1 || true)
            [ -n "$url" ] && break
            sleep 1
          done
          if [ -z "$url" ]; then
            cat "$RUNNER_TEMP/cloudflared.log"
            exit 1
          fi
          echo "UI_PUBLIC_URL=$url/" >> "$GITHUB_ENV"
          printf '%s/\n' "$url" > public-url.txt
          echo "PUBLIC_URL=$url/"

      - name: Smoke deployed URLs
        run: node apps/artifact-shell/tests/publication-deployed-smoke.mjs "$UI_PUBLIC_URL"

      - name: Capture deployed screens
        run: |
          browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$browser"
          mkdir -p visual-proof
          cp public-url.txt visual-proof/public-url.txt
          names=(root graph map seq presentation control graph-editor)
          paths=("" "adapters/graph/" "adapters/map/" "adapters/seq/" "adapters/presentation/" "adapters/control/" "adapters/graph-editor/")
          for i in "${!names[@]}"; do
            "$browser" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1100 --virtual-time-budget=12000 --screenshot="visual-proof/${names[$i]}.png" "${UI_PUBLIC_URL}${paths[$i]}" >/dev/null 2>&1 || true
          done
          test "$(find visual-proof -name '*.png' | wc -l)" -eq 7

      - uses: actions/upload-artifact@v4
        with:
          name: tmp-publication-visual-proof
          path: visual-proof
          if-no-files-found: error

      - name: Stop temporary tunnel
        if: always()
        run: |
          test ! -f "$RUNNER_TEMP/cloudflared.pid" || kill "$(cat "$RUNNER_TEMP/cloudflared.pid")" 2>/dev/null || true
          test ! -f "$RUNNER_TEMP/ui-http.pid" || kill "$(cat "$RUNNER_TEMP/ui-http.pid")" 2>/dev/null || true
