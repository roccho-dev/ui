name: Semantic-map source integration carrier

on:
  push:
    branches:
      - transport/semantic-map-source-integration-260829
    paths:
      - transport/semantic-map-source-integration/READY

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: semantic-map-source-integration-260829
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_SHA: 2e6442263f118a4b3ed405530ce24ba6eb054681
      EXPECTED_CHUNKS: 34
      EXPECTED_FILES: 336
      ISSUE_NUMBER: 173
      PAYLOAD_BASE64_SHA256: 4988f28ff9f6a6ee1310272b227a133dfbe455a1b4919df91109e8dd3d450adc
      PAYLOAD_BYTES: 457944
      PAYLOAD_SHA256: 3e8211db5fe1127e0dbc06ac72b1abaddfdfee0286f1feec3aac7ff8d561fc2a
      PR_BRANCH: proposal/semantic-map-source-registry-integration-260829
      TRANSPORT_BRANCH: transport/semantic-map-source-integration-260829
    steps:
      - name: Checkout exact carrier trigger
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Read, join and verify bounded carrier comments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" > "$RUNNER_TEMP/comments.json"
          python3 - "$RUNNER_TEMP/comments.json" "$RUNNER_TEMP/payload.b64" "$RUNNER_TEMP/carrier-comment-ids" "$EXPECTED_CHUNKS" "$PAYLOAD_SHA256" "$PAYLOAD_BASE64_SHA256" <<'PY'
          import hashlib,json,pathlib,re,sys
          comments=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          out=pathlib.Path(sys.argv[2]); ids=pathlib.Path(sys.argv[3]); expected=int(sys.argv[4])
          archive_sha=sys.argv[5]; base64_sha=sys.argv[6]
          marker='<!-- semantic-map-source-carrier/1 -->'
          chunks={}; comment_ids=[]
          for row in comments:
              body=row.get('body') or ''
              if marker not in body: continue
              m=re.search(r'^chunk:\s*(\d+)/(\d+)\s*$',body,re.M)
              a=re.search(r'^archive-sha256:\s*([0-9a-f]{64})\s*$',body,re.M)
              b=re.search(r'^base64-sha256:\s*([0-9a-f]{64})\s*$',body,re.M)
              assert m and a and b and '\ndata:\n' in body
              index,total=map(int,m.groups())
              assert total==expected and a.group(1)==archive_sha and b.group(1)==base64_sha
              assert index not in chunks
              chunks[index]=body.split('\ndata:\n',1)[1].strip()
              comment_ids.append(str(row['id']))
          assert sorted(chunks)==list(range(expected)),sorted(chunks)
          payload=''.join(chunks[i] for i in range(expected))
          assert hashlib.sha256(payload.encode()).hexdigest()==base64_sha
          out.write_text(payload,encoding='ascii')
          ids.write_text('\n'.join(comment_ids)+'\n',encoding='ascii')
          PY
          base64 --decode "$RUNNER_TEMP/payload.b64" > "$RUNNER_TEMP/payload.tar.xz"
          test "$(wc -c < "$RUNNER_TEMP/payload.tar.xz")" -eq "$PAYLOAD_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/payload.tar.xz" | cut -d' ' -f1)" = "$PAYLOAD_SHA256"
          python3 - "$RUNNER_TEMP/payload.tar.xz" "$EXPECTED_FILES" <<'PY'
          import pathlib,subprocess,sys
          archive=pathlib.Path(sys.argv[1]); expected=int(sys.argv[2])
          rows=subprocess.check_output(['tar','-tJf',str(archive)],text=True).splitlines()
          assert len(rows)==expected,(len(rows),expected)
          assert len(set(rows))==len(rows)
          for row in rows:
              p=pathlib.PurePosixPath(row)
              assert row and not p.is_absolute() and '..' not in p.parts,row
          PY

      - name: Materialize on exact current UI authority
        id: materialize
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin proposals
          test "$(git rev-parse origin/proposals)" = "$BASE_SHA"
          git checkout -B "$PR_BRANCH" origin/proposals
          tar -xJf "$RUNNER_TEMP/payload.tar.xz" -C .
          test ! -e packages/app
          test ! -e vendor/maxgraph
          node apps/artifact-shell/scripts/build-registry.mjs --check
          npm run check:capability-examples
          npm run check:semantic-map
          npm run check:mobile-agent-retirement
          node tests/run-all.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate semantic-map capability and retire legacy source'
          head="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$PR_BRANCH"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Open governed integration pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pr.md" <<'EOF'
          Refs #173

          ## Scope

          - migrate the reusable legacy semantic-map protocol, domain, projection, Graph/Map/Seq/Chart renderer, resource composition, URL compatibility, authoring source, maxGraph vendor closure, schemas, licenses and geo tooling into `packages/semantic-map/**`;
          - add `render.semantic-map@1` as an additive capability with four positive fixtures and one destructive fixture;
          - make package-backed capability engines a hash-verified repo-local static module closure without adding a semantic-map switch to the shell;
          - add reproducible examples, 398/398 source-path classification, 290/290 requirement adoption, source-byte inventory, legacy conformance, performance, browser and retirement gates.

          ## Non-scope

          - no legacy shell, route, deploy project, accepted-state authority, mutable latest identity, or automatic OPS adoption;
          - no deletion of immutable provenance evidence or historical releases still under retention.

          ## Test evidence

          - registry: 4 capabilities / 179 modules;
          - Artifact Shell publication: 4 capabilities, content-addressed module closures;
          - legacy semantic-map conformance: 24 tests PASS;
          - URL performance: p95 below the unchanged 100/100/125 ms budgets;
          - source retirement: 398/398 paths, 290/290 requirements, 206 source files, zero unclassified;
          - capability examples: all 4 rebuilt and byte-compared;
          - complete UI CI must produce Graph/Map/Seq/Chart screenshots and a destructive-input browser receipt.

          ## Merge condition

          Merge only when every exact-head workflow is Green, `semantic-map-browser-proof` is PASS for Graph/Map/Seq/Chart plus the destructive fixture, the PR remains based on the exact current `proposals`, and no review thread remains open.

          Do not merge automatically; explicit human approval is required.
          EOF
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base proposals --head "$PR_BRANCH" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base proposals --head "$PR_BRANCH" --title 'feat: integrate semantic-map capability and close mobile-agent source retirement' --body-file "$RUNNER_TEMP/pr.md"
          fi

      - name: Remove temporary public carrier
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while read -r id; do
            test -n "$id" && gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id"
          done < "$RUNNER_TEMP/carrier-comment-ids"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Carrier materialization PASS. Payload \`sha256:$PAYLOAD_SHA256\` was verified, applied to exact UI base \`$BASE_SHA\`, and removed from Issue comments. Candidate: \`${{ steps.materialize.outputs.head }}\`. Authority remains Git."
          git push origin --delete "$TRANSPORT_BRANCH"
