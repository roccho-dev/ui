name: Temporary graph218 fix v3

on:
  push:
    branches:
      - feat/graph1-structured-graph-260914

permissions:
  contents: write

jobs:
  fix-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply structured width and proof when needed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          layout = Path('packages/semantic-map/pattern/view-types/spatial-layout.js')
          text = layout.read_text()
          if 'GRAPH_STRUCTURED_LEAF_WIDTH' not in text:
              text = text.replace('const GRAPH_LEAF_WIDTH = 180;\n', 'const GRAPH_LEAF_WIDTH = 180;\nconst GRAPH_STRUCTURED_LEAF_WIDTH = 320;\n', 1)
              text = text.replace('width: GRAPH_LEAF_WIDTH,', 'width: itemCount > 0 ? GRAPH_STRUCTURED_LEAF_WIDTH : GRAPH_LEAF_WIDTH,', 1)
              layout.write_text(text)

          test = Path('packages/semantic-map/tests/graph_semantics_test.mjs')
          text = test.read_text()
          marker = "structured self-loop node label must remain visible"
          if marker not in text:
              anchor = 'assert.equal(selfRelation.directed, true);\n'
              addition = "assert.equal(selfRelation.directed, true);\nconst selfClaim = selfLoop.representations.find((item) => item.sourceRegionId === 'claim');\nassert.match(displayedRegionLabel(selfClaim, 1, DEFAULT_THEME, false), /Claim/u, 'structured self-loop node label must remain visible');\nassert.match(displayedRegionLabel(selfClaim, 1, DEFAULT_THEME, false), /role: proposal \\| decision/u, 'structured self-loop rows must remain visible');\n"
              if anchor not in text:
                  raise SystemExit('self relation test anchor missing')
              test.write_text(text.replace(anchor, addition, 1))
          PY

      - name: Focused and full semantic-map gates
        run: |
          node packages/semantic-map/tests/graph_semantics_test.mjs
          node packages/semantic-map/tests/run.mjs

      - name: Commit structured label fix if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/semantic-map/pattern/view-types/spatial-layout.js packages/semantic-map/tests/graph_semantics_test.mjs; then
            echo 'no fix diff'
            exit 0
          fi
          git config user.name roccho
          git config user.email 40359643+roccho-dev@users.noreply.github.com
          git add packages/semantic-map/pattern/view-types/spatial-layout.js packages/semantic-map/tests/graph_semantics_test.mjs
          git commit -m '[graph218-loop] fix: keep structured graph labels visible'
          git push origin HEAD:feat/graph1-structured-graph-260914
