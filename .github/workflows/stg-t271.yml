name: "Staging preview for #271"

on:
  pull_request:
    branches:
      - feat/opt-manually-and-beautifully
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

env:
  STG_TARGET_PR: "271"
  CLOUDFLARE_PAGES_PROJECT: ui-runtime

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ui-deploy
    steps:
      - name: Resolve staging scope
        env:
          SOURCE_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_PR" | grep -Eq '^[1-9][0-9]*$'
          scope="stg-t${STG_TARGET_PR}-s${SOURCE_PR}"
          echo "STG_SCOPE=$scope" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_PAGES_BRANCH=$scope" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure shared Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          projects="$RUNNER_TEMP/pages-projects.json"
          npx --yes wrangler@4.112.0 pages project list --json > "$projects"
          if ! PROJECT="$CLOUDFLARE_PAGES_PROJECT" PROJECTS="$projects" node -e '
            const fs = require("fs");
            const rows = JSON.parse(fs.readFileSync(process.env.PROJECTS, "utf8"));
            process.exit(rows.some(row => row.name === process.env.PROJECT) ? 0 : 1);
          '; then
            npx --yes wrangler@4.112.0 pages project create "$CLOUDFLARE_PAGES_PROJECT" --production-branch=proposals
          fi

      - name: Build Artifact Shell publication
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/artifact-shell-publication"
          npm run build:artifact-shell-publication -- --out="$out"
          echo "ARTIFACT_SHELL_PUBLICATION=$out" >> "$GITHUB_ENV"

      - name: Deploy staging preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.112.0 pages deploy "$ARTIFACT_SHELL_PUBLICATION" \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch="$CLOUDFLARE_PAGES_BRANCH" \
            --commit-hash="$SOURCE_SHA"
          echo "https://${CLOUDFLARE_PAGES_BRANCH}.${CLOUDFLARE_PAGES_PROJECT}.pages.dev" >> "$GITHUB_STEP_SUMMARY"
