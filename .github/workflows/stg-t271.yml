name: "Staging preview for #271"

on:
  pull_request:
    branches:
      - feat/opt-manually-and-beautifully
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

env:
  STG_TARGET_PR: "271"
  CLOUDFLARE_PAGES_PROJECT: ui-runtime

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ui-deploy
    steps:
      - name: Resolve staging scope
        env:
          SOURCE_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_PR" | grep -Eq '^[1-9][0-9]*$'
          scope="stg-t${STG_TARGET_PR}-s${SOURCE_PR}"
          echo "STG_SCOPE=$scope" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_PAGES_BRANCH=$scope" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh generated capability registry once
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          node apps/artifact-shell/scripts/build-registry.mjs
          git fetch origin feat/opt-manually-and-beautifully --depth=1
          git show FETCH_HEAD:.github/workflows/stg-t271.yml > .github/workflows/stg-t271.yml
          if git diff --quiet -- apps/artifact-shell/generated/capability-registry.mjs .github/workflows/stg-t271.yml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/artifact-shell/generated/capability-registry.mjs .github/workflows/stg-t271.yml
          git commit -m "chore: refresh generated capability registry"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Check UI preview
        run: npm --prefix apps/preview run check

      - name: Build UI preview
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ui-preview"
          npm --prefix apps/preview run build -- --outDir="$out"
          echo "UI_PREVIEW=$out" >> "$GITHUB_ENV"

      - name: Deploy staging preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.112.0 pages deploy "$UI_PREVIEW" \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch="$CLOUDFLARE_PAGES_BRANCH" \
            --commit-hash="$SOURCE_SHA"
          echo "https://${CLOUDFLARE_PAGES_BRANCH}.${CLOUDFLARE_PAGES_PROJECT}.pages.dev" >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned browser proof tooling
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.57.0"
          python3 -m playwright install --with-deps chromium

      - name: Prove deployed UI preview
        run: python3 apps/preview/tests/deployed-browser-proof.py "https://${CLOUDFLARE_PAGES_BRANCH}.${CLOUDFLARE_PAGES_PROJECT}.pages.dev"
