name: Transport JSONL AtlasStage product candidate

on:
  pull_request:
    branches: [proposals]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_BASE: 81f36ed47e61764495edcf5fb53a276a6722e06c
      TARGET_BRANCH: proposal/jsonl-atlas-stage-url-260821
      PATCH_B64_SHA256: 56cdf6b45bcc9ea90be999f37ed0c1b75248244a10ccdf3fa68c0c7660fa87ab
      PATCH_GZ_SHA256: 615688092871f04dd3295a7a0be007294286d4470882bf678db2330414013e78
      PATCH_SHA256: fda0837399a2585bc999a08b982c6845ea304d0ed6c320b67009e094ffdcf989
      EXPECTED_TREE_DIGEST: sha256:93702e1e01d87590e41f28ce83fdf17bda5434517a77f5e55b3b85e7edf60b88
      EXPECTED_FILES: '59'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Reconstruct exact product candidate
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/transport/jsonl-atlas-stage.patch.gz.b64
          test "$(sha256sum "$payload" | cut -d' ' -f1)" = "$PATCH_B64_SHA256"
          base64 --decode "$payload" > "$RUNNER_TEMP/change.patch.gz"
          test "$(sha256sum "$RUNNER_TEMP/change.patch.gz" | cut -d' ' -f1)" = "$PATCH_GZ_SHA256"
          gzip --decompress --stdout "$RUNNER_TEMP/change.patch.gz" > "$RUNNER_TEMP/change.patch"
          test "$(sha256sum "$RUNNER_TEMP/change.patch" | cut -d' ' -f1)" = "$PATCH_SHA256"

          test "$(git ls-remote origin refs/heads/proposals | awk 'NR==1 {print $1}')" = "$EXPECTED_BASE"
          test -z "$(git ls-remote origin "refs/heads/$TARGET_BRANCH")"
          git reset --hard "$EXPECTED_BASE"
          git clean -fdx
          git apply --check "$RUNNER_TEMP/change.patch"
          git apply "$RUNNER_TEMP/change.patch"
          git diff --check

      - name: Prove existing JSONL parse, reduce, project, runtime and publication path
        shell: bash
        run: |
          set -euo pipefail
          node tests/check-registry.mjs
          node tests/check-generic-a2ui-shell-builder.mjs
          node packages/a2ui-browser/tests/jsonl-surface.mjs
          npm run check:artifact-runtime
          node apps/artifact-shell/scripts/build-publication.mjs --out="$RUNNER_TEMP/publication" > "$RUNNER_TEMP/publication.json"
          python3 - "$RUNNER_TEMP/publication.json" "$RUNNER_TEMP/publication/artifact-manifest.json" <<'PY'
          import json,sys
          receipt=json.load(open(sys.argv[1],encoding='utf-8'))
          manifest=json.load(open(sys.argv[2],encoding='utf-8'))
          assert receipt['status']=='PASS'
          assert receipt['capabilities']==3
          assert receipt['files']==int('59')
          assert receipt['treeDigest']=='sha256:93702e1e01d87590e41f28ce83fdf17bda5434517a77f5e55b3b85e7edf60b88'
          assert manifest['treeDigest']==receipt['treeDigest']
          assert len(manifest['files'])==receipt['files']
          required=[
            'packages/a2ui-browser/src/jsonl-surface.mjs',
            'packages/core-port/src/jsonl.mjs',
            'packages/core-port/src/project.mjs',
            'packages/core-port/src/catalog.mjs',
            'packages/core-port/src/registry.mjs',
          ]
          for suffix in required:
            assert sum(row['path'].endswith(suffix) for row in manifest['files'])==1,suffix
          PY

          python3 - <<'PY'
          import pathlib
          generator=pathlib.Path('packages/a2ui-browser/src/jsonl-surface.mjs').read_text(encoding='utf-8')
          assert 'projectA2uiSurface' in generator
          assert 'parseJsonlLines' in generator
          for path in sorted(pathlib.Path('tests/fixtures/artifact-runtime-jsonl').glob('*.jsonl')):
            lines=[line for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
            assert len(lines)==2
            assert 'TreePatch' in lines[0] and 'StatePatch' in lines[1]
          PY

      - name: Commit and publish clean product branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test "$(git diff --cached --name-only | wc -l)" -eq 17
          git diff --cached --check
          git commit -m "feat: compile Artifact Runtime surfaces from JSONL only"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
