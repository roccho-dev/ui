name: Transport JSONL state safety fix

on:
  push:
    branches:
      - transport/jsonl-atlas-stage-state-safety-260821

permissions:
  contents: write

jobs:
  update-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: 4fbea3600b2c112fccd1ca4bfda1e322a6ce9658
      TARGET_BRANCH: proposal/jsonl-atlas-stage-url-260821
      PATCH_B64_SHA256: 82f2ea2742c7078a6d469abf5cda183fea40d544aeb796cec2fd4a926e7fbcb4
      PATCH_GZ_SHA256: e5cd3341ce2672282e71bcb9c79fb7ce14a1dd277c3d90c0f84d9df2ac8774d6
      PATCH_SHA256: 1c7ac6023287908a6be26bb09ab36abea6f4d295882c30bdc228d0fe80cfc900
      EXPECTED_TREE_DIGEST: sha256:95d7fe3edc3b65c24198abfa32edc0650f0401e3bb4825bfc9c395f757b965b7
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: candidate
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Apply exact state safety patch
        shell: bash
        run: |
          set -euo pipefail
          payload="$GITHUB_WORKSPACE/transport/.github/transport/jsonl-state-safety.patch.gz.b64"
          candidate="$GITHUB_WORKSPACE/candidate"
          test "$(git -C "$candidate" rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(sha256sum "$payload" | cut -d' ' -f1)" = "$PATCH_B64_SHA256"
          base64 --decode "$payload" > "$RUNNER_TEMP/change.patch.gz"
          test "$(sha256sum "$RUNNER_TEMP/change.patch.gz" | cut -d' ' -f1)" = "$PATCH_GZ_SHA256"
          gzip --decompress --stdout "$RUNNER_TEMP/change.patch.gz" > "$RUNNER_TEMP/change.patch"
          test "$(sha256sum "$RUNNER_TEMP/change.patch" | cut -d' ' -f1)" = "$PATCH_SHA256"
          git -C "$candidate" apply --check "$RUNNER_TEMP/change.patch"
          git -C "$candidate" apply "$RUNNER_TEMP/change.patch"
          git -C "$candidate" diff --check
          test "$(git -C "$candidate" diff --name-only | LC_ALL=C sort | paste -sd, -)" = "apps/artifact-shell/generated/capability-registry.mjs,packages/a2ui-browser/tests/jsonl-surface.mjs,packages/core-port/src/project.mjs"

      - name: Re-run JSONL and complete Artifact Runtime gates
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          node packages/a2ui-browser/tests/jsonl-surface.mjs | tee "$RUNNER_TEMP/jsonl-test.json"
          grep -F '"assertions":42' "$RUNNER_TEMP/jsonl-test.json"
          node apps/artifact-shell/scripts/build-registry.mjs --check
          npm run check:artifact-runtime
          node apps/artifact-shell/scripts/build-publication.mjs --out="$RUNNER_TEMP/publication" > "$RUNNER_TEMP/publication.json"
          python3 - "$RUNNER_TEMP/publication.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          assert x=={
            'schema':'artifact-shell-publication-build-receipt/2',
            'status':'PASS','capabilities':3,'files':59,
            'treeDigest':'sha256:95d7fe3edc3b65c24198abfa32edc0650f0401e3bb4825bfc9c395f757b965b7',
          }
          PY

      - name: Commit and fast-forward product candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/artifact-shell/generated/capability-registry.mjs \
            packages/a2ui-browser/tests/jsonl-surface.mjs \
            packages/core-port/src/project.mjs
          git diff --cached --check
          git commit -m "fix: reject unsafe JSONL state keys"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
