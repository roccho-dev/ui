name: T283 CSP proof fix

on:
  push:
    branches:
      - fix/retire-smap-t283

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/retire-smap-t283
          token: ${{ github.token }}
      - name: Make preview waits CSP-safe
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/semantic-map/tests/set_topology_gesture_review_join_browser_e2e.py')
          s = p.read_text()
          replacements = {
              '"globalThis.uiPreviewProof?.status === \'PASS\' || globalThis.uiPreviewProof?.status === \'FAIL\'"': '"() => globalThis.uiPreviewProof?.status === \'PASS\' || globalThis.uiPreviewProof?.status === \'FAIL\'"',
              '"globalThis.semanticMapRuntime?.ready === true"': '"() => globalThis.semanticMapRuntime?.ready === true"',
              '"globalThis.semanticMapReview?.ready === true"': '"() => globalThis.semanticMapReview?.ready === true"',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match for {old}, got {count}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/t283-csp-fix.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: make canonical replay proof CSP-safe'
          git push origin HEAD:fix/retire-smap-t283
