name: Chart authoring no false green v3

on:
  pull_request:
    branches:
      - automation/chart-authoring-no-false-green-v3-260915

permissions:
  contents: write

env:
  TARGET_BRANCH: feat/chart-first-class-260915

jobs:
  patch-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply bounded Chart authoring patch
        run: python3 <(git show origin/automation/chart-authoring-no-false-green-v3-260915:.github/scripts/chart-authoring-v3.py)
        shell: bash
      - name: Prove no false-green source path
        run: |
          set -euo pipefail
          git diff --check
          node packages/semantic-map/tests/chart_test.mjs
          node packages/semantic-map/tests/run.mjs
          out="$RUNNER_TEMP/artifact-shell-publication"
          npm run build:artifact-shell-publication -- --out="$out"
          for variant in bar-horizontal bar-vertical line pie donut scatter heatmap sunburst; do
            test -f "$out/adapters/chart/$variant/index.html"
            test -f "$out/adapters/chart/$variant/feature.json"
            test -f "$out/adapters/chart/$variant/input.json"
          done
      - name: Commit only after all proof passes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/semantic-map/projection/projector.js \
            packages/semantic-map/pattern/view-types/chart/projection.js \
            packages/semantic-map/renderer-maxgraph/authoring/active-list.js \
            packages/semantic-map/renderer-maxgraph/adapter.js \
            packages/semantic-map/tests/chart_test.mjs \
            packages/semantic-map/tests/projection_test.mjs
          git status --short
          git commit -m 'fix: make Chart authoring target source regions'
          git push origin HEAD:"$TARGET_BRANCH"
