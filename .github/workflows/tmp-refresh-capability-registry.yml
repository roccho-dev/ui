name: temporary capability registry refresh

on:
  push:
    branches:
      - feat/a2ui-design-data-apps-260916

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/a2ui-design-data-apps-260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate canonical capability registry
        run: node apps/artifact-shell/scripts/build-registry.mjs
      - name: Commit generated projection when changed
        run: |
          if git diff --quiet -- apps/artifact-shell/generated/capability-registry.mjs; then
            echo "registry already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/artifact-shell/generated/capability-registry.mjs
          git commit -m "chore: refresh capability registry"
          git push origin HEAD:feat/a2ui-design-data-apps-260916
