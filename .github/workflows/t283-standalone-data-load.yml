name: T283 standalone data load

on:
  push:
    branches: [fix/retire-smap-t283]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/semantic-map/authoring/entry.js')
          text = path.read_text(encoding='utf-8')
          old = """async function bootstrapEnvelope(config) {
  if (config.input === PARENT_MESSAGE_INPUT) return embeddedEnvelope();
  const initialText = document.getElementById('semantic-initial-state')?.textContent ?? '';
"""
          new = """async function bootstrapEnvelope(config) {
  if (config.input === PARENT_MESSAGE_INPUT) return embeddedEnvelope();
  const transported = await globalThis.semanticMapDataTransport?.read?.();
  if (transported !== null && transported !== undefined) return (await inspectEnvelope(transported)).envelope;
  const initialText = document.getElementById('semantic-initial-state')?.textContent ?? '';
"""
          if text.count(old) != 1:
              raise SystemExit('bootstrapEnvelope anchor changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node apps/artifact-shell/scripts/build-registry.mjs
          rm .github/workflows/t283-standalone-data-load.yml
          git add -A
          git commit -m "fix: load standalone semantic map from generic data transport"
          git push origin HEAD:fix/retire-smap-t283
