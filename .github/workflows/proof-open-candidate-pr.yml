name: Open Artifact Action URL candidate PR

on:
  push:
    branches:
      - proof/build-artifact-action-url-260821

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Open one draft PR after target exists
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: proposal/artifact-action-url-260821
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TARGET" >/dev/null 2>&1; then
            echo "candidate not present"
            exit 1
          fi
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET" --base proposals --state all --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "PR already exists: $existing"
            exit 0
          fi
          cat > "$RUNNER_TEMP/body.md" <<'EOF'
          ## Purpose

          Close the smallest missing product path in the accepted Artifact Runtime:

          `typed A2UI client action -> validated artifact-invocation/2 -> canonical #invoke URL -> History -> execution`.

          ## Change

          - add one universal `artifact.invoke` action contract;
          - accept only context containing exactly one validated `artifact-invocation/2`;
          - write the canonical URL with `history.pushState`;
          - execute the same validated invocation;
          - restore URL state on `popstate`;
          - add focused positive and destructive tests;
          - regenerate the trusted runtime registry.

          ## Boundary

          - no domain switch;
          - no new codec;
          - no backend, DB, state store, or mutable latest;
          - unsupported actions remain outside this port;
          - result and receipts remain non-authority;
          - Ops app-closure binding and static publication update are separate follow-up after this exact UI candidate is accepted.

          Human approval: the repository owner instructed the current implementation thread to proceed.
          EOF
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$TARGET" --base proposals \
            --title "feat: compile trusted Artifact actions into canonical URLs" \
            --body-file "$RUNNER_TEMP/body.md" --draft
