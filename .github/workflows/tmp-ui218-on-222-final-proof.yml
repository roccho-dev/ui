name: Temporary ui218 production-purpose proof

on:
  push:
    branches:
      - proof/ui218-on-222-final-260915

permissions:
  contents: read

jobs:
  purpose-proof:
    runs-on: ubuntu-latest
    environment: ui-deploy
    env:
      CANDIDATE_SHA: 510dd9c9d50a7af458d7180ae3fd8ad2881f5c62
      PROJECT_NAME: ui-graph-218
      PRODUCTION_URL: https://ui-graph-218.pages.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 510dd9c9d50a7af458d7180ae3fd8ad2881f5c62
          persist-credentials: false

      - name: Bind exact candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Prove original graph/1 purpose at source boundary
        shell: bash
        run: |
          set -euo pipefail
          node packages/semantic-map/tests/graph_semantics_test.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('packages/semantic-map/examples/graph')
          names = ['flow', 'state', 'class', 'erd', 'subgraph']
          allowed_record_types = {'meta', 'region', 'relation'}
          proof = {}
          for name in names:
              records = [json.loads(line) for line in (root / f'{name}.jsonl').read_text().splitlines() if line.strip()]
              assert records[0]['type'] == 'meta'
              assert records[0]['schema'] == 'semantic-map-state/1'
              assert {record['type'] for record in records} <= allowed_record_types
              assert not ({'flow', 'state', 'class', 'erd', 'subgraph'} & {record['type'] for record in records})
              regions = [r for r in records if r['type'] == 'region']
              relations = [r for r in records if r['type'] == 'relation']
              assert regions and (relations or name == 'subgraph')
              proof[name] = {'schema': records[0]['schema'], 'regions': len(regions), 'relations': len(relations)}
          class_records = [json.loads(line) for line in (root / 'class.jsonl').read_text().splitlines() if line.strip()]
          assert {'attribute', 'method'} & {r.get('kind') for r in class_records if r['type'] == 'region'}
          erd_records = [json.loads(line) for line in (root / 'erd.jsonl').read_text().splitlines() if line.strip()]
          assert 'field' in {r.get('kind') for r in erd_records if r['type'] == 'region'}
          subgraph_records = [json.loads(line) for line in (root / 'subgraph.jsonl').read_text().splitlines() if line.strip()]
          parents = {r.get('parent') for r in subgraph_records if r['type'] == 'region'}
          assert any(parent not in (None, subgraph_records[0].get('root')) for parent in parents)
          print(json.dumps({'schema':'ui.graph218-purpose-source-proof/1','status':'PASS','contract':'graph/1','forms':proof}, ensure_ascii=False))
          PY

      - name: Resolve original Pages production branch
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "$endpoint" > "$RUNNER_TEMP/project.json"
          jq -e '.success == true and .result.name == env.PROJECT_NAME' "$RUNNER_TEMP/project.json"
          production_branch="$(jq -r '.result.production_branch' "$RUNNER_TEMP/project.json")"
          test -n "$production_branch"
          test "$production_branch" != null
          echo "PRODUCTION_BRANCH=$production_branch" >> "$GITHUB_ENV"
          echo "production_branch=$production_branch"

      - name: Build exact candidate publication
        shell: bash
        run: |
          set -euo pipefail
          publication="$RUNNER_TEMP/ui218-production-publication"
          node apps/artifact-shell/scripts/build-publication.mjs --out="$publication"
          echo "PUBLICATION_ROOT=$publication" >> "$GITHUB_ENV"

      - name: Deploy exact candidate to original production destination
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy "$PUBLICATION_ROOT" \
            --project-name="$PROJECT_NAME" \
            --branch="$PRODUCTION_BRANCH" \
            --commit-dirty=true
          for attempt in $(seq 1 30); do
            if curl -fsS "$PRODUCTION_URL/index.html" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Build original five proof URLs
        shell: bash
        run: |
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/graph-urls.json"
          import fs from 'node:fs/promises';
          import { createUrlModuleUrl } from './packages/url-module/src/index.mjs';
          const base = `${process.env.PRODUCTION_URL}/adapters/graph/`;
          const names = ['flow', 'state', 'class', 'erd', 'subgraph'];
          const urls = {};
          for (const name of names) {
            const text = await fs.readFile(`packages/semantic-map/examples/graph/${name}.jsonl`, 'utf8');
            urls[name] = await createUrlModuleUrl({ base, fragment: 'data', value: text });
          }
          console.log(JSON.stringify(urls));
          NODE

      - name: Install pinned Chromium
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'playwright==1.57.0'
          python3 -m playwright install --with-deps chromium

      - name: Prove original five forms on original production URL
        shell: bash
        run: |
          export GRAPH_URLS_JSON="$RUNNER_TEMP/graph-urls.json"
          mkdir -p "$RUNNER_TEMP/ui218-purpose-screens"
          python3 - <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright

          urls = json.load(open(os.environ['GRAPH_URLS_JSON'], encoding='utf-8'))
          expected = {
              'flow': ['Start', 'Approve?', 'Done'],
              'state': ['Initial', 'Draft', 'Ready', 'Final'],
              'class': ['User', 'id: UUID', 'email: string', 'Order'],
              'erd': ['Customer', 'id: UUID PK', 'Invoice'],
              'subgraph': ['System', 'Backend', 'Storage'],
          }
          results = {}
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for name, url in urls.items():
                  page_errors, console_errors = [], []
                  page = browser.new_page(viewport={'width': 1600, 'height': 1000})
                  page.on('pageerror', lambda error, bag=page_errors: bag.append(str(error)))
                  page.on('console', lambda message, bag=console_errors: bag.append(message.text) if message.type == 'error' else None)
                  response = page.goto(url, wait_until='networkidle', timeout=60000)
                  page.wait_for_selector('[data-status="pass"]', timeout=60000)
                  page.wait_for_selector('svg', state='visible', timeout=60000)
                  body = page.locator('body').inner_text()
                  for token in expected[name]:
                      assert token in body, f'{name}: missing token {token!r}'
                  box = page.locator('svg').first.bounding_box()
                  assert box and box['width'] > 0 and box['height'] > 0, f'{name}: empty SVG'
                  assert response and response.status == 200, f'{name}: HTTP {response.status if response else None}'
                  assert not page_errors, f'{name}: page errors {page_errors}'
                  assert not console_errors, f'{name}: console errors {console_errors}'
                  page.screenshot(path=os.path.join(os.environ['RUNNER_TEMP'], 'ui218-purpose-screens', f'{name}.png'), full_page=True)
                  results[name] = {'http': response.status, 'svg': [round(box['width']), round(box['height'])], 'status': 'PASS'}
                  page.close()
              browser.close()
          print(json.dumps({
              'schema':'ui.graph218-production-purpose-proof/1',
              'status':'PASS',
              'candidate':os.environ['CANDIDATE_SHA'],
              'project':os.environ['PROJECT_NAME'],
              'url':os.environ['PRODUCTION_URL'],
              'purpose':'one graph/1 region/relation contract proves flow/state/class/erd/subgraph',
              'results':results,
          }, ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ui218-production-purpose-proof
          path: |
            ${{ runner.temp }}/project.json
            ${{ runner.temp }}/graph-urls.json
            ${{ runner.temp }}/ui218-purpose-screens/*.png
          if-no-files-found: error
