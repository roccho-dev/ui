name: tmp-source-compiler-boundary
on:
  push:
    branches:
      - chore/ui-decisions-compiler-boundary-260914
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/tmp-decisions-boundary.mjs
      - run: npm run check:source-compiler
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'refactor: separate source compilers from UI examples'
          git push
