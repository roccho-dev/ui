name: tmp-presentation-example
on:
  push:
    branches:
      - chore/ui-decisions-compiler-boundary-260914
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/tmp-print-presentation-example.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/presentation/example.json
          git diff --cached --quiet || git commit -m 'test: materialize presentation UI example'
          git push
