name: Root JSONL map

on:
  pull_request:
    paths:
      - '.github/workflows/root-jsonl-map.yml'
      - 'apps/root-jsonl-map/**'
  push:
    branches: [feat/adrs-318-root-jsonl-map]
    paths:
      - '.github/workflows/root-jsonl-map.yml'
      - 'apps/root-jsonl-map/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node apps/root-jsonl-map/check.mjs
