name: Temporary regenerate artifact registry

on:
  push:
    paths:
      - .github/workflows/tmp-regenerate-registry.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate registry
        run: node apps/artifact-shell/scripts/build-registry.mjs
      - name: Commit generated registry
        run: |
          git add apps/artifact-shell/generated/capability-registry.mjs
          if git diff --cached --quiet; then
            echo "registry already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate artifact capability registry"
          git push origin HEAD:${GITHUB_REF_NAME}
