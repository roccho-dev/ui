name: PR governance

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  pr-governance:
    name: PR governance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate checked-in governance files
        run: node tests/check-pr-governance.mjs
      - name: Validate pull request text
        run: node tests/check-pr-body-governance.mjs
