name: T283 regenerate registry v2
on:
  push:
    branches: [fix/retire-smap-t283]
    paths: [.t283-regenerate-trigger]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/retire-smap-t283
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate canonical registry and clean one-shot files
        run: |
          node apps/artifact-shell/scripts/build-registry.mjs
          rm .github/workflows/t283-regenerate-registry.yml .github/workflows/t283-regenerate-registry-v2.yml .t283-regenerate-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "build: regenerate capability registry"
          git push origin HEAD:fix/retire-smap-t283
