name: T283 sync current 271

on:
  push:
    branches:
      - fix/retire-smap-t283

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/retire-smap-t283
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Merge current 271
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin feat/opt-manually-and-beautifully
          git merge --no-edit origin/feat/opt-manually-and-beautifully
          rm .github/workflows/t283-sync-current-271.yml
          git add -A
          git commit -m 'chore: retire #283 sync workflow'
          git push origin HEAD:fix/retire-smap-t283
