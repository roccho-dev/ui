name: Temporary graph218 fix v5

on:
  push:
    branches:
      - feat/graph1-structured-graph-260914

permissions:
  contents: write

jobs:
  fix-v5:
    if: ${{ !contains(github.event.head_commit.message, '[graph218-loop]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable loops only for graph/1 render
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/semantic-map/renderer-maxgraph/render-methods.js')
          text = path.read_text()
          old = "  const graph = this.graph;\n"
          new = "  const graph = this.graph;\n  graph.setAllowLoops(scene.pattern === 'graph/1');\n"
          if new not in text:
              if old not in text:
                  raise SystemExit('render graph anchor missing')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Focused and full semantic-map gates
        run: |
          node packages/semantic-map/tests/graph_semantics_test.mjs
          node packages/semantic-map/tests/run.mjs

      - name: Commit loop render enablement
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/semantic-map/renderer-maxgraph/render-methods.js; then
            echo 'no fix diff'
            exit 0
          fi
          git config user.name roccho
          git config user.email 40359643+roccho-dev@users.noreply.github.com
          git add packages/semantic-map/renderer-maxgraph/render-methods.js
          git commit -m '[graph218-loop] fix: enable maxGraph loops for graph/1'
          git push origin HEAD:feat/graph1-structured-graph-260914
