name: T283 semantic graph preview fix

on:
  push:
    branches:
      - fix/retire-smap-t283

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/retire-smap-t283
          token: ${{ github.token }}
      - name: Add canonical semantic graph case
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cases = Path('apps/preview/cases.jsonl')
          text = cases.read_text()
          anchor = '{"id":"graph","label":"graph","featureModule":"packages/business-model/feature.mjs","featureId":"graph","source":"examples/shared/business-model.jsonl"}\n'
          addition = '{"id":"semantic/graph","label":"semantic/graph","featureModule":"packages/semantic-map/feature.mjs","featureId":"graph","source":"examples/graph/example.jsonl"}\n'
          if text.count(anchor) != 1:
              raise SystemExit('canonical graph case anchor missing')
          if addition in text:
              raise SystemExit('semantic graph case already exists')
          cases.write_text(text.replace(anchor, anchor + addition, 1))

          proof = Path('packages/semantic-map/tests/set_topology_gesture_review_join_browser_e2e.py')
          text = proof.read_text()
          old = 'f"{preview_base}/?case=graph{fragment}"'
          new = 'f"{preview_base}/?case=semantic/graph{fragment}"'
          if text.count(old) != 1:
              raise SystemExit('expected replay case reference missing')
          proof.write_text(text.replace(old, new, 1))
          PY
          npm --prefix apps/preview run check
          rm .github/workflows/t283-semantic-graph-preview-fix.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: add canonical semantic graph replay case'
          git push origin HEAD:fix/retire-smap-t283
