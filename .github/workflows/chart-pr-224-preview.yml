name: Chart PR 224 preview

on:
  pull_request:
    branches:
      - deploy/chart-pr-224-260915

permissions:
  contents: write

env:
  TARGET_BRANCH: feat/chart-first-class-260915
  EXPECTED_SOURCE_SHA: e4a17636593f4d8630c50157b0706cbe25dbdd32
  PROOF_TOOLS_SHA: 63fb0d382ac9e2b1a1b58172ad51f8fb9e39e126
  CLOUDFLARE_PAGES_PROJECT: stg-artifact-runtime
  CLOUDFLARE_PAGES_BRANCH: ui-deploy-pr-224

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ui-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
      - name: Assert exact source identity
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Checkout pinned proof tools
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PROOF_TOOLS_SHA }}
          path: _proof-tools
          persist-credentials: false
      - name: Patch and prove Sunburst authoring closure
        run: |
          set -euo pipefail
          python3 _proof-tools/.github/scripts/chart-sunburst-authoring-patch.py
          git diff --check
          node packages/semantic-map/tests/authoring_boundary_test.mjs
          node packages/semantic-map/tests/chart_test.mjs
          node packages/semantic-map/tests/run.mjs
      - name: Commit and push only after source proof passes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/semantic-map/projection/projector.js \
            packages/semantic-map/feature-runtime.mjs \
            packages/semantic-map/renderer-maxgraph/authoring/index.js \
            packages/semantic-map/tests/chart_test.mjs \
            packages/semantic-map/tests/authoring_boundary_test.mjs
          git commit -m 'fix: close Sunburst authoring and activation paths'
          git push origin HEAD:"$TARGET_BRANCH"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build and assert publication
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/artifact-shell-publication"
          npm run build:artifact-shell-publication -- --out="$out"
          for variant in bar-horizontal bar-vertical line pie donut scatter heatmap sunburst; do
            test -f "$out/adapters/chart/$variant/index.html"
            test -f "$out/adapters/chart/$variant/feature.json"
            test -f "$out/adapters/chart/$variant/input.json"
          done
          echo "ARTIFACT_SHELL_PUBLICATION=$out" >> "$GITHUB_ENV"
      - name: Deploy to same Cloudflare Pages alias
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/wrangler-pages-deploy.log"
          npx --yes wrangler@4.112.0 pages deploy "$ARTIFACT_SHELL_PUBLICATION" --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch="$CLOUDFLARE_PAGES_BRANCH" --commit-hash="$SOURCE_SHA" | tee "$log"
          root="$(grep -oE 'https://[0-9a-f]+\.stg-artifact-runtime\.pages\.dev' "$log" | head -n1)"
          test -n "$root"
          echo "PROOF_ROOT=$root/adapters/chart/" >> "$GITHUB_ENV"
          echo "IMMUTABLE_DEPLOYMENT=$root" >> "$GITHUB_ENV"
      - name: Install pinned Chromium proof tooling
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.57.0"
          python3 -m playwright install --with-deps chromium
      - name: Prove real authoring for every deployed Chart variant
        run: python3 _proof-tools/.github/scripts/chart-pr-224-authoring-proof.py
      - name: Prove Sunburst drilldown and back by real clicks
        run: python3 _proof-tools/.github/scripts/chart-sunburst-activation-proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-pr-224-authoring-proof
          path: ${{ runner.temp }}/chart-pr-224-authoring-proof
          if-no-files-found: error
