name: Chart PR 224 preview

on:
  pull_request:
    branches:
      - deploy/chart-pr-224-260915

permissions:
  contents: read

env:
  SOURCE_SHA: 25f77a896abd4e6d50bb49bcb6319144cc81870a
  CLOUDFLARE_PAGES_PROJECT: stg-artifact-runtime
  CLOUDFLARE_PAGES_BRANCH: ui-deploy-pr-224
  PREVIEW_URL: https://ui-deploy-pr-224.stg-artifact-runtime.pages.dev/adapters/chart/

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ui-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build Artifact Shell publication
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/artifact-shell-publication"
          npm run build:artifact-shell-publication -- --out="$out"
          echo "ARTIFACT_SHELL_PUBLICATION=$out" >> "$GITHUB_ENV"
      - name: Deploy Cloudflare Pages preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.112.0 pages deploy "$ARTIFACT_SHELL_PUBLICATION" \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch="$CLOUDFLARE_PAGES_BRANCH" \
            --commit-hash="$SOURCE_SHA"
      - name: Install pinned Chromium proof tooling
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.57.0"
          python3 -m playwright install --with-deps chromium
      - name: Prove deployed Chart rendering
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          url = os.environ['PREVIEW_URL']
          out = Path(os.environ['RUNNER_TEMP']) / 'chart-pr-224.png'
          labels = ['製品質問', '導入相談', '不具合', 'その他']
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={'width': 1440, 'height': 1000})
              response = page.goto(url, wait_until='networkidle', timeout=60_000)
              assert response is not None and response.ok, f'HTTP failure: {response.status if response else None}'
              page.wait_for_selector('html[data-status="pass"]', timeout=60_000)
              svg = page.locator('svg').first
              svg.wait_for(state='visible', timeout=60_000)
              box = svg.bounding_box()
              assert box and box['width'] > 0 and box['height'] > 0, box
              body = page.locator('body').inner_text()
              for label in labels:
                  assert label in body, f'missing label: {label}'
              page.screenshot(path=str(out), full_page=True)
              print(json.dumps({
                  'schema': 'ui.chart-deployed-render-proof/1',
                  'status': 'PASS',
                  'sourceSha': os.environ['SOURCE_SHA'],
                  'url': url,
                  'httpStatus': response.status,
                  'featureStatus': 'pass',
                  'svg': {'visible': True, 'width': box['width'], 'height': box['height']},
                  'labels': labels,
                  'screenshot': str(out),
              }, ensure_ascii=False))
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chart-pr-224-render-proof
          path: ${{ runner.temp }}/chart-pr-224.png
          if-no-files-found: error
