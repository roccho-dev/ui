name: Chart PR 224 preview

on:
  pull_request:
    branches:
      - deploy/chart-pr-224-260915

permissions:
  contents: read

env:
  SOURCE_SHA: 7376dcd52847303f41550ace0259aa4af1b95e85
  CLOUDFLARE_PAGES_PROJECT: stg-artifact-runtime
  CLOUDFLARE_PAGES_BRANCH: ui-deploy-pr-224
  PREVIEW_ROOT: https://73d57fd2.stg-artifact-runtime.pages.dev/adapters/chart/

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ui-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build Artifact Shell publication
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/artifact-shell-publication"
          npm run build:artifact-shell-publication -- --out="$out"
          echo "ARTIFACT_SHELL_PUBLICATION=$out" >> "$GITHUB_ENV"
      - name: Assert generated Chart publication tree
        run: |
          set -euo pipefail
          for variant in bar-horizontal bar-vertical line pie donut scatter heatmap sunburst; do
            test -f "$ARTIFACT_SHELL_PUBLICATION/adapters/chart/$variant/index.html"
            test -f "$ARTIFACT_SHELL_PUBLICATION/adapters/chart/$variant/feature.json"
            test -f "$ARTIFACT_SHELL_PUBLICATION/adapters/chart/$variant/input.json"
          done
      - name: Deploy Cloudflare Pages preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.112.0 pages deploy "$ARTIFACT_SHELL_PUBLICATION" \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch="$CLOUDFLARE_PAGES_BRANCH" \
            --commit-hash="$SOURCE_SHA"
      - name: Install pinned Chromium proof tooling
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.57.0"
          python3 -m playwright install --with-deps chromium
      - name: Diagnose all deployed Chart variants
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          root = os.environ['PREVIEW_ROOT']
          out = Path(os.environ['RUNNER_TEMP']) / 'chart-pr-224-render-proof'
          out.mkdir(parents=True, exist_ok=True)
          expected = {
              'bar-horizontal': ['製品質問', '導入相談', '不具合', 'その他'],
              'bar-vertical': ['4月', '5月', '6月', '7月'],
              'line': ['第1週', '第2週', '第3週', '第4週'],
              'pie': ['製品A', '製品B', '製品C', 'その他'],
              'donut': ['製品A', '製品B', '製品C', 'その他'],
              'scatter': ['試行A', '試行B', '試行C', '試行D'],
              'heatmap': ['利用ヒートマップ', '東京', '大阪', '午前', '午後', '夜'],
              'sunburst': ['事業構成', '製品', '販路', 'Core', 'Pro', 'Direct', 'Partner'],
          }
          receipts = []
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for variant, labels in expected.items():
                  events = {'console': [], 'pageErrors': [], 'requestFailed': []}
                  page = browser.new_page(viewport={'width': 1440, 'height': 1000})
                  page.on('console', lambda msg, events=events: events['console'].append({'type': msg.type, 'text': msg.text}))
                  page.on('pageerror', lambda exc, events=events: events['pageErrors'].append(str(exc)))
                  page.on('requestfailed', lambda req, events=events: events['requestFailed'].append({'url': req.url, 'failure': req.failure}))
                  url = f'{root}{variant}/'
                  response = page.goto(url, wait_until='domcontentloaded', timeout=60_000)
                  page.wait_for_timeout(5_000)
                  body = page.locator('body').inner_text()
                  status = page.locator('html').get_attribute('data-status')
                  fatal = page.locator('#fatal').inner_text() if page.locator('#fatal').count() else ''
                  svg_count = page.locator('svg').count()
                  svg_box = page.locator('svg').first.bounding_box() if svg_count else None
                  labels_found = {label: label in body for label in labels}
                  screenshot = out / f'{variant}.png'
                  page.screenshot(path=str(screenshot), full_page=True)
                  receipt = {
                      'variant': variant,
                      'url': url,
                      'httpStatus': response.status if response else None,
                      'featureStatus': status,
                      'fatal': fatal,
                      'svgCount': svg_count,
                      'svgBox': svg_box,
                      'labelsFound': labels_found,
                      'events': events,
                      'screenshot': screenshot.name,
                  }
                  receipt['status'] = 'PASS' if response and response.ok and status == 'pass' and svg_box and all(labels_found.values()) and not events['pageErrors'] and not events['requestFailed'] else 'FAIL'
                  receipts.append(receipt)
                  print(json.dumps(receipt, ensure_ascii=False))
                  page.close()
              browser.close()
          final = {
              'schema': 'ui.chart-deployed-render-proof/2',
              'status': 'PASS' if all(item['status'] == 'PASS' for item in receipts) else 'FAIL',
              'sourceSha': os.environ['SOURCE_SHA'],
              'root': root,
              'variants': receipts,
          }
          (out / 'receipt.json').write_text(json.dumps(final, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(final, ensure_ascii=False))
          if final['status'] != 'PASS':
              raise SystemExit('one or more deployed Chart variants failed; inspect receipt')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-pr-224-render-proof
          path: ${{ runner.temp }}/chart-pr-224-render-proof
          if-no-files-found: error
