name: Chart PR 224 preview

on:
  pull_request:
    branches:
      - deploy/chart-pr-224-260915

permissions:
  contents: write

env:
  TARGET_BRANCH: feat/chart-first-class-260915
  EXPECTED_SOURCE_SHA: 159277d91216ffbca48189160ad61c4b4b733ab9
  PROOF_HARNESS_SHA: 413a52929d05839e631cfbe1cc9dccc459f77d2c
  CLOUDFLARE_PAGES_PROJECT: stg-artifact-runtime
  CLOUDFLARE_PAGES_BRANCH: ui-deploy-pr-224

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ui-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
      - name: Assert exact source identity
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove vector-sector editability override
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          styles = Path('packages/semantic-map/renderer-maxgraph/styles.js')
          text = styles.read_text(encoding='utf-8')
          old = """    case 'vector-sector':
      return {
        ...common,
        shape: 'semanticSector',
        sectorStartAngle: visual?.sector?.startAngle ?? -90,
        sectorEndAngle: visual?.sector?.endAngle ?? 270,
        sectorInnerRatio: visual?.sector?.innerRatio ?? 0,
        sectorOuterRatio: visual?.sector?.outerRatio ?? 1,
        rounded: false,
        fontSize: 0,
        fontStyle: 0,
        shadow: false,
        movable: false,
        resizable: false,
        selectable: false,
        editable: false,
        connectable: false,
        deletable: false,
      };
"""
          new = """    case 'vector-sector':
      return {
        ...common,
        shape: 'semanticSector',
        sectorStartAngle: visual?.sector?.startAngle ?? -90,
        sectorEndAngle: visual?.sector?.endAngle ?? 270,
        sectorInnerRatio: visual?.sector?.innerRatio ?? 0,
        sectorOuterRatio: visual?.sector?.outerRatio ?? 1,
        rounded: false,
        shadow: false,
      };
"""
          if text.count(old) != 1:
              raise SystemExit('vector-sector style anchor changed')
          styles.write_text(text.replace(old, new), encoding='utf-8')

          boundary = Path('packages/semantic-map/tests/authoring_boundary_test.mjs')
          text = boundary.read_text(encoding='utf-8')
          old = "const adapter = read('packages/semantic-map/renderer-maxgraph/adapter.js');\n"
          new = old + "const styles = read('packages/semantic-map/renderer-maxgraph/styles.js');\n"
          if text.count(old) != 1:
              raise SystemExit('authoring boundary styles import anchor changed')
          text = text.replace(old, new)
          anchor = "assert.match(adapter, /editingPlugin\\?\\.textarea\\?\\.isConnected/);\n"
          addition = anchor + "assert.doesNotMatch(styles, /case 'vector-sector':[\\s\\S]*?editable: false/);\n"
          if text.count(anchor) != 1:
              raise SystemExit('authoring boundary styles assertion anchor changed')
          boundary.write_text(text.replace(anchor, addition), encoding='utf-8')
          PY

          git diff --check
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { vertexStyle } from './packages/semantic-map/renderer-maxgraph/styles.js';
          import { DEFAULT_THEME } from './packages/semantic-map/renderer-maxgraph/theme.js';
          const style = vertexStyle({
            shape: 'vector-sector', kind: 'chart-slice', depth: 1,
            readOnly: false, labelEditable: true, geometryEditable: false,
            temporalEdit: null, href: null,
            visual: { paletteKey: 'chart:pie', sector: { startAngle: 0, endAngle: 90, innerRatio: 0, outerRatio: 1 } },
          }, 1, DEFAULT_THEME);
          assert.equal(style.selectable, true);
          assert.equal(style.editable, true);
          assert.equal(style.connectable, true);
          assert.equal(style.deletable, true);
          assert.equal(style.movable, false);
          assert.equal(style.resizable, false);
          assert.ok(style.fontSize > 0);
          NODE
          node packages/semantic-map/tests/authoring_boundary_test.mjs
          node packages/semantic-map/tests/chart_test.mjs
          node packages/semantic-map/tests/run.mjs
      - name: Commit and push only after source proof passes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/semantic-map/renderer-maxgraph/styles.js packages/semantic-map/tests/authoring_boundary_test.mjs
          git commit -m 'fix: inherit common editability for vector sectors'
          git push origin HEAD:"$TARGET_BRANCH"
          source_sha="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
      - name: Build Artifact Shell publication
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/artifact-shell-publication"
          npm run build:artifact-shell-publication -- --out="$out"
          echo "ARTIFACT_SHELL_PUBLICATION=$out" >> "$GITHUB_ENV"
      - name: Assert generated Chart publication tree
        run: |
          set -euo pipefail
          for variant in bar-horizontal bar-vertical line pie donut scatter heatmap sunburst; do
            test -f "$ARTIFACT_SHELL_PUBLICATION/adapters/chart/$variant/index.html"
            test -f "$ARTIFACT_SHELL_PUBLICATION/adapters/chart/$variant/feature.json"
            test -f "$ARTIFACT_SHELL_PUBLICATION/adapters/chart/$variant/input.json"
          done
      - name: Deploy Cloudflare Pages preview to same alias
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/wrangler-pages-deploy.log"
          npx --yes wrangler@4.112.0 pages deploy "$ARTIFACT_SHELL_PUBLICATION" \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch="$CLOUDFLARE_PAGES_BRANCH" \
            --commit-hash="$SOURCE_SHA" | tee "$log"
          root="$(grep -oE 'https://[0-9a-f]+\.stg-artifact-runtime\.pages\.dev' "$log" | head -n1)"
          test -n "$root"
          echo "PROOF_ROOT=$root/adapters/chart/" >> "$GITHUB_ENV"
          echo "IMMUTABLE_DEPLOYMENT=$root" >> "$GITHUB_ENV"
      - name: Install pinned Chromium proof tooling
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.57.0"
          python3 -m playwright install --with-deps chromium
      - name: Checkout pinned proof harness separately
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PROOF_HARNESS_SHA }}
          path: _proof-harness
          persist-credentials: false
      - name: Prove real authoring for every deployed Chart variant
        run: python3 "$GITHUB_WORKSPACE/_proof-harness/.github/scripts/chart-pr-224-authoring-proof.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-pr-224-authoring-proof
          path: ${{ runner.temp }}/chart-pr-224-authoring-proof
          if-no-files-found: error
