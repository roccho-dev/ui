name: Chart PR 224 preview

on:
  pull_request:
    branches:
      - deploy/chart-pr-224-260915

permissions:
  contents: read

env:
  SOURCE_SHA: 1d2ef0d99f75d98ec96786d027358e7270b44801
  PROOF_HARNESS_SHA: 413a52929d05839e631cfbe1cc9dccc459f77d2c
  CLOUDFLARE_PAGES_PROJECT: stg-artifact-runtime
  CLOUDFLARE_PAGES_BRANCH: ui-deploy-pr-224

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ui-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build Artifact Shell publication
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/artifact-shell-publication"
          npm run build:artifact-shell-publication -- --out="$out"
          echo "ARTIFACT_SHELL_PUBLICATION=$out" >> "$GITHUB_ENV"
      - name: Assert generated Chart publication tree
        run: |
          set -euo pipefail
          for variant in bar-horizontal bar-vertical line pie donut scatter heatmap sunburst; do
            test -f "$ARTIFACT_SHELL_PUBLICATION/adapters/chart/$variant/index.html"
            test -f "$ARTIFACT_SHELL_PUBLICATION/adapters/chart/$variant/feature.json"
            test -f "$ARTIFACT_SHELL_PUBLICATION/adapters/chart/$variant/input.json"
          done
      - name: Deploy Cloudflare Pages preview to same alias
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/wrangler-pages-deploy.log"
          npx --yes wrangler@4.112.0 pages deploy "$ARTIFACT_SHELL_PUBLICATION" \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch="$CLOUDFLARE_PAGES_BRANCH" \
            --commit-hash="$SOURCE_SHA" | tee "$log"
          root="$(grep -oE 'https://[0-9a-f]+\.stg-artifact-runtime\.pages\.dev' "$log" | head -n1)"
          test -n "$root"
          echo "PROOF_ROOT=$root/adapters/chart/" >> "$GITHUB_ENV"
          echo "IMMUTABLE_DEPLOYMENT=$root" >> "$GITHUB_ENV"
      - name: Install pinned Chromium proof tooling
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.57.0"
          python3 -m playwright install --with-deps chromium
      - name: Checkout pinned proof harness separately
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PROOF_HARNESS_SHA }}
          path: _proof-harness
          persist-credentials: false
      - name: Prove real authoring for every deployed Chart variant
        run: python3 "$GITHUB_WORKSPACE/_proof-harness/.github/scripts/chart-pr-224-authoring-proof.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-pr-224-authoring-proof
          path: ${{ runner.temp }}/chart-pr-224-authoring-proof
          if-no-files-found: error
