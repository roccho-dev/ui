name: Chart PR 224 preview

on:
  pull_request:
    branches:
      - deploy/chart-pr-224-260915

permissions:
  contents: write

env:
  TARGET_BRANCH: feat/chart-first-class-260915
  EXPECTED_SOURCE_SHA: 159277d91216ffbca48189160ad61c4b4b733ab9
  PROOF_TOOLS_SHA: 301d31ecef8f811c25dbec420343190200d64aed
  CLOUDFLARE_PAGES_PROJECT: stg-artifact-runtime
  CLOUDFLARE_PAGES_BRANCH: ui-deploy-pr-224

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ui-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
      - name: Assert exact source identity
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Checkout pinned proof tools
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PROOF_TOOLS_SHA }}
          path: _proof-tools
          persist-credentials: false
      - name: Patch and prove vector-sector authoring
        run: |
          set -euo pipefail
          python3 _proof-tools/.github/scripts/chart-vector-sector-authoring-patch.py
          git diff --check
          node --input-type=module -e "import assert from 'node:assert/strict'; import {vertexStyle} from './packages/semantic-map/renderer-maxgraph/styles.js'; import {DEFAULT_THEME} from './packages/semantic-map/renderer-maxgraph/theme.js'; const s=vertexStyle({shape:'vector-sector',kind:'chart-slice',depth:1,readOnly:false,labelEditable:true,geometryEditable:false,temporalEdit:null,href:null,visual:{paletteKey:'chart:pie',sector:{startAngle:0,endAngle:90,innerRatio:0,outerRatio:1}}},1,DEFAULT_THEME); assert.equal(s.selectable,true); assert.equal(s.editable,true); assert.equal(s.connectable,true); assert.equal(s.deletable,true); assert.equal(s.movable,false); assert.equal(s.resizable,false); assert.ok(s.fontSize>0);"
          node packages/semantic-map/tests/authoring_boundary_test.mjs
          node packages/semantic-map/tests/chart_test.mjs
          node packages/semantic-map/tests/run.mjs
      - name: Commit and push only after source proof passes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/semantic-map/renderer-maxgraph/styles.js packages/semantic-map/tests/authoring_boundary_test.mjs
          git commit -m 'fix: inherit common editability for vector sectors'
          git push origin HEAD:"$TARGET_BRANCH"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build and assert publication
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/artifact-shell-publication"
          npm run build:artifact-shell-publication -- --out="$out"
          for variant in bar-horizontal bar-vertical line pie donut scatter heatmap sunburst; do
            test -f "$out/adapters/chart/$variant/index.html"
            test -f "$out/adapters/chart/$variant/feature.json"
            test -f "$out/adapters/chart/$variant/input.json"
          done
          echo "ARTIFACT_SHELL_PUBLICATION=$out" >> "$GITHUB_ENV"
      - name: Deploy to same Cloudflare Pages alias
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/wrangler-pages-deploy.log"
          npx --yes wrangler@4.112.0 pages deploy "$ARTIFACT_SHELL_PUBLICATION" --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch="$CLOUDFLARE_PAGES_BRANCH" --commit-hash="$SOURCE_SHA" | tee "$log"
          root="$(grep -oE 'https://[0-9a-f]+\.stg-artifact-runtime\.pages\.dev' "$log" | head -n1)"
          test -n "$root"
          echo "PROOF_ROOT=$root/adapters/chart/" >> "$GITHUB_ENV"
          echo "IMMUTABLE_DEPLOYMENT=$root" >> "$GITHUB_ENV"
      - name: Install pinned Chromium proof tooling
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.57.0"
          python3 -m playwright install --with-deps chromium
      - name: Prove real authoring for every deployed Chart variant
        run: python3 _proof-tools/.github/scripts/chart-pr-224-authoring-proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-pr-224-authoring-proof
          path: ${{ runner.temp }}/chart-pr-224-authoring-proof
          if-no-files-found: error
