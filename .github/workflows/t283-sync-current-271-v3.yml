name: T283 sync current 271 v3

on:
  push:
    branches:
      - fix/retire-smap-t283

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/retire-smap-t283
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Merge current 271
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin feat/opt-manually-and-beautifully
          if ! git merge --no-edit origin/feat/opt-manually-and-beautifully; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' 'apps/artifact-shell/generated/capability-registry.mjs' 'apps/preview/cases.jsonl' | sort)"
            test "$conflicts" = "$expected"
            git checkout --theirs apps/artifact-shell/generated/capability-registry.mjs apps/preview/cases.jsonl
            node -e 'const fs=require("fs");const p="apps/preview/cases.jsonl";const xs=fs.readFileSync(p,"utf8").trim().split("\n").map(JSON.parse);if(xs.some(x=>x.id==="semantic/graph"))throw new Error("semantic/graph already exists");const i=xs.findIndex(x=>x.id==="graph");if(i<0)throw new Error("graph case missing");xs.splice(i+1,0,{id:"semantic/graph",label:"semantic/graph",featureModule:"packages/semantic-map/feature.mjs",featureId:"graph",source:"examples/graph/example.jsonl"});fs.writeFileSync(p,xs.map(JSON.stringify).join("\n")+"\n");'
            git add apps/artifact-shell/generated/capability-registry.mjs apps/preview/cases.jsonl
            git commit --no-edit
          fi
          node apps/artifact-shell/scripts/build-registry.mjs
          git add apps/artifact-shell/generated/capability-registry.mjs
          if ! git diff --cached --quiet; then git commit -m 'chore: regenerate capability registry after #271 sync'; fi
          rm -f .github/t283-sync-trigger .github/workflows/t283-sync-current-271.yml .github/workflows/t283-sync-current-271-v2.yml .github/workflows/t283-sync-current-271-v3.yml
          git add -A
          git commit -m 'chore: retire #283 sync workflows'
          git push origin HEAD:fix/retire-smap-t283
