name: T283 regenerate registry
on:
  push:
    branches: [fix/retire-smap-t283]
    paths: [.t283-registry-trigger]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/retire-smap-t283
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate and clean
        run: |
          node apps/artifact-shell/scripts/build-registry.mjs
          rm -f .github/workflows/t283-regenerate-registry.yml .t283-registry-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/artifact-shell/generated/capability-registry.mjs .github/workflows/t283-regenerate-registry.yml .t283-registry-trigger
          git commit -m "chore: regenerate capability registry"
          git push origin HEAD:fix/retire-smap-t283
