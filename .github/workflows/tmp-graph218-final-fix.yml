name: Temporary graph218 final visual fix

on:
  push:
    branches:
      - feat/graph1-structured-graph-260914

permissions:
  contents: write

jobs:
  final-fix:
    if: ${{ !contains(github.event.head_commit.message, '[graph218-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix loop geometry and proof fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          render = Path('packages/semantic-map/renderer-maxgraph/render-methods.js')
          text = render.read_text()
          old = """  const offset = Math.max(48, sourceGeometry.width * 0.3);
  const point = new Point(
    sourceGeometry.x + sourceGeometry.width + offset,
    sourceGeometry.y + sourceGeometry.height / 2,
  );
  const current = edgeGeometry.points?.[0];
  if (edgeGeometry.points?.length === 1 && current?.x === point.x && current?.y === point.y) return;
  const next = edgeGeometry.clone();
  next.points = [point];
"""
          new = """  const offset = Math.max(48, sourceGeometry.width * 0.3);
  const points = [
    new Point(
      sourceGeometry.x + sourceGeometry.width + offset,
      sourceGeometry.y + sourceGeometry.height / 2,
    ),
    new Point(
      sourceGeometry.x + sourceGeometry.width + offset,
      sourceGeometry.y - offset,
    ),
    new Point(
      sourceGeometry.x + sourceGeometry.width / 2,
      sourceGeometry.y - offset,
    ),
  ];
  const current = edgeGeometry.points ?? [];
  if (current.length === points.length && current.every((point, index) => point.x === points[index].x && point.y === points[index].y)) return;
  const next = edgeGeometry.clone();
  next.points = points;
"""
          if old not in text:
              raise SystemExit('self-loop geometry anchor missing')
          render.write_text(text.replace(old, new, 1))

          Path('packages/semantic-map/examples/graph/architecture-nested.jsonl').write_text('''{"type":"meta","schema":"semantic-map-state/1","root":"mieru","title":"見えるんです | 産業医コメント連携"}\n{"type":"region","id":"mieru","parent":null,"label":"見えるんです | 産業医コメント連携","kind":"root","bounds":[0,0,1400,760],"summary":"three-column integration"}\n{"type":"region","id":"ui","parent":"mieru","label":"UI / Graph","kind":"group","bounds":[0,0,360,560],"summary":"UI side"}\n{"type":"region","id":"ui.request","parent":"ui","label":"松本さん側 | 29の正常を1 objectへ変形","kind":"process","bounds":[0,0,280,100],"summary":"request composition","order":0}\n{"type":"region","id":"ui.result","parent":"ui","label":"既存画面データ対応 | report plan経由で既存対応","kind":"process","bounds":[0,0,280,100],"summary":"existing UI result path","order":1}\n{"type":"region","id":"s3","parent":"mieru","label":"AWS | Amazon S3","kind":"group","bounds":[0,0,420,620],"summary":"exchange storage"}\n{"type":"region","id":"s3.input","parent":"s3","label":"input.json","kind":"data","bounds":[0,0,300,190],"summary":"request data","order":0}\n{"type":"region","id":"s3.input.case","parent":"s3.input","label":"案件データ","kind":"field","bounds":[0,0,160,40],"summary":"case data","order":0}\n{"type":"region","id":"s3.input.schema","parent":"s3.input","label":"schemaVersion: 0.1-draft","kind":"field","bounds":[0,0,200,40],"summary":"schema","order":1}\n{"type":"region","id":"s3.input.items","parent":"s3.input","label":"items[] | id + コメント用input","kind":"field","bounds":[0,0,220,40],"summary":"items","order":2}\n{"type":"region","id":"s3.output","parent":"s3","label":"output.json","kind":"data","bounds":[0,0,300,150],"summary":"result data","order":1}\n{"type":"region","id":"s3.output.items","parent":"s3.output","label":"items[] | id / statusCode / comment","kind":"field","bounds":[0,0,240,40],"summary":"result items","order":0}\n{"type":"region","id":"dev","parent":"mieru","label":"mieru-dev","kind":"group","bounds":[0,0,390,600],"summary":"generation service"}\n{"type":"region","id":"dev.process","parent":"dev","label":"処理","kind":"process","bounds":[0,0,300,180],"summary":"generation process","order":0}\n{"type":"region","id":"dev.process.context","parent":"dev.process","label":"案件データを共通context化","kind":"attribute","bounds":[0,0,220,40],"summary":"context","order":0}\n{"type":"region","id":"dev.process.items","parent":"dev.process","label":"items[]を1件ずつ生成","kind":"attribute","bounds":[0,0,200,40],"summary":"generate","order":1}\n{"type":"region","id":"dev.process.return","parent":"dev.process","label":"同じidで結果を返す","kind":"attribute","bounds":[0,0,200,40],"summary":"return","order":2}\n{"type":"region","id":"dev.constraints","parent":"dev","label":"意味を持たない","kind":"process","bounds":[0,0,300,150],"summary":"non-semantic inputs","order":1}\n{"type":"region","id":"dev.constraints.page","parent":"dev.constraints","label":"page番号 / graph位置","kind":"attribute","bounds":[0,0,200,40],"summary":"ignored","order":0}\n{"type":"region","id":"dev.constraints.comment","parent":"dev.constraints","label":"comment idの個別位置","kind":"attribute","bounds":[0,0,200,40],"summary":"ignored","order":1}\n{"type":"region","id":"dev.contract","parent":"dev","label":"1 object / join不要 / 契約は統合","kind":"data","bounds":[0,0,280,90],"summary":"one-object contract","order":2}\n{"type":"relation","id":"a1","from":"ui.request","to":"s3.input","kind":"flow","label":"writes input.json"}\n{"type":"relation","id":"a2","from":"s3.input","to":"dev.process","kind":"flow","label":"triggers generation"}\n''')

          Path('packages/semantic-map/examples/graph/adr344.jsonl').write_text('''{"type":"meta","schema":"semantic-map-state/1","root":"adr344","title":"ADR #344 | Progressive refinement + Decision Model"}\n{"type":"region","id":"adr344","parent":null,"label":"ADR #344 | proof-carrying phase transitions","kind":"root","bounds":[0,0,1800,1200],"summary":"meaning contract"}\n{"type":"region","id":"meaning","parent":"adr344","label":"Meaning authority","kind":"group","bounds":[0,0,720,680],"summary":"Fact Condition Claim and projection","order":0}\n{"type":"region","id":"world","parent":"meaning","label":"WorldEvidence","kind":"class","bounds":[0,0,240,130],"summary":"non-authority evidence","order":0}\n{"type":"region","id":"fact","parent":"meaning","label":"Fact","kind":"class","bounds":[0,0,320,190],"summary":"immutable record","order":1}\n{"type":"region","id":"fact.kind","parent":"fact","label":"kind / domain / subject / predicate / value","kind":"attribute","bounds":[0,0,260,40],"summary":"fact fields","order":0}\n{"type":"region","id":"fact.source","parent":"fact","label":"source_reference / observed_at / digest","kind":"attribute","bounds":[0,0,260,40],"summary":"provenance","order":1}\n{"type":"region","id":"condition","parent":"meaning","label":"Condition","kind":"class","bounds":[0,0,320,170],"summary":"immutable record","order":2}\n{"type":"region","id":"condition.fields","parent":"condition","label":"operator / value_type / effective_range","kind":"attribute","bounds":[0,0,260,40],"summary":"condition fields","order":0}\n{"type":"region","id":"claim","parent":"meaning","label":"Claim","kind":"class","bounds":[0,0,320,210],"summary":"Decision = Claim(role=decision)","order":3}\n{"type":"region","id":"claim.role","parent":"claim","label":"role: proposal | decision","kind":"attribute","bounds":[0,0,240,40],"summary":"role","order":0}\n{"type":"region","id":"claim.fields","parent":"claim","label":"rationale / required_dependencies / relations[]","kind":"attribute","bounds":[0,0,280,40],"summary":"claim fields","order":1}\n{"type":"region","id":"projection","parent":"meaning","label":"ProjectionResult","kind":"class","bounds":[0,0,320,190],"summary":"rebuildable non-authority","order":4}\n{"type":"region","id":"projection.fields","parent":"projection","label":"result / missing[] / unknown[] / conflict[]","kind":"attribute","bounds":[0,0,280,40],"summary":"projection result","order":0}\n{"type":"region","id":"phases","parent":"adr344","label":"Progressive phase values","kind":"group","bounds":[0,0,900,520],"summary":"Candidate to Finding","order":1}\n{"type":"region","id":"candidate","parent":"phases","label":"CandidateData","kind":"state","bounds":[0,0,220,110],"summary":"immutable phase value","order":0}\n{"type":"region","id":"ready","parent":"phases","label":"ReadyData","kind":"state","bounds":[0,0,220,110],"summary":"readiness proven","order":1}\n{"type":"region","id":"admitted","parent":"phases","label":"AdmittedData","kind":"state","bounds":[0,0,220,110],"summary":"authority admitted","order":2}\n{"type":"region","id":"effect","parent":"phases","label":"EffectResult","kind":"state","bounds":[0,0,220,110],"summary":"bounded external effect","order":3}\n{"type":"region","id":"observed","parent":"phases","label":"ObservedData","kind":"state","bounds":[0,0,220,110],"summary":"observation appended","order":4}\n{"type":"region","id":"finding","parent":"phases","label":"FindingData","kind":"state","bounds":[0,0,220,110],"summary":"candidate feedback","order":5}\n{"type":"region","id":"results","parent":"adr344","label":"Explicit non-green results","kind":"group","bounds":[0,0,300,420],"summary":"missing failure unknown","order":2}\n{"type":"region","id":"missing","parent":"results","label":"Missing","kind":"data","bounds":[0,0,180,90],"summary":"explicit result","order":0}\n{"type":"region","id":"admission-failure","parent":"results","label":"AdmissionFailure","kind":"data","bounds":[0,0,220,90],"summary":"explicit result","order":1}\n{"type":"region","id":"unknown","parent":"results","label":"ExplicitUnknown","kind":"data","bounds":[0,0,220,90],"summary":"explicit result","order":2}\n{"type":"relation","id":"r1","from":"world","to":"fact","kind":"dependency","label":"source_reference"}\n{"type":"relation","id":"r2","from":"claim","to":"fact","kind":"dependency","label":"depends_on"}\n{"type":"relation","id":"r3","from":"claim","to":"condition","kind":"dependency","label":"depends_on"}\n{"type":"relation","id":"r4","from":"claim","to":"claim","kind":"dependency","label":"depends_on"}\n{"type":"relation","id":"r5","from":"fact","to":"claim","kind":"dependency","label":"result_of [decision]"}\n{"type":"relation","id":"r6","from":"fact","to":"fact","kind":"dependency","label":"supersedes / contradicts"}\n{"type":"relation","id":"r7","from":"condition","to":"condition","kind":"dependency","label":"supersedes / contradicts"}\n{"type":"relation","id":"r8","from":"fact","to":"projection","kind":"dependency","label":"project() input"}\n{"type":"relation","id":"r9","from":"condition","to":"projection","kind":"dependency","label":"project() input"}\n{"type":"relation","id":"r10","from":"claim","to":"projection","kind":"dependency","label":"project() input / rule"}\n{"type":"relation","id":"r11","from":"projection","to":"candidate","kind":"flow","label":"candidate / gap"}\n{"type":"relation","id":"r12","from":"candidate","to":"ready","kind":"transition","label":"refine() / Right"}\n{"type":"relation","id":"r13","from":"candidate","to":"missing","kind":"transition","label":"refine() / Left"}\n{"type":"relation","id":"r14","from":"ready","to":"admitted","kind":"transition","label":"admit() / Right"}\n{"type":"relation","id":"r15","from":"ready","to":"admission-failure","kind":"transition","label":"admit() / Left"}\n{"type":"relation","id":"r16","from":"admitted","to":"effect","kind":"transition","label":"execute()"}\n{"type":"relation","id":"r17","from":"effect","to":"observed","kind":"transition","label":"observe() / observed"}\n{"type":"relation","id":"r18","from":"effect","to":"unknown","kind":"transition","label":"observe() / unobserved"}\n{"type":"relation","id":"r19","from":"observed","to":"fact","kind":"flow","label":"append observation Fact"}\n{"type":"relation","id":"r20","from":"fact","to":"finding","kind":"flow","label":"observation / counterevidence"}\n{"type":"relation","id":"r21","from":"projection","to":"finding","kind":"flow","label":"missing / unknown / conflict"}\n{"type":"relation","id":"r22","from":"finding","to":"claim","kind":"flow","label":"propose() [role=proposal]"}\n{"type":"relation","id":"r23","from":"claim","to":"claim","kind":"transition","label":"authority decision"}\n{"type":"relation","id":"r24","from":"claim","to":"projection","kind":"flow","label":"reproject() [accept]"}\n''')

          test = Path('packages/semantic-map/tests/graph_semantics_test.mjs')
          text = test.read_text()
          if "const adr344 = project(load('adr344'));" not in text:
              anchor = "const architecture = project(load('architecture-nested'));\n"
              addition = "const adr344 = project(load('adr344'));\nfor (const id of ['meaning', 'phases', 'results', 'fact', 'claim', 'candidate', 'missing']) {\n  assert.ok(adr344.representations.some((item) => item.sourceRegionId === id), `ADR #344 must render ${id}`);\n}\nassert.ok(adr344.relations.some((relation) => relation.id === 'r4' && relation.from === relation.to), 'ADR #344 Claim self relation must survive');\n\n" + anchor
              if anchor not in text:
                  raise SystemExit('architecture test anchor missing')
              text = text.replace(anchor, addition, 1)
          text = text.replace("'self-loop', 'architecture-nested']", "'self-loop', 'adr344', 'architecture-nested']")
          test.write_text(text)
          PY

      - name: Focused and full semantic-map gates
        run: |
          node packages/semantic-map/tests/graph_semantics_test.mjs
          node packages/semantic-map/tests/run.mjs

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name roccho
          git config user.email 40359643+roccho-dev@users.noreply.github.com
          git add packages/semantic-map/renderer-maxgraph/render-methods.js \
                  packages/semantic-map/examples/graph/architecture-nested.jsonl \
                  packages/semantic-map/examples/graph/adr344.jsonl \
                  packages/semantic-map/tests/graph_semantics_test.mjs
          git commit -m '[graph218-final] fix: close loop geometry and visual proofs'
          git push origin HEAD:feat/graph1-structured-graph-260914
