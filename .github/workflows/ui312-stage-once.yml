name: UI312 fixed-tree staging and artifact parity
on:
  push:
    branches: [stage/ui-312-source-producer]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: b67f3e90ed263297479f5cfd8c8b052f29697870
          path: candidate
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reproduce exactly the locally verified tree
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b67f3e90ed263297479f5cfd8c8b052f29697870
          test "$(git write-tree)" = f0ab77b492874660087454876a37e7ea90712e28
          python3 ../stage-source.py
          test "$(git write-tree)" = 00854307d85235514e0ef3150e04d88440f6c47f
          test ! -e packages
          test ! -e stage-source.py
          test ! -e .github/workflows/ui312-stage-once.yml
          test ! -e .github/workflows/ui312-audit-once.yml
      - name: Publish only the fixed staging ref
        id: commit
        working-directory: candidate
        shell: bash
        env:
          GIT_AUTHOR_NAME: roccho
          GIT_AUTHOR_EMAIL: 40359643+roccho-dev@users.noreply.github.com
          GIT_COMMITTER_NAME: roccho
          GIT_COMMITTER_EMAIL: 40359643+roccho-dev@users.noreply.github.com
        run: |
          set -euo pipefail
          tree=$(git write-tree)
          test "$tree" = 00854307d85235514e0ef3150e04d88440f6c47f
          commit=$(printf '%s\n' 'refactor(ui): relocate capability sources and preserve distribution paths (#312)' '' 'P3 of UI312-R2. Exact prepared tree reproduced from the reviewed seed. No staging helper in this product tree. Final PR checks/review remain required.' | git commit-tree "$tree" -p b67f3e90ed263297479f5cfd8c8b052f29697870)
          git push origin "$commit:refs/heads/stage/ui-312-source-output"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Prepared commit: $commit; tree: $tree"
  artifact-parity:
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f8b92234102ceee3205220dec7041b39d818eefc
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.stage.outputs.commit }}
          path: candidate
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Compare actual Nix outputs from exact source trees
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.stage.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = f8b92234102ceee3205220dec7041b39d818eefc
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = 00854307d85235514e0ef3150e04d88440f6c47f
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, stat, subprocess
          root=Path.cwd()
          report={'baseline':'f8b92234102ceee3205220dec7041b39d818eefc', 'candidate':os.environ['CANDIDATE_SHA'], 'tree':'00854307d85235514e0ef3150e04d88440f6c47f', 'artifacts':[]}
          def manifest(directory):
              result={}
              for p in sorted(directory.rglob('*')):
                  if p.is_symlink():
                      raise AssertionError('unexpected symlink: '+str(p.relative_to(directory)))
                  if p.is_file():
                      result[p.relative_to(directory).as_posix()]=[stat.S_IMODE(p.stat().st_mode),hashlib.sha256(p.read_bytes()).hexdigest()]
              assert result, 'empty artifact'
              return result
          for attr in ['ui-ir','a2ui-browser','semantic-map','control-ui']:
              values=[]
              for repo in ['baseline','candidate']:
                  raw=subprocess.check_output(['nix','build','--json','--no-link','--print-build-logs','--no-write-lock-file',str(root/repo)+'#'+attr], text=True)
                  outputs=json.loads(raw)
                  assert len(outputs)==1 and outputs[0]['outputs'].get('out'), outputs
                  values.append(manifest(Path(outputs[0]['outputs']['out'])))
              different=sorted(k for k in values[0].keys()|values[1].keys() if values[0].get(k)!=values[1].get(k))
              report['artifacts'].append({'attr':attr,'files':len(values[0]),'equal':not different,'differences':different,'manifest_sha256':hashlib.sha256(json.dumps(values[0],sort_keys=True).encode()).hexdigest()})
          report['status']='PASS' if all(x['equal'] for x in report['artifacts']) else 'FAIL'
          destination=Path(os.environ['RUNNER_TEMP'])/'ui312-parity'
          destination.mkdir()
          (destination/'parity.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          assert report['status']=='PASS', 'public artifact regression'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui312-nix-before-after
          path: ${{ runner.temp }}/ui312-parity/
          if-no-files-found: warn
          retention-days: 7
