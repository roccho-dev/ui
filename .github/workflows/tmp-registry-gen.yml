name: tmp registry generator

on:
  push:
    branches:
      - tmp/t271-registry-gen-300b

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/t271-registry-gen-300b
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate canonical registry
        run: node apps/artifact-shell/scripts/build-registry.mjs
      - name: Commit generated registry when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/artifact-shell/generated/capability-registry.mjs; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/artifact-shell/generated/capability-registry.mjs
          git commit -m 'chore: regenerate capability registry'
          git push origin HEAD:tmp/t271-registry-gen-300b
