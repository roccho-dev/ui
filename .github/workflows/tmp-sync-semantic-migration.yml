name: Temporary audit semantic migration manifest

on:
  push:
    paths:
      - .github/workflows/tmp-sync-semantic-migration.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: List every migration hash mismatch
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const path = 'packages/semantic-map/migration-manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const byTarget = new Map();
          for (const evolution of manifest.evolutions ?? []) {
            const list = byTarget.get(evolution.target) ?? [];
            list.push(evolution);
            byTarget.set(evolution.target, list);
          }
          const mismatches = [];
          for (const entry of manifest.entries) {
            let expected = entry.targetSha256;
            for (const evolution of byTarget.get(entry.target) ?? []) {
              if (evolution.fromSha256 !== expected) throw new Error(`broken chain ${entry.target}: ${evolution.fromSha256} != ${expected}`);
              expected = evolution.toSha256;
            }
            const actual = createHash('sha256').update(fs.readFileSync(entry.target)).digest('hex');
            if (actual !== expected) mismatches.push({ target: entry.target, expected, actual });
          }
          console.log(JSON.stringify({ schema: 'semantic-map-migration-mismatch-audit/1', mismatches }, null, 2));
          if (mismatches.length === 0) process.exit(0);
          process.exit(1);
          NODE
