name: T283 active-list diagnose

on:
  push:
    branches:
      - fix/retire-smap-t283

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/retire-smap-t283
          token: ${{ github.token }}
      - name: Improve failure evidence
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/artifact-shell/tests/maxgraph-active-list-browser-proof.py')
          s = p.read_text()
          old = '                assert status.get_attribute("data-state") == "pass", status.text_content()'
          new = '''                if status.get_attribute("data-state") != "pass":\n                    result_text = page.locator("#result").text_content()\n                    receipt_text = page.locator("#receipt").text_content()\n                    raise AssertionError(f"{status.text_content()}\\nresult={result_text}\\nreceipt={receipt_text}")'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one assertion, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/t283-active-list-diagnose.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: expose active-list invocation diagnostics'
          git push origin HEAD:fix/retire-smap-t283
      - name: Install browser proof tooling
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'playwright==1.57.0'
          python3 -m playwright install --with-deps chromium
          python3 - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(f"CHROMIUM_EXECUTABLE={playwright.chromium.executable_path}")
          PY
      - name: Reproduce active-list proof
        run: python3 apps/artifact-shell/tests/maxgraph-active-list-browser-proof.py
