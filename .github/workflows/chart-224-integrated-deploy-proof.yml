name: Chart 224 integrated deploy proof

on:
  push:
    branches:
      - control/chart-224-integrated-deploy-260915

permissions:
  contents: read

env:
  SOURCE_SHA: 940de85e3dddbb60ec486f65a442c99c1660e257
  CLOUDFLARE_PAGES_PROJECT: stg-artifact-runtime
  CLOUDFLARE_PAGES_BRANCH: ui-deploy-pr-224

jobs:
  prove:
    runs-on: ubuntu-latest
    environment: ui-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build exact integrated publication
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          out="$RUNNER_TEMP/artifact-shell-publication"
          npm run build:artifact-shell-publication -- --out="$out"
          echo "ARTIFACT_SHELL_PUBLICATION=$out" >> "$GITHUB_ENV"
      - name: Deploy exact source to same Pages alias
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/wrangler-pages-deploy.log"
          npx --yes wrangler@4.112.0 pages deploy "$ARTIFACT_SHELL_PUBLICATION" \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch="$CLOUDFLARE_PAGES_BRANCH" \
            --commit-hash="$SOURCE_SHA" | tee "$log"
          root="$(grep -oE 'https://[0-9a-f]+\.stg-artifact-runtime\.pages\.dev' "$log" | head -n1)"
          test -n "$root"
          echo "DEPLOY_ROOT=$root" >> "$GITHUB_ENV"
          echo "IMMUTABLE_DEPLOYMENT=$root" >> "$GITHUB_ENV"
          printf '%s\n' "$root" > "$RUNNER_TEMP/immutable-deployment.txt"
      - name: Prove generic publication browser contract
        run: bash apps/artifact-shell/tests/prove-publication-browser.sh "$DEPLOY_ROOT"
      - name: Install pinned Chromium proof tooling
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.57.0"
          python3 -m playwright install --with-deps chromium
      - name: Generate canonical Chart #data URLs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chart-integrated-proof/screenshots"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createUrlModuleUrl, readUrlModule } from './packages/url-module/src/codec.mjs';
          const targets = Object.freeze({
            'bar-horizontal': 'product',
            'bar-vertical': 'sales-0',
            line: 'active-0',
            pie: 'share-0',
            donut: 'share-0',
            scatter: 'growth-a',
            heatmap: 'tokyo-am',
            sunburst: 'product',
          });
          const specs = [];
          for (const [variant, targetId] of Object.entries(targets)) {
            const records = fs.readFileSync(`examples/chart/${variant}.jsonl`, 'utf8')
              .split(/\r?\n/u).filter(Boolean).map(line => JSON.parse(line));
            const target = records.find(record => record.type === 'region' && record.id === targetId);
            if (!target) throw new Error(`${variant}: target ${targetId} missing`);
            const sentinel = `__integrated_data_${variant.replaceAll('-', '_')}__`;
            target.label = sentinel;
            const value = records.map(record => JSON.stringify(record)).join('\n') + '\n';
            const url = await createUrlModuleUrl({
              base: `${process.env.DEPLOY_ROOT}/adapters/chart/${variant}/`, fragment: 'data', value,
            });
            if (!url.includes('#data=')) throw new Error(`${variant}: #data missing`);
            if (url.length > 8192) throw new Error(`${variant}: URL too long ${url.length}`);
            if (await readUrlModule({ fragment: 'data', input: url }) !== value) throw new Error(`${variant}: codec round trip mismatch`);
            specs.push({ variant, targetId, sentinel, edited: `${sentinel}_edited`, chars: url.length, url });
          }
          fs.writeFileSync(process.env.RUNNER_TEMP + '/chart-integrated-proof/specs.json', JSON.stringify(specs, null, 2));
          for (const spec of specs) console.log(JSON.stringify(spec));
          NODE
      - name: Prove #data and real authoring for all eight Chart variants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          root = Path(os.environ['RUNNER_TEMP']) / 'chart-integrated-proof'
          specs = json.loads((root / 'specs.json').read_text(encoding='utf-8'))
          results = []

          def domain_label(page, region_id):
              return page.evaluate(
                  """regionId => window.semanticMapSite?.editor?.snapshot().domain.regions.find(item => item.id === regionId)?.label ?? null""",
                  region_id,
              )

          def wait_label(page, region_id, expected):
              page.wait_for_function(
                  """args => window.semanticMapSite?.editor?.snapshot().domain.regions.find(item => item.id === args.regionId)?.label === args.expected""",
                  {'regionId': region_id, 'expected': expected},
                  timeout=30_000,
              )

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for spec in specs:
                  page_errors = []
                  failed = []
                  requests = []
                  page = browser.new_page(viewport={'width': 1440, 'height': 1000})
                  page.on('pageerror', lambda exc, bag=page_errors: bag.append(str(exc)))
                  page.on('request', lambda req, bag=requests: bag.append(req.url))
                  page.on('requestfailed', lambda req, bag=failed: bag.append({'url': req.url, 'failure': req.failure}))
                  response = page.goto(spec['url'], wait_until='domcontentloaded', timeout=30_000)
                  assert response is not None and response.ok, f"{spec['variant']}: HTTP failure"
                  page.wait_for_selector('html[data-status="pass"]', timeout=60_000)
                  assert domain_label(page, spec['targetId']) == spec['sentinel'], f"{spec['variant']}: domain not sourced from #data"
                  fallback = [url for url in requests if url.split('?', 1)[0].endswith('/input.json')]
                  assert not fallback, f"{spec['variant']}: input.json fallback fetched {fallback}"
                  active = page.locator(f'button[data-active-key="region:{spec["targetId"]}"]')
                  active.wait_for(state='visible', timeout=30_000)
                  assert spec['sentinel'] in (active.text_content() or ''), f"{spec['variant']}: active-list not sourced from #data"
                  active.click()
                  started = page.evaluate("window.semanticMapSite.editor.adapter.startEditingSelection()")
                  assert started is True, f"{spec['variant']}: real inline editor did not start"
                  connected = page.evaluate("""() => {
                    const plugin = window.semanticMapSite.editor.adapter.graph.getPlugin('CellEditorHandler');
                    if (!plugin?.textarea?.isConnected || plugin.editingCell == null) return false;
                    plugin.textarea.dataset.chartIntegratedProof = 'editor';
                    return true;
                  }""")
                  assert connected is True, f"{spec['variant']}: CellEditorHandler textarea is not attached"
                  editor = page.locator('textarea[data-chart-integrated-proof="editor"]')
                  editor.wait_for(state='visible', timeout=10_000)
                  editor.fill(spec['edited'])
                  editor.press('Enter')
                  wait_label(page, spec['targetId'], spec['edited'])
                  active.wait_for(state='visible', timeout=10_000)
                  assert spec['edited'] in (active.text_content() or ''), f"{spec['variant']}: edited label not rerendered"
                  page.keyboard.press('Control+z')
                  wait_label(page, spec['targetId'], spec['sentinel'])
                  assert spec['sentinel'] in (active.text_content() or ''), f"{spec['variant']}: undo DOM mismatch"
                  page.keyboard.press('Control+y')
                  wait_label(page, spec['targetId'], spec['edited'])
                  assert spec['edited'] in (active.text_content() or ''), f"{spec['variant']}: redo DOM mismatch"
                  page.keyboard.press('Control+z')
                  wait_label(page, spec['targetId'], spec['sentinel'])
                  assert not page_errors, f"{spec['variant']}: page errors {page_errors}"
                  assert not failed, f"{spec['variant']}: failed requests {failed}"
                  screenshot = root / 'screenshots' / f"{spec['variant']}.png"
                  page.screenshot(path=str(screenshot), full_page=True)
                  result = {
                      'variant': spec['variant'], 'status': 'PASS', 'url': spec['url'], 'chars': spec['chars'],
                      'targetId': spec['targetId'], 'domainFromHash': True, 'activeListFromHash': True,
                      'inputJsonFallbackRequests': fallback, 'inlineEdit': True, 'undo': True, 'redo': True,
                      'finalRestore': True, 'pageErrors': page_errors, 'requestFailed': failed,
                  }
                  results.append(result)
                  print(json.dumps(result, ensure_ascii=False))
                  page.close()
              browser.close()
          final = {
              'schema': 'ui.chart-integrated-deployed-proof/1', 'status': 'PASS',
              'sourceSha': os.environ['SOURCE_SHA'], 'immutableDeployment': os.environ['IMMUTABLE_DEPLOYMENT'],
              'stableAlias': 'https://ui-deploy-pr-224.stg-artifact-runtime.pages.dev', 'variants': results,
          }
          (root / 'receipt.json').write_text(json.dumps(final, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(final, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-224-integrated-deploy-proof
          path: |
            ${{ runner.temp }}/chart-integrated-proof
            ${{ runner.temp }}/immutable-deployment.txt
            ${{ runner.temp }}/wrangler-pages-deploy.log
          if-no-files-found: error
