name: Temporary graph218 fix v4

on:
  push:
    branches:
      - feat/graph1-structured-graph-260914

permissions:
  contents: write

jobs:
  fix-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply multiline wrap fix when needed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          labels = Path('packages/semantic-map/renderer-maxgraph/labels.js')
          text = labels.read_text()
          old = "  if (lineCount > 1) return '';\n"
          new = "  if (lineCount > 1) return label;\n"
          if old in text:
              labels.write_text(text.replace(old, new, 1))

          fixture = Path('packages/semantic-map/examples/graph/self-loop.jsonl')
          text = fixture.read_text()
          text = text.replace('"label":"relations[]"', '"label":"rationale / required_dependencies / relations[]"')
          fixture.write_text(text)

          test = Path('packages/semantic-map/tests/graph_semantics_test.mjs')
          text = test.read_text()
          marker = 'long structured rows must remain renderable via wrapping'
          if marker not in text:
              anchor = "assert.match(displayedRegionLabel(selfClaim, 1, DEFAULT_THEME, false), /role: proposal \\| decision/u, 'structured self-loop rows must remain visible');\n"
              addition = anchor + "assert.match(displayedRegionLabel(selfClaim, 1, DEFAULT_THEME, false), /required_dependencies/u, 'long structured rows must remain renderable via wrapping');\n"
              if anchor not in text:
                  raise SystemExit('structured label test anchor missing')
              test.write_text(text.replace(anchor, addition, 1))
          PY

      - name: Focused and full semantic-map gates
        run: |
          node packages/semantic-map/tests/graph_semantics_test.mjs
          node packages/semantic-map/tests/run.mjs

      - name: Commit multiline fix if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/semantic-map/renderer-maxgraph/labels.js packages/semantic-map/examples/graph/self-loop.jsonl packages/semantic-map/tests/graph_semantics_test.mjs; then
            echo 'no fix diff'
            exit 0
          fi
          git config user.name roccho
          git config user.email 40359643+roccho-dev@users.noreply.github.com
          git add packages/semantic-map/renderer-maxgraph/labels.js packages/semantic-map/examples/graph/self-loop.jsonl packages/semantic-map/tests/graph_semantics_test.mjs
          git commit -m '[graph218-loop] fix: wrap structured multiline graph labels'
          git push origin HEAD:feat/graph1-structured-graph-260914
