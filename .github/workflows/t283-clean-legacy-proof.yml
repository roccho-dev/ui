name: T283 clean legacy proof residue

on:
  push:
    branches:
      - fix/retire-smap-t283

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove legacy-name-only negative assertions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          targets = [
              Path('packages/semantic-map/tests/set_topology_gesture_review_join_browser_e2e.py'),
              Path('packages/semantic-map/tests/set_topology_roundtrip_browser_e2e.py'),
          ]
          needle = '        assert "#smap=" not in '
          removed = 0
          for path in targets:
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              kept = []
              local = 0
              for line in lines:
                  if needle in line:
                      local += 1
                      removed += 1
                      continue
                  kept.append(line)
              if local != 1:
                  raise SystemExit(f'{path}: expected exactly one legacy-name assertion, found {local}')
              path.write_text(''.join(kept), encoding='utf-8')
          if removed != 2:
              raise SystemExit(f'expected 2 removals, got {removed}')
          PY
          rm .github/workflows/t283-clean-legacy-proof.yml
          git add -A
          git commit -m "test: keep retired transport name out of browser proofs"
          git push origin HEAD:fix/retire-smap-t283
