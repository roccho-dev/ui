name: Apply semantic-map UI capability

on:
  push:
    branches:
      - transport/semantic-map-ui-260829

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: apply-semantic-map-ui-260829
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: docs/ui-registry-purpose-shell-examples-260829
      EXPECTED_TARGET_HEAD: 0b8db82d67fffb2724e99ba8a2ed107988455c15
      EXPECTED_PAYLOAD_SHA256: 93a366f4ba6b12c6e435b700b973c3438abbd85ca94b5fb5b124a1f56a3aa394
      FULL_PAYLOAD_BLOB: 45c8cf5a157a3c5a4a0df28967b007e8a745db46
      PR_NUMBER: "172"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct, diagnose, and verify exact payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$FULL_PAYLOAD_BLOB" --jq .content \
            | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/blob.raw"

          raw_sha="$(sha256sum "$RUNNER_TEMP/blob.raw" | cut -d' ' -f1)"
          raw_bytes="$(stat -c %s "$RUNNER_TEMP/blob.raw")"
          raw_head="$(head -c 16 "$RUNNER_TEMP/blob.raw" | xxd -p -c 256)"
          raw_xz=false
          if xz -t "$RUNNER_TEMP/blob.raw" 2>/dev/null; then raw_xz=true; fi

          decoded_ok=false
          decoded_xz=false
          decoded_sha=none
          decoded_bytes=0
          decoded_head=none
          if base64 --decode "$RUNNER_TEMP/blob.raw" > "$RUNNER_TEMP/blob.decoded" 2>/dev/null; then
            decoded_ok=true
            decoded_sha="$(sha256sum "$RUNNER_TEMP/blob.decoded" | cut -d' ' -f1)"
            decoded_bytes="$(stat -c %s "$RUNNER_TEMP/blob.decoded")"
            decoded_head="$(head -c 16 "$RUNNER_TEMP/blob.decoded" | xxd -p -c 256)"
            if xz -t "$RUNNER_TEMP/blob.decoded" 2>/dev/null; then decoded_xz=true; fi
          fi

          candidate=none
          if test "$raw_xz" = true; then
            cp "$RUNNER_TEMP/blob.raw" "$RUNNER_TEMP/payload.tar.xz"
            candidate=raw
          elif test "$decoded_xz" = true; then
            cp "$RUNNER_TEMP/blob.decoded" "$RUNNER_TEMP/payload.tar.xz"
            candidate=decoded
          fi
          candidate_sha=none
          candidate_has_apply=false
          candidate_entries=none
          if test "$candidate" != none; then
            candidate_sha="$(sha256sum "$RUNNER_TEMP/payload.tar.xz" | cut -d' ' -f1)"
            candidate_entries="$(tar -tJf "$RUNNER_TEMP/payload.tar.xz" | head -n 20 | paste -sd ',' -)"
            if tar -tJf "$RUNNER_TEMP/payload.tar.xz" | grep -qx 'apply.py'; then candidate_has_apply=true; fi
          fi

          {
            echo '### Semantic-map full payload diagnostic'
            echo
            echo '```text'
            echo "git_blob=$FULL_PAYLOAD_BLOB"
            echo "raw bytes=$raw_bytes sha256=$raw_sha head=$raw_head xz=$raw_xz"
            echo "decoded ok=$decoded_ok bytes=$decoded_bytes sha256=$decoded_sha head=$decoded_head xz=$decoded_xz"
            echo "candidate=$candidate sha256=$candidate_sha has_apply=$candidate_has_apply"
            echo "expected=$EXPECTED_PAYLOAD_SHA256"
            echo "entries=$candidate_entries"
            echo '```'
          } > "$RUNNER_TEMP/payload-diagnostic.md"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body="$(cat "$RUNNER_TEMP/payload-diagnostic.md")"

          test "$candidate" != none
          test "$candidate_has_apply" = true
          test "$candidate_sha" = "$EXPECTED_PAYLOAD_SHA256"
          mkdir -p "$RUNNER_TEMP/payload"
          tar -xJf "$RUNNER_TEMP/payload.tar.xz" -C "$RUNNER_TEMP/payload"
          test -f "$RUNNER_TEMP/payload/apply.py"

      - name: Fail closed on target branch movement
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_TARGET_HEAD"
          git worktree add --detach "$RUNNER_TEMP/target" "origin/$TARGET_BRANCH"
          git -C "$RUNNER_TEMP/target" switch -c "$TARGET_BRANCH"

      - name: Materialize source-only semantic-map capability
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/payload/apply.py" "$RUNNER_TEMP/target" "$RUNNER_TEMP/payload"
          git -C "$RUNNER_TEMP/target" diff --check
          test -z "$(git -C "$RUNNER_TEMP/target" grep -n -i -E 'mobile[- ]agent|mobile_agent|mobileAgent' -- packages/semantic-map apps/artifact-shell/capabilities/render-semantic-map examples/render.semantic.map tests/check-semantic-map-capability.mjs tests/check-semantic-map-browser.py || true)"

      - name: Verify package, capability registry, shell, and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/target"
          node packages/semantic-map/tests/run.mjs
          node tests/check-semantic-map-capability.mjs
          npm run check:artifact-runtime
          node tests/run-all.mjs

      - name: Verify horizontal and vertical browser authoring round-trip
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/target"
          python3 -m pip install --quiet --disable-pip-version-check playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          chrome="$(python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )"
          test -x "$chrome"
          CHROME_BIN="$chrome" python3 tests/check-semantic-map-browser.py

      - name: Commit and push exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/target"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat: add semantic-map capability family'
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Remove one-shot transport branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete transport/semantic-map-ui-260829
