name: UI213 registry commit proof

on:
  push:
    branches:
      - fix/generated-registry-jsonl-260914

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate and commit only registry
        shell: bash
        run: |
          set -euo pipefail
          node apps/artifact-shell/scripts/build-registry.mjs
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          test -n "$changed"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 1
          printf '%s\n' "$changed" | grep -q 'apps/artifact-shell/generated/capability-registry.mjs$'
          sha256sum apps/artifact-shell/generated/capability-registry.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/artifact-shell/generated/capability-registry.mjs
          git commit -m 'chore: regenerate artifact capability registry'
          git push origin HEAD:fix/generated-registry-jsonl-260914
