name: Semantic map final source integration retry

on:
  push:
    branches: [transport/semantic-map-final-integration-260829]
    paths:
      - .github/semantic-map-final-integration.RETRY

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: semantic-map-final-source-integration
  cancel-in-progress: false

env:
  BASE_SHA: f0c1ff68889e21a3cd203dd2a4ef4e2ed0bc6bb7
  SOURCE_TARGET: 0b8db82d67fffb2724e99ba8a2ed107988455c15
  SOURCE_CARRIER_COMMIT: cb4995cd4bd2f254738fddd7f1f9ee9f80d73578
  FULL_PAYLOAD_BLOB: 45c8cf5a157a3c5a4a0df28967b007e8a745db46
  FULL_PAYLOAD_SHA256: 93a366f4ba6b12c6e435b700b973c3438abbd85ca94b5fb5b124a1f56a3aa394
  DELTA_ISSUE: '178'
  DELTA_MARKER: semantic-map-meaning-recovery-carrier/1
  DELTA_CHUNKS: '7'
  DELTA_ARCHIVE_SHA: 19f82381b03d651106b6a5aa375597021699aaa15f23261a7268836b73b56c2e
  DELTA_BASE64_SHA: 1448c432905376a5ad3ff2b41c7299be3e46818dc6cbe56f84e1b30e40ddabae
  DELTA_ARCHIVE_BYTES: '92628'
  CANDIDATE_BRANCH: proposal/semantic-map-final-integration-260830

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0

      - name: Require exact authority base and absent candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/proposals | cut -f1)" = "$BASE_SHA"
          ! git ls-remote --exit-code origin "refs/heads/$CANDIDATE_BRANCH" >/dev/null 2>&1

      - name: Recover reviewed source from exact Git object
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/semantic-map-source"
          source="$RUNNER_TEMP/semantic-map-source-tree"
          mkdir -p "$root/payload" "$root/delta"

          git fetch --no-tags origin "$SOURCE_TARGET" "$SOURCE_CARRIER_COMMIT"
          git cat-file -e "$FULL_PAYLOAD_BLOB^{blob}"
          git cat-file blob "$FULL_PAYLOAD_BLOB" > "$root/payload.b64"
          base64 --decode "$root/payload.b64" > "$root/payload.tar.xz"
          xz --test "$root/payload.tar.xz"
          test "$(sha256sum "$root/payload.tar.xz" | cut -d' ' -f1)" = "$FULL_PAYLOAD_SHA256"
          tar -xJf "$root/payload.tar.xz" -C "$root/payload"
          test -f "$root/payload/apply.py"

          git worktree add --detach "$source" "$SOURCE_TARGET"
          python3 "$root/payload/apply.py" "$source" "$root/payload"
          git -C "$source" diff --check
          test -f "$source/packages/semantic-map/package.json"

          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$DELTA_ISSUE/comments?per_page=100" | jq -s 'add' > "$root/delta/comments.json"
          python3 - "$root/delta" <<'PY'
          from __future__ import annotations
          import base64, hashlib, json, os, pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          marker = f"<!-- {os.environ['DELTA_MARKER']} -->"
          count = int(os.environ['DELTA_CHUNKS'])
          chunks: dict[int, str] = {}
          for comment in json.loads((root / 'comments.json').read_text(encoding='utf-8')):
              body = comment.get('body') or ''
              if marker not in body:
                  continue
              match = re.search(r'^chunk:\s*(\d+)/(\d+)\s*$', body, re.MULTILINE)
              assert match, 'delta chunk metadata missing'
              index, total = map(int, match.groups())
              assert total == count and index not in chunks, f'invalid delta chunk {index}/{total}'
              chunks[index] = re.sub(r'\s+', '', body.split('\ndata:\n', 1)[1])
          assert set(chunks) == set(range(count)), sorted(chunks)
          encoded = ''.join(chunks[index] for index in range(count)).encode('ascii')
          assert hashlib.sha256(encoded).hexdigest() == os.environ['DELTA_BASE64_SHA']
          archive = base64.b64decode(encoded, validate=True)
          assert len(archive) == int(os.environ['DELTA_ARCHIVE_BYTES'])
          assert hashlib.sha256(archive).hexdigest() == os.environ['DELTA_ARCHIVE_SHA']
          (root / 'overlay.archive').write_bytes(archive)
          PY
          python3 - "$root/delta/overlay.archive" "$source" <<'PY'
          import pathlib, sys, tarfile
          archive, target = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          with tarfile.open(archive, 'r:*') as handle:
              for member in handle.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert not member.issym() and not member.islnk()
              handle.extractall(target, filter='data')
          PY
          if test -f "$source/__DELETE__.txt"; then
            while IFS= read -r path; do
              test -z "$path" && continue
              case "$path" in /*|../*|*/../*) exit 1;; esac
              rm -rf -- "$source/$path"
            done < "$source/__DELETE__.txt"
            rm "$source/__DELETE__.txt"
          fi

          cp "$source/package.json" "$root/source-package.json"
          git -C "$source" checkout "$SOURCE_TARGET" -- README.md apps/artifact-shell/README.md examples/README.md package.json
          git -C "$source" add -A
          git -C "$source" diff --cached --binary "$SOURCE_TARGET" > "$root/source.patch"
          test -s "$root/source.patch"
          git apply --3way "$root/source.patch"

          python3 - "$root/source-package.json" package.json <<'PY'
          import json, pathlib, sys
          source = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          target_path = pathlib.Path(sys.argv[2])
          current = json.loads(target_path.read_text(encoding='utf-8'))
          for key in ('imports', 'exports'):
              current.setdefault(key, {})
              for name, value in source.get(key, {}).items(): current[key].setdefault(name, value)
          current['workspaces'] = list(dict.fromkeys([*current.get('workspaces', []), *source.get('workspaces', [])]))
          current.setdefault('scripts', {})
          for name, value in source.get('scripts', {}).items():
              if name == 'check:artifact-runtime':
                  left = [part.strip() for part in current['scripts'].get(name, '').split('&&') if part.strip()]
                  right = [part.strip() for part in value.split('&&') if part.strip()]
                  current['scripts'][name] = ' && '.join(dict.fromkeys([*left, *right]))
              else:
                  current['scripts'].setdefault(name, value)
          target_path.write_text(json.dumps(current, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git diff --check
          test -f packages/semantic-map/package.json
          test -f apps/artifact-shell/capabilities/render-semantic-map/manifest.json

      - name: Build and verify source
        shell: bash
        run: |
          set -euo pipefail
          node apps/root-jsonl-map/check.mjs
          node apps/artifact-shell/scripts/build-registry.mjs
          node packages/semantic-map/scripts/build-browser-example.mjs
          node packages/semantic-map/scripts/build-browser-example.mjs \
            --input=examples/render.semantic-map.set-topology/input/envelope.json \
            --out=examples/render.semantic-map.set-topology/dist
          test -f examples/render.semantic-map/dist/index.html
          test -f examples/render.semantic-map.set-topology/dist/index.html
          if git grep -n -i -E 'mobile[-_ ]agent|mobileAgent|MOBILE_AGENT' -- . ':!packages/semantic-map/vendor/**'; then
            exit 1
          fi
          node tests/check-semantic-map-migration.mjs
          node tests/check-semantic-map-legacy-source.mjs
          node packages/semantic-map/tests/run.mjs
          node packages/semantic-map/tests/example_reproducibility.mjs
          node apps/artifact-shell/tests/semantic-map-capability.mjs
          npm run check:artifact-runtime
          node tests/run-all.mjs

      - name: Prove browser behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          chrome="$(python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as value:
              print(value.chromium.executable_path)
          PY
          )"
          CHROMIUM_EXECUTABLE="$chrome" python3 packages/semantic-map/tests/set_topology_browser.py
          CHROMIUM_EXECUTABLE="$chrome" python3 packages/semantic-map/tests/browser_example.py

      - name: Commit exact candidate
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b "$CANDIDATE_BRANCH"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat: integrate semantic-map source and typed authoring'
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "files=$(git diff --name-only "$BASE_SHA" HEAD | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Open exact-head PR and record receipt
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
          TREE_SHA: ${{ steps.commit.outputs.tree }}
          FILES: ${{ steps.commit.outputs.files }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/body.md"
          cat > "$body" <<EOF
          ## Purpose
          Materialize the reviewed Semantic Map source on the current UI authority.

          ## Exact identity
          - base: \`$BASE_SHA\`
          - head: \`$HEAD_SHA\`
          - tree: \`$TREE_SHA\`
          - changed files: \`$FILES\`
          - full payload blob: \`$FULL_PAYLOAD_BLOB\`
          - full payload SHA-256: \`$FULL_PAYLOAD_SHA256\`
          - meaning overlay SHA-256: \`$DELTA_ARCHIVE_SHA\`

          ## Boundary
          Source authority is \`packages/semantic-map/**\`. Generated HTML/SVG/dist remain projections. No deployment, ADRS authority change, or cutover is claimed.

          Closes #178.
          EOF
          url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base proposals --head "$CANDIDATE_BRANCH" --title 'feat: integrate semantic-map source and typed authoring' --body-file "$body")"
          number="${url##*/}"
          gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid | grep -Fx "$HEAD_SHA"
          gh issue comment "$DELTA_ISSUE" --repo "$GITHUB_REPOSITORY" --body "## Exact Git-object recovery PASS\n\nPR: $url\n\n\`\`\`text\nbase  $BASE_SHA\nhead  $HEAD_SHA\ntree  $TREE_SHA\nfiles $FILES\n\`\`\`\n\nThe incomplete Issue #173 carrier was not used. The exact full payload Git blob, pinned payload digest, complete meaning overlay, source checks, reproducibility checks and real Chromium proofs passed before push. Authority/effect/cutover remain unchanged."
