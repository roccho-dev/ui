name: Purpose visualization artifact

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - proposals

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  purpose-visualization-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install screenshot fonts
        run: |
          # A mirror that stalls with no output is cut and tried again (adrs#647 R c6354549200: ui#389-#392 hung here until the 20-minute job limit).
          retry() { for attempt in 1 2 3; do timeout --kill-after=10 "$1" "${@:2}" && return 0; echo "attempt $attempt of 3 failed or passed ${1}s: ${*:2}" >&2; sleep 5; done; return 1; }
          retry 240 sudo apt-get -o Acquire::Retries=3 update
          retry 300 sudo apt-get -o Acquire::Retries=3 install -y fonts-noto-cjk
          fc-cache -f
      - name: Build runnable HTML through Nix-declared input contract
        run: |
          nix build --print-build-logs .#purpose-visualization-artifact --out-link result-purpose-visualization
          rm -rf purpose-visualization-result
          mkdir -p purpose-visualization-result
          cp -RL result-purpose-visualization/. purpose-visualization-result/
          chmod -R u+w purpose-visualization-result
      - name: Execute runtime and capture screenshots
        run: node scripts/smoke-purpose-visualization.mjs purpose-visualization-result
      - uses: actions/upload-artifact@v4
        with:
          name: purpose-visualization-html
          path: purpose-visualization-result/purpose-visualization-html
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: purpose-visualization-screenshots
          path: purpose-visualization-result/purpose-visualization-screenshots
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: purpose-visualization-evidence
          path: purpose-visualization-result/purpose-visualization-evidence
          if-no-files-found: error
