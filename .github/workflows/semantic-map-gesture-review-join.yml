name: Semantic Map gesture-review join

on:
  pull_request:
    paths:
      - packages/semantic-map/**
      - packages/business-model/**
      - examples/shared/**
      - examples/chart/**
      - examples/render.semantic-map.set-topology/**
      - apps/preview/**
      - apps/artifact-shell/tests/maxgraph-active-list-browser-proof.py
      - apps/artifact-shell/tests/maxgraph-edge-authoring-browser-proof.py
      - apps/artifact-shell/tests/maxgraph-edge-hit-target-browser-proof.py
      - apps/artifact-shell/tests/maxgraph-keyboard-shortcuts-browser-proof.py
      - .github/workflows/semantic-map-gesture-review-join.yml
  workflow_dispatch:

jobs:
  gesture-review-join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove semantic source gates
        run: node packages/semantic-map/tests/run.mjs
      - name: Check preview cases
        run: npm --prefix apps/preview run check
      - name: Install pinned browser proof tooling
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.57.0"
          python3 -m playwright install --with-deps chromium
      - name: Resolve pinned Chromium
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(f"CHROMIUM_EXECUTABLE={playwright.chromium.executable_path}")
          PY
      - name: Prove one data fragment across graph seq presentation
        run: python3 apps/preview/tests/unified-runtime-data-browser-proof.py
      - name: Build ephemeral set-topology proof fixture
        run: npm run build:semantic-map-set-topology-proof
      - name: Prove actual gesture through review and fresh JSONL replay
        run: PYTHONPATH=packages/semantic-map/tests python3 packages/semantic-map/tests/set_topology_gesture_review_join_browser_e2e.py
      - name: Prove shared active list in graph map and seq
        run: python3 apps/artifact-shell/tests/maxgraph-active-list-browser-proof.py
      - name: Prove pointer edge connect reconnect and undo redo
        run: python3 apps/artifact-shell/tests/maxgraph-edge-authoring-browser-proof.py
      - name: Prove visible edge handle hit target and human-style drag
        run: python3 apps/artifact-shell/tests/maxgraph-edge-hit-target-browser-proof.py
      - name: Prove keyboard authoring shortcuts
        run: python3 apps/artifact-shell/tests/maxgraph-keyboard-shortcuts-browser-proof.py
      - name: Prove chart preview authoring across all variants
        run: python3 apps/preview/tests/chart-browser-proof.py
