name: Semantic Map gesture-review join

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feature-publication-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply relative engine href
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/artifact-shell/src/publication.mjs')
          text = path.read_text()
          old = 'href: new URL("./engine.mjs", publicationUrl).href'
          new = 'href: \\`./\\${entry.root}/engine.mjs\\`'
          if text.count(old) != 1:
              raise SystemExit(f'expected one engine href, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Check simplified publication architecture
        run: |
          set -euo pipefail
          test ! -e apps/artifact-shell/publication/copy-module-closure.mjs
          test ! -e packages/comptime/control.mjs
          ! grep -q 'compile:' apps/artifact-shell/adapters/control.mjs
          ! grep -R -nE 'proof:[[:space:]]*Object\.freeze' packages/control/feature.mjs packages/graph-editor/feature.mjs packages/presentation/feature.mjs
          grep -F 'href: \`./\${entry.root}/engine.mjs\`' apps/artifact-shell/src/publication.mjs
      - name: Prove publication source tests
        run: node apps/artifact-shell/tests/publication.mjs
      - name: Build publication
        run: node apps/artifact-shell/scripts/build-publication.mjs --out=dist
      - name: Prove publication in Chrome
        run: |
          set -euo pipefail
          node scripts/serve-static.mjs > "$RUNNER_TEMP/artifact-shell-static.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:18083/dist/index.html >/dev/null; then break; fi
            sleep .1
          done
          bash apps/artifact-shell/tests/prove-publication-browser.sh http://127.0.0.1:18083/dist
      - name: Commit proven engine href
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/artifact-shell/src/publication.mjs
          git commit -m 'fix: keep capability engine href relative'
          git push origin "HEAD:$BRANCH"
