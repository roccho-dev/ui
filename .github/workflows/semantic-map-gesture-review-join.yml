name: Semantic Map gesture-review join

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Split maxGraph responsibilities
        run: node scripts/split-maxgraph-adapter.mjs
      - name: Prove semantic-map source tests
        run: node packages/semantic-map/tests/run.mjs
      - name: Install pinned browser proof tooling
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.57.0"
          python3 -m playwright install --with-deps chromium
      - name: Resolve pinned Chromium
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(f"CHROMIUM_EXECUTABLE={playwright.chromium.executable_path}")
          PY
      - name: Prove semantic-map Chromium behavior
        run: |
          python3 packages/semantic-map/tests/browser_example.py
          PYTHONPATH=packages/semantic-map/tests python3 packages/semantic-map/tests/set_topology_gesture_review_join_browser_e2e.py
      - name: Commit proven split
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'no split output'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/semantic-map/renderer-maxgraph
          git commit -m 'refactor: split maxGraph adapter responsibilities'
          git push origin "HEAD:$BRANCH"
