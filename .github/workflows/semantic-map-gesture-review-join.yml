name: Semantic Map gesture-review join

on:
  pull_request:
    paths:
      - packages/semantic-map/**
      - examples/render.semantic-map.set-topology/**
      - .github/workflows/semantic-map-gesture-review-join.yml
  workflow_dispatch:

jobs:
  registry-repair:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chunk: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Emit one canonical registry chunk
        env:
          CHUNK: ${{ matrix.chunk }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/ui207-capability-registry.mjs"
          node apps/artifact-shell/scripts/build-registry.mjs --output "$output" >/dev/null
          OUTPUT="$output" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          value = base64.b64encode(Path(os.environ["OUTPUT"]).read_bytes()).decode("ascii")
          width = 12000
          index = int(os.environ["CHUNK"])
          chunks = [value[offset:offset + width] for offset in range(0, len(value), width)]
          if len(chunks) != 6:
              raise SystemExit(f"unexpected chunk count: {len(chunks)}")
          print(f"UI207_REGISTRY_{index + 1:02d}={chunks[index]}")
          PY
  gesture-review-join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned browser proof tooling
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.57.0"
          python3 -m playwright install --with-deps chromium
      - name: Resolve pinned Chromium
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(f"CHROMIUM_EXECUTABLE={playwright.chromium.executable_path}")
          PY
      - name: Prove actual gesture through review and fresh JSONL replay
        run: PYTHONPATH=packages/semantic-map/tests python3 packages/semantic-map/tests/set_topology_gesture_review_join_browser_e2e.py
