name: Temporary edge hit remote proof

on:
  push:
    branches:
      - chore/maxgraph-authoring-consolidation-260914

permissions:
  contents: read

jobs:
  remote-hit-proof:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_SHELL_BASE_URL: https://ui-maxgraph-authoring-217.pages.dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned browser proof tooling
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.57.0"
          python3 -m playwright install --with-deps chromium
      - name: Resolve pinned Chromium
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(f"CHROMIUM_EXECUTABLE={playwright.chromium.executable_path}")
          PY
      - name: Prove deployed visible edge handle hit target and drag
        run: python3 apps/artifact-shell/tests/maxgraph-edge-hit-target-browser-proof.py
