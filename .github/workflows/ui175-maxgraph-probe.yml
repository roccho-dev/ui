name: Export maxGraph 0.24.0 npm source for exact delta

on:
  push:
    branches:
      - transport/ui175-decision-packet-semantic-map-260829
    paths:
      - .transport/ui175/MAXGRAPH_PROBE

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Acquire and verify fixed npm source
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/maxgraph"
          mkdir -p "$root"
          cd "$root"
          archive="$(npm pack @maxgraph/core@0.24.0 --silent)"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = dfbcfe8fb1527046dd817466635463649ae370efe60b3768f43b01cff3f460c9
          mv "$archive" maxgraph-core-0.24.0.tgz
          printf '%s  %s\n' dfbcfe8fb1527046dd817466635463649ae370efe60b3768f43b01cff3f460c9 maxgraph-core-0.24.0.tgz > SHA256SUMS
      - name: Upload fixed source
        uses: actions/upload-artifact@v4
        with:
          name: ui175-maxgraph-npm-source
          path: |
            ${{ runner.temp }}/maxgraph/maxgraph-core-0.24.0.tgz
            ${{ runner.temp }}/maxgraph/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
