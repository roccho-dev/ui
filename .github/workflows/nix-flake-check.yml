name: Nix Flake Check

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: nix-flake-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nix-flake-check:
    name: nix flake check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run flake check
        run: |
          set -o pipefail
          nix flake check --print-build-logs 2>&1 | tee "$RUNNER_TEMP/ui-nix-flake-check.log"

      - name: Upload flake check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-nix-flake-check-log
          path: ${{ runner.temp }}/ui-nix-flake-check.log
          if-no-files-found: warn

      - name: Build gov package output
        run: nix build --print-build-logs .#gov-package-output --out-link result-gov-package-output

      - name: Upload gov package output
        uses: actions/upload-artifact@v4
        with:
          name: ui-gov-package-output
          path: result-gov-package-output/
