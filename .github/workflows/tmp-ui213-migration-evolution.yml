name: UI213 migration evolution proof

on:
  push:
    branches:
      - fix/semantic-map-migration-factory-evolution-260914

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enumerate stale migration targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          data=json.loads(Path('packages/semantic-map/migration-manifest.json').read_text(encoding='utf-8'))
          by_target={}
          for e in data.get('evolutions',[]): by_target.setdefault(e['target'],[]).append(e)
          mismatches=[]
          for item in data['entries']:
              expected=item['targetSha256']
              for e in by_target.get(item['target'],[]):
                  assert e['fromSha256']==expected,(item['target'],expected,e)
                  expected=e['toSha256']
              actual=hashlib.sha256(Path(item['target']).read_bytes()).hexdigest()
              if actual!=expected:
                  mismatches.append({'target':item['target'],'expected':expected,'actual':actual})
          print(json.dumps({'schema':'semantic-map-migration-stale-audit/1','count':len(mismatches),'mismatches':mismatches},sort_keys=True))
          assert mismatches, 'expected stale hashes for diagnostic run'
          PY
