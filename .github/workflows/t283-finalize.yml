name: T283 finalize proofs

on:
  push:
    branches:
      - fix/retire-smap-t283

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align proofs and retire temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          ROOT = Path('.')
          CURRENT_271 = '29c1f9d23f32eda95e7804dc0730c7171c66f3a7'

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              write(path, text.replace(old, new, 1))

          def from_271(path):
              return subprocess.check_output(
                  ['git', 'show', f'{CURRENT_271}:{path}'],
                  text=True,
              )

          # Keep #294 Pin/Unpin review coverage, but on the retired-transport contract.
          review_path = 'packages/semantic-map/tests/review_model_test.mjs'
          review = from_271(review_path)
          if '#smap=' not in review:
              raise SystemExit('review fixture no longer exposes expected legacy marker')
          review = review.replace('#smap=', '#data=')
          review = review.replace("semantic-map-review-model-test/1", "semantic-map-review-model-test/2")
          write(review_path, review)

          # Keep #294 deployed pin proof while preserving canonical case-list SSOT.
          deployed_path = 'apps/preview/tests/deployed-browser-proof.py'
          deployed = from_271(deployed_path)
          old = "    assert len(links) == 14, links\n    assert len({item['id'] for item in links}) == len(links)\n"
          new = "    assert [item['id'] for item in links] == launcher['cases'], (links, launcher)\n    assert len({item['id'] for item in links}) == len(links)\n"
          if deployed.count(old) != 1:
              raise SystemExit('deployed proof fixed-count block changed unexpectedly')
          write(deployed_path, deployed.replace(old, new, 1))

          # Add #294 layout contract to the post-retirement source gate only.
          run_path = 'packages/semantic-map/tests/run.mjs'
          replace_once(
              run_path,
              '"graph_semantics_test.mjs", "meaning_recovery_test.mjs"',
              '"graph_semantics_test.mjs", "layout_hint_test.mjs", "meaning_recovery_test.mjs"',
          )

          # Accept now returns the host-owned generic #data URL at the Review boundary.
          gesture_path = 'packages/semantic-map/tests/set_topology_gesture_review_join_browser_e2e.py'
          replace_once(
              gesture_path,
              '                assert accepted["url"] == ""\n\n                envelope =',
              '                assert "#data=" in accepted["url"]\n                assert "#smap=" not in accepted["url"]\n\n                envelope =',
          )
          replace_once(
              gesture_path,
              '                fragment = data_fragment(envelope)\n                case_id =',
              '                fragment = data_fragment(envelope)\n                assert accepted["url"].endswith(fragment), accepted["url"]\n                assert page.url.endswith(fragment), page.url\n                case_id =',
          )

          # Runtime.accept stays URL-free; the host transport creates the reopen URL.
          roundtrip_path = 'packages/semantic-map/tests/set_topology_roundtrip_browser_e2e.py'
          replace_once(
              roundtrip_path,
              "              const accepted=await semanticMapRuntime.accept(proposal);\n              await new Promise((resolve)=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));\n              const decision=JSON.parse(accepted.log.trimEnd().split('\\\\n').at(-1));\n              return {proposal,accepted:{decisionId:accepted.decisionId,stateHash:accepted.stateHash,log:accepted.log,url:accepted.url},decision};",
              "              const accepted=await semanticMapRuntime.accept(proposal);\n              const envelope=await semanticMapRuntime.envelope();\n              const url=await semanticMapDataTransport.create(envelope);\n              await new Promise((resolve)=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));\n              const decision=JSON.parse(accepted.log.trimEnd().split('\\\\n').at(-1));\n              return {proposal,accepted:{decisionId:accepted.decisionId,stateHash:accepted.stateHash,log:accepted.log,url},decision};",
          )
          replace_once(
              roundtrip_path,
              '        fragment = "#" + urlsplit(accepted["accepted"]["url"]).fragment\n',
              '        fragment = "#" + urlsplit(accepted["accepted"]["url"]).fragment\n        assert fragment.startswith("#data="), fragment\n        assert "#smap=" not in accepted["accepted"]["url"]\n',
          )
          PY

          node apps/artifact-shell/scripts/build-registry.mjs
          rm .github/workflows/t283-finalize.yml
          git add -A
          git commit -m "test: align #283 proofs with generic #data and layout hints"
          git push origin HEAD:fix/retire-smap-t283
