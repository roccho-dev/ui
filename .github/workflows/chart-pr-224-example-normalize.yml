name: Chart PR 224 example normalization

on:
  pull_request:
    branches:
      - automation/chart-pr-224-example-normalize-260915

permissions:
  contents: write

env:
  TARGET_BRANCH: feat/chart-first-class-260915

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Move Chart fixture authority to top-level examples
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('packages/semantic-map/tests')
          replacements = {
              '../examples/chart.jsonl': '../../../examples/chart/bar-horizontal.jsonl',
              '../examples/chart-scatter.jsonl': '../../../examples/chart/scatter.jsonl',
              '../examples/chart-heatmap.jsonl': '../../../examples/chart/heatmap.jsonl',
              '../examples/chart-sunburst.jsonl': '../../../examples/chart/sunburst.jsonl',
              '../examples/chart-composition/sales.jsonl': '../../../examples/chart/bar-vertical.jsonl',
              '../examples/chart-composition/active.jsonl': '../../../examples/chart/line.jsonl',
              '../examples/chart-composition/share.jsonl': '../../../examples/chart/pie.jsonl',
          }
          changed = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.suffix not in {'.js', '.mjs', '.py', '.sh'}:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if path.name == 'chart_url_composition_fixture.mjs':
                  updated = updated.replace("definition.source.replace('../examples/', 'examples/')", "definition.source.replace('../../../examples/', 'examples/')")
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          pattern = root / 'pattern_test.mjs'
          text = pattern.read_text(encoding='utf-8')
          old_helper = "function load(name) {\n  return createSemanticMap(parseSemanticMapRecords(fs.readFileSync(new URL(`../examples/${name}`, import.meta.url), 'utf8')));\n}"
          new_helper = "function load(source) {\n  return createSemanticMap(parseSemanticMapRecords(fs.readFileSync(new URL(source, import.meta.url), 'utf8')));\n}"
          if old_helper not in text:
              raise SystemExit('pattern_test load helper shape changed')
          text = text.replace(old_helper, new_helper)
          for old, new in {
              "load('example.jsonl')": "load('../examples/example.jsonl')",
              "load('graph.jsonl')": "load('../examples/graph.jsonl')",
              "load('sequence.jsonl')": "load('../examples/sequence.jsonl')",
              "load('gantt.jsonl')": "load('../examples/gantt.jsonl')",
              "load('chart.jsonl')": "load('../../../examples/chart/bar-horizontal.jsonl')",
          }.items():
              if old not in text:
                  raise SystemExit(f'pattern_test missing {old}')
              text = text.replace(old, new)
          pattern.write_text(text, encoding='utf-8')
          changed.append(str(pattern))

          if not changed:
              raise SystemExit('no legacy Chart fixture references were rewritten')
          print('\n'.join(sorted(set(changed))))
          PY

          git rm --ignore-unmatch \
            examples/chart/example.jsonl \
            packages/semantic-map/examples/chart.jsonl \
            packages/semantic-map/examples/chart-scatter.jsonl \
            packages/semantic-map/examples/chart-heatmap.jsonl \
            packages/semantic-map/examples/chart-sunburst.jsonl \
            packages/semantic-map/examples/chart-composition/sales.jsonl \
            packages/semantic-map/examples/chart-composition/active.jsonl \
            packages/semantic-map/examples/chart-composition/share.jsonl

          if git grep -n -E 'chart\.jsonl|chart-scatter\.jsonl|chart-heatmap\.jsonl|chart-sunburst\.jsonl|chart-composition/(sales|active|share)\.jsonl' -- packages/semantic-map/tests; then
            echo 'legacy Chart example filename remains in Semantic Map tests' >&2
            exit 1
          fi

          test "$(find examples/chart -maxdepth 1 -type f -name '*.jsonl' | wc -l)" -eq 9
          node packages/semantic-map/tests/chart_test.mjs
          node packages/semantic-map/tests/chart_url_composition_fixture.mjs https://semantic.test/app >/tmp/chart-url-composition.json
          node packages/semantic-map/tests/run.mjs
          git diff --check

      - name: Commit normalized examples
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/semantic-map/tests examples/chart packages/semantic-map/examples
          git status --short
          git commit -m 'refactor: normalize Chart examples'
          git push origin HEAD:"$TARGET_BRANCH"
