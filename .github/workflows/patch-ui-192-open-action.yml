name: patch ui-192 exact invocation open action

on:
  push:
    branches:
      - codex/ui-192-invocation-index

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[open-action-patched]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Add exact same-release invocation navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          action = Path('apps/artifact-shell/src/invocation-action.mjs')
          text = action.read_text()
          old = '''export const ARTIFACT_INPUT_ACTION_SCHEMA = "artifact-input-action/1";
          export const ARTIFACT_INPUT_ACTION = "artifact.input.replace";
          '''.replace('          ', '')
          new = '''export const ARTIFACT_INPUT_ACTION_SCHEMA = "artifact-input-action/1";
          export const ARTIFACT_INPUT_ACTION = "artifact.input.replace";
          export const ARTIFACT_INVOCATION_OPEN_ACTION_SCHEMA = "artifact-invocation-open-action/1";
          export const ARTIFACT_INVOCATION_OPEN_ACTION = "artifact.invocation.open";
          '''.replace('          ', '')
          if old not in text: raise SystemExit('action constants anchor missing')
          text = text.replace(old, new, 1)

          old = '''const historyMode = (value, name = "context.history") => {
            invariant(value === "push" || value === "replace", `${name} is invalid`);
            return value;
          };
          '''.replace('          ', '')
          new = '''const historyMode = (value, name = "context.history") => {
            invariant(value === "push" || value === "replace", `${name} is invalid`);
            return value;
          };
          const invocationReference = value => {
            invariant(typeof value === "string" && value.length > 0 && value.length <= 65_536, "context.reference is invalid");
            const marker = "#invoke=";
            const markerAt = value.indexOf(marker);
            invariant(value.startsWith("./") && markerAt > 2 && value.indexOf("#", markerAt + 1) < 0, "context.reference must be a Release-root-relative #invoke reference");
            const runtimePath = value.slice(0, markerAt);
            invariant(!runtimePath.includes("?") && !runtimePath.includes("\\\\"), "context.reference runtime path is unsafe");
            const segments = runtimePath.slice(2).split("/");
            invariant(segments.every(segment => segment.length > 0 && segment !== "." && segment !== ".." && !["current", "head", "latest"].includes(segment.toLowerCase())), "context.reference runtime path is mutable or unsafe");
            invariant(/^[A-Za-z0-9_-]+$/u.test(value.slice(markerAt + marker.length)), "context.reference invoke token is invalid");
            return value;
          };
          '''.replace('          ', '')
          if old not in text: raise SystemExit('history anchor missing')
          text = text.replace(old, new, 1)

          old = '''export const applyArtifactAction = ({ detail, request }) => {
            invariant(plain(detail), "detail must be a plain object");
            if (detail.action === ARTIFACT_STATE_ACTION) return applyArtifactStateAction({ detail, request });
            if (detail.action === ARTIFACT_INPUT_ACTION) return applyArtifactInputAction({ detail, request });
            throw new Error(`artifact-shell-action: detail.action is unsupported: ${String(detail.action ?? "<missing>")}`);
          };
          '''.replace('          ', '')
          new = '''export const applyArtifactInvocationOpenAction = ({ detail }) => {
            invariant(plain(detail), "detail must be a plain object");
            invariant(detail.action === ARTIFACT_INVOCATION_OPEN_ACTION, `detail.action must be ${ARTIFACT_INVOCATION_OPEN_ACTION}`);
            exactKeys(detail.context, ["history", "reference", "schema"], [], "context");
            invariant(detail.context.schema === ARTIFACT_INVOCATION_OPEN_ACTION_SCHEMA, `context.schema must be ${ARTIFACT_INVOCATION_OPEN_ACTION_SCHEMA}`);
            return Object.freeze({
              history: historyMode(detail.context.history),
              navigate: true,
              reference: invocationReference(detail.context.reference),
            });
          };

          export const applyArtifactAction = ({ detail, request }) => {
            invariant(plain(detail), "detail must be a plain object");
            if (detail.action === ARTIFACT_STATE_ACTION) return applyArtifactStateAction({ detail, request });
            if (detail.action === ARTIFACT_INPUT_ACTION) return applyArtifactInputAction({ detail, request });
            if (detail.action === ARTIFACT_INVOCATION_OPEN_ACTION) return applyArtifactInvocationOpenAction({ detail });
            throw new Error(`artifact-shell-action: detail.action is unsupported: ${String(detail.action ?? "<missing>")}`);
          };
          '''.replace('          ', '')
          if old not in text: raise SystemExit('action dispatcher anchor missing')
          action.write_text(text.replace(old, new, 1))

          shell = Path('apps/artifact-shell/src/shell-core.mjs')
          text = shell.read_text()
          old = 'import { ARTIFACT_INPUT_ACTION, ARTIFACT_STATE_ACTION, applyArtifactAction, createArtifactInvocationUrl } from "./invocation-action.mjs";'
          new = 'import { ARTIFACT_INPUT_ACTION, ARTIFACT_INVOCATION_OPEN_ACTION, ARTIFACT_STATE_ACTION, applyArtifactAction, createArtifactInvocationUrl } from "./invocation-action.mjs";'
          if old not in text: raise SystemExit('shell import anchor missing')
          text = text.replace(old, new, 1)
          old = '      onAction: detail => detail?.action === ARTIFACT_STATE_ACTION ? dispatchAction(detail) : undefined,'
          new = '      onAction: detail => detail?.action === ARTIFACT_STATE_ACTION || detail?.action === ARTIFACT_INVOCATION_OPEN_ACTION ? dispatchAction(detail) : undefined,'
          if old not in text: raise SystemExit('shell action route anchor missing')
          text = text.replace(old, new, 1)
          old = '''    const method = `${compiled.history}State`;
              invariant(scope.history && typeof scope.history[method] === "function", `history.${method} is unavailable`);
              const href = await createArtifactInvocationUrl({ base: scope.location.href, request: compiled.request });
          '''.replace('          ', '')
          new = '''    const method = `${compiled.history}State`;
              invariant(scope.history && typeof scope.history[method] === "function", `history.${method} is unavailable`);
              if (compiled.navigate) {
                const target = new URL(compiled.reference, scope.location.href);
                invariant(target.origin === scope.location.origin, "invocation navigation must remain same-origin");
                scope.history[method](null, "", target.href);
                await restoreFromLocation();
                return Object.freeze({
                  action: detail.action,
                  history: compiled.history,
                  href: target.href,
                  navigated: true,
                  schema: "artifact-shell-action-commit/1",
                });
              }
              const href = await createArtifactInvocationUrl({ base: scope.location.href, request: compiled.request });
          '''.replace('          ', '')
          if old not in text: raise SystemExit('shell apply anchor missing')
          shell.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/artifact-shell/src/invocation-action.mjs apps/artifact-shell/src/shell-core.mjs
          git commit -m "feat: open exact indexed invocations in Artifact Shell [open-action-patched]"
          git push origin HEAD:${GITHUB_REF_NAME}
