name: Temporary ui218 golden sync

on:
  push:
    branches:
      - proof/ui218-golden-sync-260915

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d60c04461092aadd514d4e5dcd7dc74a8a47e4d
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bind exact candidate
        run: test "$(git rev-parse HEAD)" = "2d60c04461092aadd514d4e5dcd7dc74a8a47e4d"
      - name: Regenerate only set-topology checked projections
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/set-topology-golden"
          mkdir -p "$tmp/horizontal" "$tmp/vertical"
          node packages/semantic-map/scripts/build-browser-example.mjs \
            --input=examples/render.semantic-map.set-topology/input/envelope.json \
            --out="$tmp/horizontal" \
            --set-topology-proof=true \
            --projection-profile=horizontal
          node packages/semantic-map/scripts/build-browser-example.mjs \
            --input=examples/render.semantic-map.set-topology/input/envelope.json \
            --out="$tmp/vertical" \
            --set-topology-proof=true \
            --projection-profile=vertical
          cp "$tmp/horizontal/index.html" examples/render.semantic-map.set-topology/dist/index.html
          cp "$tmp/horizontal/receipt.json" examples/render.semantic-map.set-topology/dist/receipt.json
          cp "$tmp/vertical/index.html" examples/render.semantic-map.set-topology/dist/vertical.html
          python3 packages/semantic-map/tests/set_topology_example_reproducibility.py
      - name: Verify bounded generated diff and publish temporary output branch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              examples/render.semantic-map.set-topology/dist/index.html|examples/render.semantic-map.set-topology/dist/receipt.json|examples/render.semantic-map.set-topology/dist/vertical.html) ;;
              *) echo "unexpected path: $path" >&2; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/render.semantic-map.set-topology/dist/
          git commit -m 'chore(graph): refresh set-topology generated proof'
          git push origin HEAD:tmp/ui218-golden-output-260915
