name: Report Artifact Action URL candidate

on:
  push:
    branches:
      - proof/build-artifact-action-url-260821

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report target branch identity and diff
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: proposal/artifact-action-url-260821
          BASE: proposals
        shell: bash
        run: |
          set -euo pipefail
          url="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          target_sha="$(git ls-remote "$url" "refs/heads/$TARGET" | awk 'NR==1 {print $1}')"
          test -n "$target_sha"
          base_sha="$(git ls-remote "$url" "refs/heads/$BASE" | awk 'NR==1 {print $1}')"
          git clone --filter=blob:none --no-checkout "$url" repo
          git -C repo fetch --depth=2 origin "$target_sha" "$base_sha"
          files="$(git -C repo diff --name-only "$base_sha" "$target_sha")"
          count="$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)"
          cat > "$RUNNER_TEMP/comment.md" <<EOF
          ## Artifact Action URL candidate status

          - base: \`$base_sha\`
          - candidate: \`$target_sha\`
          - changed files: \`$count\`

          \`\`\`text
          $files
          \`\`\`
          EOF
          gh issue comment 95 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md" || true
