name: Temporary Pages proof 217

on:
  push:
    branches:
      - chore/maxgraph-authoring-consolidation-260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages-proof:
    runs-on: ubuntu-latest
    environment: ui-deploy
    env:
      PROJECT_NAME: ui-maxgraph-authoring-217
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build publication
        run: node apps/artifact-shell/scripts/build-publication.mjs --out=generated/ui-maxgraph-authoring-217

      - name: Create isolated Pages project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          status="$(curl -sS -o "$RUNNER_TEMP/project-get.json" -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "$endpoint")"
          if [ "$status" = "404" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "{\"name\":\"${PROJECT_NAME}\",\"production_branch\":\"${GITHUB_REF_NAME}\"}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              > "$RUNNER_TEMP/project-create.json"
            jq -e '.success == true and .result.name == env.PROJECT_NAME' "$RUNNER_TEMP/project-create.json"
            echo 'created=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" = "200" ]; then
            jq -e '.success == true and .result.name == env.PROJECT_NAME' "$RUNNER_TEMP/project-get.json"
            echo 'created=false' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/project-get.json"
            exit 1
          fi

      - name: Deploy publication
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy generated/ui-maxgraph-authoring-217 \
            --project-name="${PROJECT_NAME}" \
            --branch="${GITHUB_REF_NAME}"

      - name: Resolve deployed URL
        shell: bash
        run: |
          set -euo pipefail
          base="https://${PROJECT_NAME}.pages.dev"
          for attempt in $(seq 1 30); do
            if curl -fsS "$base/index.html" >/dev/null; then
              echo "PAGES_BASE_URL=$base" >> "$GITHUB_ENV"
              echo "pages=$base"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Install pinned browser tooling
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.57.0"
          python3 -m playwright install --with-deps chromium

      - name: Resolve pinned Chromium
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(f"CHROMIUM_EXECUTABLE={playwright.chromium.executable_path}")
          PY

      - name: Prove deployed graph map seq authoring active-list
        env:
          ARTIFACT_SHELL_BASE_URL: ${{ env.PAGES_BASE_URL }}
        run: python3 apps/artifact-shell/tests/maxgraph-active-list-browser-proof.py

      - name: Prove retained direct feature surfaces
        shell: bash
        run: |
          set -euo pipefail
          check_feature() {
            name="$1"; shift
            output="$RUNNER_TEMP/retained-$name.html"
            "$CHROMIUM_EXECUTABLE" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=30000 \
              --dump-dom "$PAGES_BASE_URL/adapters/$name/index.html" > "$output"
            grep -q 'data-status="pass"' "$output"
            for pattern in "$@"; do grep -q "$pattern" "$output"; done
          }
          check_feature presentation 'class="profiled-app"' 'class="seq-svg"'
          check_feature control 'id="tree"' 'class="node"'

      - name: Diagnose retiring graph-editor remote module
        shell: bash
        run: |
          set -u
          url="$PAGES_BASE_URL/modules/packages/graph-editor/render.mjs"
          printf '%s\n' "graph-editor-module=$url"
          curl -sS -D - -o "$RUNNER_TEMP/graph-editor-render.mjs" "$url" || true
          wc -c "$RUNNER_TEMP/graph-editor-render.mjs" || true
          head -c 200 "$RUNNER_TEMP/graph-editor-render.mjs" || true
          printf '\n'

      - name: Receipt
        run: |
          printf '%s\n' "{\"schema\":\"ui.pages-proof/1\",\"status\":\"PASS\",\"project\":\"${PROJECT_NAME}\",\"url\":\"${PAGES_BASE_URL}\",\"projectCreated\":\"${{ steps.project.outputs.created }}\",\"proven\":[\"graph\",\"map\",\"seq\",\"presentation\",\"control\"]}"
