name: T283 repair bootstrap

on:
  push:
    branches:
      - fix/retire-smap-t283

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/retire-smap-t283
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Synchronize current #271
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin feat/opt-manually-and-beautifully
          if ! git merge --no-edit origin/feat/opt-manually-and-beautifully; then
            git status --short
            git diff --name-only --diff-filter=U
            exit 1
          fi
      - name: Finish retired transport cleanup
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/semantic-map/tests/browser_example.py')
          s = p.read_text()
          old = 'assert handoff["text"] and "#smap=" in handoff["url"]'
          new = 'assert handoff["text"] and "#data=" in handoff["url"]'
          if old not in s:
              raise SystemExit('expected retired browser assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node apps/artifact-shell/scripts/build-registry.mjs
      - name: Targeted checks
        run: |
          set -euxo pipefail
          node packages/semantic-map/tests/run.mjs
          npm run check:artifact-runtime-core
      - name: Commit repaired child head
        run: |
          set -euxo pipefail
          rm .github/workflows/t283-fix-bootstrap.yml
          git add -A
          git commit -m 'fix: complete #283 transport retirement on current #271'
          git push origin HEAD:fix/retire-smap-t283
