name: T283 repair bootstrap

on:
  push:
    branches:
      - fix/retire-smap-t283

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/retire-smap-t283
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Synchronize current #271
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin feat/opt-manually-and-beautifully
          if ! git merge --no-edit origin/feat/opt-manually-and-beautifully; then
            git diff --name-only --diff-filter=U | sort > /tmp/actual-conflicts
            printf '%s\n' \
              apps/artifact-shell/publication/build-adapters.mjs \
              apps/artifact-shell/publication/feature-host.html \
              apps/artifact-shell/publication/feature-host.mjs \
              apps/artifact-shell/tests/unified-runtime-data-browser-proof.py \
              | sort > /tmp/expected-conflicts
            diff -u /tmp/expected-conflicts /tmp/actual-conflicts
            xargs -r git rm -- < /tmp/expected-conflicts
            git commit --no-edit
          fi
      - name: Finish retired transport cleanup
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          browser = Path('packages/semantic-map/tests/browser_example.py')
          text = browser.read_text()
          old = 'assert handoff["text"] and "#smap=" in handoff["url"]'
          new = 'assert handoff["text"] and "#data=" in handoff["url"]'
          if old not in text:
              raise SystemExit('expected retired browser assertion not found')
          browser.write_text(text.replace(old, new, 1))

          retirement = Path('packages/semantic-map/tests/transport_retirement_test.mjs')
          text = retirement.read_text()
          old = "  'apps/artifact-shell/publication',"
          new = "  'apps/preview',"
          if old not in text:
              raise SystemExit('expected retired publication scan root not found')
          retirement.write_text(text.replace(old, new, 1))

          preview = Path('apps/preview/index.html')
          text = preview.read_text()
          expected = text.count('#smap')
          if expected != 2:
              raise SystemExit(f'expected exactly 2 retired preview #smap mentions, found {expected}')
          preview.write_text(text.replace('#smap', '#data'))
          PY
          node apps/artifact-shell/scripts/build-registry.mjs
      - name: Targeted checks
        run: |
          set -euxo pipefail
          node packages/semantic-map/tests/run.mjs
          npm run check:artifact-runtime-core
      - name: Commit repaired child head
        run: |
          set -euxo pipefail
          rm .github/workflows/t283-fix-bootstrap.yml
          git add -A
          git commit -m 'fix: complete #283 transport retirement on current #271'
          git push origin HEAD:fix/retire-smap-t283
