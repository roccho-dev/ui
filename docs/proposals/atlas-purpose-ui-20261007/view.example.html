const labels={purpose:'目的',ideal:'理想',current:'現在',gap:'Gap',fill:'仕事',receipt:'結果',residual:'残件'};

const byId=rows=>new Map(rows.map(r=>[r.id,r]));
const relations=rows=>{const e=[];for(const n of rows){if(n.kind==='purpose')for(const p of n.parents)e.push([p,n.id,'parent']);if(n.kind==='ideal')for(const p of n.purposes)e.push([p,n.id,'ideal']);if(n.kind==='gap'){e.push([n.current,n.id,'current'],[n.ideal,n.id,'gap'])}if(n.kind==='fill')for(const g of n.gaps)e.push([g,n.id,'fill']);if(n.kind==='receipt')e.push([n.fill,n.id,'receipt']);if(n.kind==='residual'){e.push([n.receipt,n.id,'residual']);for(const q of n.next)e.push([n.id,q,'next'])}}return e;};
const refFields={purpose:['parents'],ideal:['purposes'],current:[],gap:['current','ideal'],fill:['gaps'],receipt:['fill'],residual:['receipt','next']};const meaning=n=>JSON.stringify(Object.fromEntries(Object.entries(n).filter(([k])=>k!=='sources'&&!refFields[n.kind].includes(k))));const refs=n=>JSON.stringify(refFields[n.kind].map(k=>[k,n[k]]));
const key=e=>JSON.stringify(e);let before,after,oldEdges,added,removed,changed,relChanged,sourceChanged;
function choosePair(index){snapshots=inputPairs[index];before=byId(snapshots[0]);after=byId(snapshots[1]);oldEdges=new Set(relations(snapshots[0]).map(key));added=new Set([...after.keys()].filter(id=>!before.has(id)));removed=new Set([...before.keys()].filter(id=>!after.has(id)));changed=new Set([...after.keys()].filter(id=>before.has(id)&&meaning(after.get(id))!==meaning(before.get(id))));relChanged=new Set([...after.keys()].filter(id=>before.has(id)&&refs(after.get(id))!==refs(before.get(id))));sourceChanged=new Set([...after.keys()].filter(id=>before.has(id)&&JSON.stringify(after.get(id).sources)!==JSON.stringify(before.get(id).sources)));}
const inputPairs=[snapshots,[snapshots[1],snapshots[0]]];choosePair(0);
const make=(tag,attrs,parent)=>{const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e};
function field(title,value){const box=document.createElement('div');box.className='field';const b=document.createElement('b');b.textContent=title;const p=document.createElement('p');p.textContent=value;box.append(b,p);document.querySelector('#fields').append(box)}
function pathToPurpose(rows,start){const nodes=byId(rows),pending=[[start]],out=[];while(pending.length){const trail=pending.pop(),n=nodes.get(trail.at(-1));if(!n)continue;let next=n.kind==='purpose'?n.parents:n.kind==='ideal'?n.purposes:n.kind==='current'?rows.filter(q=>q.kind==='gap'&&q.current===n.id).map(q=>q.id):n.kind==='gap'?[n.ideal]:n.kind==='fill'?n.gaps:n.kind==='receipt'?[n.fill]:[n.receipt];if(n.kind==='purpose'&&!next.length)out.push(trail);for(const target of next)if(!trail.includes(target))pending.push([...trail,target]);}return out}
function inspector(rows){const current=byId(rows).get(selected),detailRows=current?rows:snapshots[1-mode],n=current??byId(detailRows).get(selected);document.querySelector('#fields').replaceChildren();document.querySelector('#paths').replaceChildren();document.querySelector('#selected').textContent=n?labels[n.kind]+' · '+n.id:'選択対象はこのsnapshotに存在しません';document.querySelector('#raw').textContent=n?JSON.stringify(n,null,2):selected;if(!n)return;if(!current){field('比較側での不在','このsnapshotに未掲載・理由未提供');field('内容の出所',mode?'before snapshotの保持された内容':'after snapshotの保持された内容')}field('宣言',n.label);const nodes=byId(detailRows);if(n.kind==='gap'){field('Current',nodes.get(n.current)?.value??n.current);field('Ideal',nodes.get(n.ideal)?.value??n.ideal);field('宣言されたdelta',n.delta);field('担当 / 必要なproof',n.owner+' / '+n.proof)}if(n.kind==='fill')field('対象Gap / scope',n.gaps.join(', ')+' / '+n.scope.join('、'));if(n.kind==='receipt')field('Fill / 結果 / evidence',n.fill+' / '+n.status+' / '+n.evidence.join(', '));if(n.kind==='residual'){field('原因となるReceipt',n.receipt);field('次のCurrent / Gap',n.next.length?n.next.join(', '):'未割当（完了ではない）');for(const target of n.next){const b=document.createElement('button');b.textContent='次へ：'+target;b.onclick=()=>{selected=target;render()};document.querySelector('#fields').append(b)}}if(n.kind==='current'||n.kind==='ideal')field(n.kind==='current'?'Current':'Ideal',n.value);for(const trail of pathToPurpose(detailRows,n.id)){const p=document.createElement('div');p.className='path';p.textContent=trail.join(' → ');document.querySelector('#paths').append(p)}}
function render(){const rows=snapshots[mode];document.querySelector('#before').setAttribute('aria-pressed',mode===0);document.querySelector('#after').setAttribute('aria-pressed',mode===1);document.querySelector('#state').textContent=rows.length+'要素 · 同じIDの選択を保持';document.querySelector('#delta').textContent=mode?'差分：追加 '+added.size+' / 未掲載 '+removed.size+' / 意味変更 '+changed.size+' / 関係追加 '+relations(rows).filter(e=>!oldEdges.has(key(e))).length+' / 関係未掲載 '+relations(snapshots[0]).filter(e=>!new Set(relations(rows).map(key)).has(key(e))).length+' / 参照更新record '+relChanged.size+' / 出所更新 '+sourceChanged.size+'（監査）':'before：'+rows.length+' records。比較caseは明示された独立valid pair。';const edges=document.querySelector('#edges'),nodes=document.querySelector('#nodes');edges.replaceChildren();nodes.replaceChildren();for(const edge of relations(rows)){const[a,b,kind]=edge,pa=coords[a],pb=coords[b];if(!pa||!pb)continue;const fresh=mode&&!oldEdges.has(key(edge));let d;if(kind==='next')d='M '+(pa[0]+w)+','+(pa[1]+h/2)+' C 800,'+(pa[1]+h/2)+' 800,'+(pb[1]+h/2)+' '+(pb[0]+w)+','+(pb[1]+h/2);else{const dx=pb[0]-pa[0],dy=pb[1]-pa[1],scale=1/Math.max(Math.abs(dx)/(w/2),Math.abs(dy)/(h/2));const x1=pa[0]+w/2+dx*scale,y1=pa[1]+h/2+dy*scale,x2=pb[0]+w/2-dx*scale,y2=pb[1]+h/2-dy*scale;d='M '+x1+','+y1+' L '+x2+','+y2;}make('path',{d,class:'edge'+(fresh?' added':''),'marker-end':fresh?'url(#new-arrow)':'url(#arrow)'},edges)}
for(const n of rows){const p=coords[n.id];if(!p)continue;const state=mode&&added.has(n.id)?'added':mode&&changed.has(n.id)?'changed':mode&&relChanged.has(n.id)?'relation':'';const g=make('g',{class:'node '+state+(selected===n.id?' selected':''),transform:'translate('+p.join(',')+')',role:'button',tabindex:'0','aria-label':n.id},nodes);make('rect',{width:w,height:h,rx:7},g);const t=make('text',{x:10,y:21,class:'kind'},g);t.textContent=(state==='added'?'＋ ':state==='changed'?'~ ':state==='relation'?'↗ ':'')+labels[n.kind];const id=make('text',{x:10,y:41,class:'id'},g);id.textContent=n.label.replace(/^例[：:]/,'').slice(0,14)+(n.label.length>14?'…':'');const title=make('title',{},g);title.textContent=n.label+' / '+n.id;g.onclick=()=>{selected=n.id;render()};g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=n.id;render()}};}inspector(rows)}
