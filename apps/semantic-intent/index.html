<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semantic intent</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 44rem; margin: 0 auto; padding: 2rem 1rem; line-height: 1.5; }
    form, section { display: grid; gap: .75rem; }
    label { display: grid; gap: .25rem; }
    input, textarea, button { font: inherit; padding: .55rem .7rem; }
    textarea { min-height: 8rem; resize: vertical; }
    .actions { display: flex; gap: .5rem; }
    dl { display: grid; grid-template-columns: 9rem 1fr; gap: .5rem 1rem; }
    dt { font-weight: 600; }
    dd { margin: 0; }
    output[data-state="unknown"], output[data-state="pending"] { font-weight: 600; }
    output[data-state="rejected"], output[data-state="failed"], output[data-state="permanent_failure"] { font-weight: 700; }
    pre { overflow: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>意味論ログ</h1>
    <p>明示的に送信した内容だけを、固定されたlocal入口へ提出します。</p>

    <form id="intent-form">
      <label>
        Topic ID
        <input id="topic-id" name="topic_id" required autocomplete="off" placeholder="topic-id">
      </label>
      <label>
        Topic title（新規topicの初回だけ）
        <input id="topic-title" name="topic_title" autocomplete="off" placeholder="既存topicでは空欄">
      </label>
      <label>
        Body
        <textarea id="body" name="body" required placeholder="記録する意味を入力"></textarea>
      </label>
      <div class="actions">
        <button id="submit-intent" type="submit">記録する</button>
        <button id="retry-intent" type="button" hidden>同じ内容を再送する</button>
      </div>
    </form>

    <section aria-labelledby="state-title">
      <h2 id="state-title">状態</h2>
      <dl>
        <dt>通信</dt>
        <dd><output id="transport-state" data-state="idle">未送信</output></dd>
        <dt>Local</dt>
        <dd><output id="local-state" data-state="unknown">未確認</output></dd>
        <dt>GitHub</dt>
        <dd><output id="github-state" data-state="not_started">未開始</output></dd>
        <dt>Issue</dt>
        <dd><output id="issue-identity">—</output></dd>
        <dt>ADRS authority</dt>
        <dd><output id="authority-state" data-state="not_accepted">未受理（本UIの権限外）</output></dd>
      </dl>
      <details>
        <summary>診断情報</summary>
        <pre id="diagnostics">{}</pre>
      </details>
    </section>
  </main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
